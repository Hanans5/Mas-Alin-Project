# /etc/nginx/sites-available/nelin-batik — virtual host for Nelin Batik.
# server_name: nelin.home for the LAN, nelin.necutbarber.shop is the dev address.
server {
    listen 80;
    listen [::]:80;
    server_name nelin.home nelin.necutbarber.shop;

    client_max_body_size 10m;   # product photos, logo

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PocketBase realtime (SSE) must not be buffered.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
}
