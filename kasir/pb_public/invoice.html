<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Invoice</title>
<!-- A4 invoice for one sale (2026-10-08). Public and read-only: the link's
     #token is the key; /api/invoice/view/{token} returns that one invoice. -->
<style>
:root{--accent:#4A0404;--ink:#1d1715;--muted:#6b5f5a;--line:#e4dcd7;--soft:#f7f1ee;--ok:#16803c;--warn:#a15c00;--bad:#c62828}
*{box-sizing:border-box}
html{background:#ece6e2}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:210mm;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;justify-content:flex-end}
.bar button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
.sheet{position:relative;background:#fff;max-width:210mm;min-height:297mm;margin:12px auto 24px;padding:14mm 14mm 12mm;box-shadow:0 2px 18px rgba(0,0,0,.12);overflow:hidden}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid var(--accent);padding-bottom:12px}
.shop{display:flex;gap:14px;align-items:flex-start;min-width:0}
.shop img{width:110px;height:auto;object-fit:contain;flex:none}
.shop h1{margin:0 0 2px;font-size:20px;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.shop .addr{color:var(--muted);font-size:12px;white-space:pre-line}
.title{text-align:right;flex:none}
.title h2{margin:0;font-size:26px;letter-spacing:.12em;color:var(--accent)}
.title .no{font-weight:700;font-size:15px}
.title .dt{color:var(--muted);font-size:12px}
.badge{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.08em;border:2px solid currentColor}
.badge.LUNAS{color:var(--ok)}.badge.DP,.badge.BELUM{color:var(--warn)}.badge.DIBATALKAN{color:var(--bad)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.meta div{background:var(--soft);border-radius:10px;padding:8px 12px}
.meta small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.meta b{font-size:14px;word-break:break-word}
.body{display:grid;grid-template-columns:1fr;gap:18px}
.body.promo{grid-template-columns:1fr 52mm}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--accent);padding:7px 10px}
th:last-child,td:last-child{text-align:right;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td .q{color:var(--muted);font-size:12px}
td .n{color:var(--accent);font-size:11px;font-weight:700}
.neg{color:var(--bad)}
.sum{margin-left:auto;width:min(100%,82mm);margin-top:10px}
.sum div{display:flex;justify-content:space-between;padding:3px 10px}
.sum .grand{background:var(--accent);color:#fff;border-radius:8px;font-size:16px;font-weight:800;padding:8px 10px;margin:4px 0}
.sum .sisa{color:var(--warn);font-weight:800}
.pays{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pays h3,.terms h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pays div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:2px 0}
.terms{margin-top:14px}
.terms p{margin:0;columns:2;column-gap:18px;font-size:12px;color:var(--muted);white-space:pre-line}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px;text-align:center}
.sign small{color:var(--muted)}
.sign .line{height:56px;border-bottom:1px solid var(--ink);margin-bottom:4px}
.promo-box{border-radius:12px;overflow:hidden;background:var(--soft);align-self:start;text-align:center}
.promo-box img{display:block;width:100%;height:auto}
.promo-box div{padding:8px 10px;font-size:12px}
.promo-box b{display:block;color:var(--accent);font-size:13px}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:11px}
.void{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.void span{transform:rotate(-24deg);font-size:72px;font-weight:900;letter-spacing:.1em;color:rgba(198,40,40,.13);border:8px solid rgba(198,40,40,.13);padding:8px 28px;border-radius:18px}
.msg{max-width:480px;margin:18vh auto;background:#fff;border-radius:14px;padding:24px;text-align:center;box-shadow:0 2px 18px rgba(0,0,0,.12)}
@media (max-width:640px){
  .sheet{min-height:0;margin:8px 0 16px;padding:18px 16px;box-shadow:none}
  .bar{padding:0 16px;margin-top:10px}
  .top{flex-direction:column}.title{text-align:left}
  .shop img{width:80px}
  .meta{grid-template-columns:1fr}
  .body.promo{grid-template-columns:1fr}
  .promo-box{max-width:260px;justify-self:center}
  .terms p{columns:1}
  .sign{gap:16px}
}
@page{size:A4;margin:0}
@media print{
  html{background:#fff}
  .bar{display:none}
  .sheet{margin:0;box-shadow:none;max-width:none;width:210mm;min-height:297mm}
}
</style>
</head>
<body>
<div class="bar" id="bar" hidden><button type="button" id="pdf">⤓ Unduh PDF / Cetak</button></div>
<div id="app"><div class="msg">Memuat invoice…</div></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => (n < 0 ? '-' : '') + 'Rp ' + Math.abs(Number(n || 0)).toLocaleString('id-ID');
const when = s => s ? new Date(s.replace(' ', 'T')).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const day = s => s ? new Date(s + 'T00:00:00+07:00').toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'long', year: 'numeric' }) : '';
// Darken the theme colour until white text on it (and it on white) reads at 4.5:1.
function readable(hex) {
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lum = c => { const [r, g, b] = c.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  let c = rgb(/^#[0-9a-f]{6}$/i.test(hex) ? hex : '#4A0404');
  while (1.05 / (lum(c) + 0.05) < 4.5) c = c.map(v => v * 0.92);
  return '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
async function main() {
  const [token, flag] = location.hash.slice(1).split('&');
  const app = document.getElementById('app');
  let d;
  try {
    const r = await fetch('/api/invoice/view/' + encodeURIComponent(token || '-'));
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || 'Invoice tidak ditemukan.');
    d = await r.json();
  } catch (e) { app.innerHTML = `<div class="msg"><b>Invoice tidak bisa dibuka</b><p>${esc(e.message)}</p></div>`; return; }
  const s = d.sale, st = d.store, c = d.customer;
  document.documentElement.style.setProperty('--accent', readable(st.accent));
  document.title = `Invoice ${s.number} · ${st.name}`;
  const cust = c.code ? `${esc(c.code)} | ${esc(c.name)}${c.phone ? ` (${esc(c.phone)})` : ''}` : esc(c.name);
  const handed = s.paid + s.change;
  app.innerHTML = `<div class="sheet">
    ${s.status === 'DIBATALKAN' ? '<div class="void"><span>DIBATALKAN</span></div>' : ''}
    <div class="top">
      <div class="shop">${st.logo ? `<img src="${esc(st.logo)}" alt="">` : ''}
        <div><h1>${esc(st.name)}</h1><div class="addr">${esc(st.header || [st.address, st.phone].filter(Boolean).join('\n'))}</div></div></div>
      <div class="title"><h2>INVOICE</h2><div class="no">${esc(s.number)}</div><div class="dt">${when(s.created)}</div>
        <span class="badge ${s.status.split(' ')[0]}">${esc(s.status)}</span></div>
    </div>
    <div class="meta">
      <div><small>Tanggal transaksi</small><b>${when(s.created)}</b></div>
      <div><small>Pelanggan</small><b>${cust}</b></div>
      <div><small>Dilayani oleh</small><b>${esc(d.signer)}</b></div>
    </div>
    <div class="body ${d.promo ? 'promo' : ''}">
      <div>
        ${s.kind === 'tukar' ? '<div style="margin-bottom:6px;font-weight:700">Tukar barang</div>' : ''}
        <table><thead><tr><th>Deskripsi</th><th>Total</th></tr></thead><tbody>
          ${d.items.map(i => `<tr><td><b>${esc(i.name)}</b><div class="q">${i.pack_size ? `${i.qty / i.pack_size} Pack (${i.pack_size} pcs) × ${rp(Math.round(i.subtotal / (i.qty / i.pack_size)))} · ${i.qty} pcs` : `${rp(i.price)} × ${i.qty}`}</div>${i.note ? `<div class="n">${esc(i.note)}</div>` : ''}</td>
            <td class="${i.subtotal < 0 ? 'neg' : ''}">${rp(i.subtotal)}</td></tr>`).join('')}
        </tbody></table>
        <div class="sum">
          <div><span>Subtotal</span><span>${rp(s.subtotal)}</span></div>
          ${s.discount ? `<div><span>Diskon</span><span class="neg">-${rp(s.discount)}</span></div>` : ''}
          <div class="grand"><span>Grand Total</span><span>${rp(s.total)}</span></div>
          <div><span>Total dibayar</span><span>${rp(handed)}</span></div>
          ${s.change ? `<div><span>Kembali</span><span>${rp(s.change)}</span></div>` : ''}
          ${s.sisa ? `<div class="sisa"><span>Sisa bayar</span><span>${rp(s.sisa)}</span></div>` : ''}
        </div>
        ${d.payments.length ? `<div class="pays"><h3>Pembayaran</h3>${d.payments.map(p => `<div><span>${when(p.at)} · ${esc([p.label, p.method].filter(Boolean).join(' · '))}</span><b>${rp(p.amount)}</b></div>`).join('')}</div>` : ''}
        ${d.terms ? `<div class="terms"><h3>Catatan</h3><p>${esc(d.terms)}</p></div>` : ''}
        <div class="sign">
          <div><small>Tanda tangan pelanggan</small><div class="line"></div><b>${esc(c.name)}</b></div>
          <div><small>Tanda tangan kasir</small><div class="line"></div><b>${esc(d.signer)}</b></div>
        </div>
      </div>
      ${d.promo ? `<aside class="promo-box"><img src="${esc(d.promo.image)}" alt="Promo">${d.promo.title || d.promo.until ? `<div>${d.promo.title ? `<b>${esc(d.promo.title)}</b>` : ''}${d.promo.until ? `Berlaku s/d ${day(d.promo.until)}` : ''}</div>` : ''}</aside>` : ''}
    </div>
    <div class="foot">Terima kasih telah berbelanja di ${esc(st.name)}.${s.legacy ? ' Transaksi dari sistem lama.' : ''}</div>
  </div>`;
  const bar = document.getElementById('bar');
  bar.hidden = false;
  document.getElementById('pdf').onclick = () => print();
  if (flag === 'print') {
    const imgs = [...app.querySelectorAll('img')].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; }));
    Promise.all(imgs).then(() => setTimeout(print, 300));
  }
}
addEventListener('hashchange', () => location.reload());
main();
</script>
</body>
</html>
