// ── shared: date ranges, sub-tabs, export ───────────
// All ranges are WIB calendar days; the server turns them into UTC bounds.
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10);
function presetRange(k) {
  const t = wibToday(), [y, m] = t.split('-').map(Number);
  const first = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}-01`;
  if (k === 'today') return [t, t];
  if (k === 'yesterday') return [addDays(t, -1), addDays(t, -1)];
  // weeks start on Monday
  const dow = (new Date(t + 'T00:00:00Z').getUTCDay() + 6) % 7;
  if (k === 'week') return [addDays(t, -dow), t];
  if (k === 'lastweek') return [addDays(t, -dow - 7), addDays(t, -dow - 1)];
  if (k === 'lastyear') return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  if (k === '7d') return [addDays(t, -6), t];
  if (k === 'month') return [first(y, m), t];
  if (k === 'lastmonth') { const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y; return [first(py, pm), addDays(first(y, m), -1)]; }
  if (k === 'year') return [`${y}-01-01`, t];
  // Rolling windows ending yesterday, so a period is whole days.
  if (k === '1m') return [addDays(t, -30), addDays(t, -1)];
  if (k === '3m') return [addDays(t, -91), addDays(t, -1)];
  if (k === '6m') return [addDays(t, -182), addDays(t, -1)];
}
const fd = d => new Date(d + 'T00:00:00Z').toLocaleDateString('id-ID', { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' });
// Renders preset buttons + two date inputs into `el`; calls onChange(from, to).
function rangePicker(el, state, onChange) {
  const presets = [['today', 'Hari ini'], ['yesterday', 'Kemarin'], ['week', 'Minggu ini'], ['lastweek', 'Minggu lalu'], ['month', 'Bulan ini'], ['lastmonth', 'Bulan lalu'],
    ['year', 'Tahun ini'], ['lastyear', 'Tahun lalu'], ['1m', '1 bulan'], ['3m', '3 bulan'], ['6m', '6 bulan']];
  el.innerHTML = `<div class="toolbar range">
    <div class="chips" style="padding:0">${presets.map(([k, l]) => `<button class="chip ${state.preset === k ? 'on' : ''}" data-p="${k}">${l}</button>`).join('')}</div>
    <input class="input" type="date" id="rf" value="${state.from}"><input class="input" type="date" id="rt" value="${state.to}">
  </div>`;
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    [state.from, state.to] = presetRange(b.dataset.p); state.preset = b.dataset.p;
    rangePicker(el, state, onChange); onChange();
  });
  const custom = () => {
    const f = $('#rf', el).value, t = $('#rt', el).value;
    if (!f || !t) return;
    state.from = f <= t ? f : t; state.to = f <= t ? t : f; state.preset = '';
    rangePicker(el, state, onChange); onChange();
  };
  $('#rf', el).onchange = custom; $('#rt', el).onchange = custom;
}
function subTabs(el, tabs, state, key, onChange) {
  el.innerHTML = `<div class="subtabs">${tabs.map(([k, l]) => `<button data-st="${k}" class="${state[key] === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { state[key] = b.dataset.st; subTabs(el, tabs, state, key, onChange); onChange(); syncNav(); });
  // on a phone the row scrolls sideways; keep the chosen tab in sight
  const on = $('.on', el), row = on?.parentElement;
  if (on && row.scrollWidth > row.clientWidth) row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
}
function downloadCSV(name, rows) {
  const cell = v => { const s = String(v ?? ''); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  // BOM + semicolons so Excel in Indonesian locale opens it in columns.
  const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// Print a report on A4 (the receipt path prints 58mm). Browser "Save as PDF" gives the PDF.
function printReport(title, html) {
  $('#print').innerHTML = `<div class="report-print"><h2>${esc(S.settings.store_name)} — ${esc(title)}</h2>${html}</div>`;
  printAs('a4');
}

// ── tukar barang (item swap) ────────────────────────
// Swaps only, per Mas Alin: returned items go back on the shelf, new items
// leave it, the buyer pays any difference; never money back. The server
// (/api/pos/swap) decides prices and limits; this screen previews them.
function askSwap() {
  openModal(`<h2>Tukar barang</h2>
    <form id="swf"><label class="f" for="swn">Nomor transaksi di struk</label>
      <input class="input num" id="swn" placeholder="mis. TRX-261006-0001" autocapitalize="characters" autocomplete="off" required>
      <div id="swerr"></div>
      <div class="row" style="margin-top:14px"><button type="button" class="btn" id="swno">Batal</button><button class="btn primary">Cari</button></div></form>`);
  $('#swn').focus();
  $('#swno').onclick = closeModal;
  $('#swf').onsubmit = async ev => {
    ev.preventDefault();
    try { await openSwap($('#swn').value.trim()); }
    catch (e) { $('#swerr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
}
async function openSwap(key) {
  const orig = await api(`/api/pos/swap/${encodeURIComponent(key)}`);
  if (!S.products?.length || !S.methods?.length) await loadCatalog();
  const back = Object.fromEntries(orig.items.map(i => [i.product, 0]));
  // Returned pcs go back on the shelf first (server too), so they count as available.
  const avail = id => (prodById(id)?.stock || 0) + (back[id] || 0);
  const add = [];
  let q = '', swEmp = '';
  const draw = () => {
    const backVal = orig.items.reduce((a, i) => a + i.price * back[i.product], 0);
    const newVal = add.reduce((a, l) => a + lineTotal(l), 0);
    const diff = newVal - backVal;
    const hits = q.trim().length >= 2 ? S.products.filter(p => (p.name + ' ' + p.sku + ' ' + (p.barcode || '')).toLowerCase().includes(q.trim().toLowerCase())).slice(0, 6) : [];
    openModal(`
      <h2>Tukar barang <span class="num muted" style="font-size:15px">${esc(orig.number)}</span></h2>
      <div class="muted">${fmtTime(orig.created)} · ${esc(orig.customer || 'Umum')} · total ${rp(orig.total)}</div>
      <h3 class="sec">1. Barang yang dikembalikan</h3>
      ${orig.items.map(i => `<div class="swline ${i.left ? '' : 'off'}">
        <div><b>${esc(i.name)}</b><div class="muted sm">${rp(i.price)}/pcs · dibeli ${i.sold}${i.returned ? `, sudah ditukar ${i.returned}` : ''}</div></div>
        ${i.left ? `<div class="qty"><button type="button" data-bd="${i.product}" aria-label="Kurangi">−</button><input data-bq="${i.product}" value="${back[i.product]}" inputmode="numeric" aria-label="Jumlah dikembalikan"><button type="button" data-bi="${i.product}" aria-label="Tambah">+</button></div>` : `<span class="muted sm">habis ditukar</span>`}
      </div>`).join('')}
      <h3 class="sec">2. Barang baru</h3>
      <input class="input" id="swq" placeholder="Cari nama / SKU / scan barcode…" value="${esc(q)}" autocomplete="off">
      ${hits.length ? `<div class="swhits">${hits.map(p => `<button type="button" data-add="${p.id}" ${avail(p.id) ? '' : 'disabled'}><b>${esc(p.name)}</b><span class="muted sm">${rp(p.price)} · stok ${p.stock}</span></button>`).join('')}</div>` : ''}
      ${add.map(l => { const p = prodById(l.id); return `<div class="swline">
        <div><b>${esc(p.name)}</b><div class="muted sm">${linePricing(l).map(x => partLabel(x, true)).join(' + ')}</div></div>
        <div class="qty"><button type="button" data-nd="${l.id}" aria-label="Kurangi">−</button><input data-nq="${l.id}" value="${l.qty}" inputmode="numeric" aria-label="Jumlah barang baru"><button type="button" data-ni="${l.id}" aria-label="Tambah">+</button></div>
      </div>`; }).join('') || `<div class="muted sm">Belum ada barang baru.</div>`}
      <h3 class="sec">3. Selisih</h3>
      <div class="sum"><span>Barang dikembalikan</span><span class="num">${rp(backVal)}</span></div>
      <div class="sum"><span>Barang baru</span><span class="num">${rp(newVal)}</span></div>
      <div class="sum total"><span>${diff >= 0 ? 'Pembeli bayar' : 'Kurang'}</span><span class="num">${rp(Math.abs(diff))}</span></div>
      ${diff < 0 ? `<div class="err">Barang baru lebih murah. Tukar hanya untuk barang senilai atau lebih mahal, uang tidak dikembalikan. Tambah barang atau pilih yang lain.</div>` : ''}
      ${diff > 0 ? `<div class="row" style="margin-top:8px"><select class="input" id="swm">${S.methods.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
        <input class="input num" id="swp" inputmode="numeric" placeholder="Uang diterima" value="${diff}"></div>` : ''}
      ${S.employees?.length ? `<select class="input" id="swe" style="margin-top:8px" aria-label="Karyawan yang melayani"><option value="">Pilih karyawan yang melayani…</option>${S.employees.map(x => `<option value="${x.id}" ${swEmp === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="toko" ${swEmp === 'toko' ? 'selected' : ''}>Toko (tanpa karyawan)</option></select>` : ''}
      <input class="input" id="swnote" placeholder="Catatan (mis. ukuran kekecilan)" maxlength="120" style="margin-top:8px">
      <div id="swerr2"></div>
      <div class="row" style="margin-top:14px"><button type="button" class="btn" id="swcancel">Batal</button>
        <button type="button" class="btn primary" id="swok" ${backVal && newVal && diff >= 0 && (!S.employees?.length || swEmp) ? '' : 'disabled'}>Simpan tukar</button></div>`);
    if ($('#swe')) $('#swe').onchange = () => { swEmp = $('#swe').value; draw(); };
    const lim = id => orig.items.find(i => i.product === id).left;
    const setBack = (id, n) => { back[id] = Math.max(0, Math.min(lim(id), parseInt(n, 10) || 0)); draw(); };
    const setNew = (id, n) => { const l = add.find(x => x.id === id); const p = prodById(id); l.qty = Math.max(0, Math.min(avail(id), parseInt(n, 10) || 0)); if (!l.qty) add.splice(add.indexOf(l), 1); draw(); };
    document.querySelectorAll('[data-bi]').forEach(b => b.onclick = () => setBack(b.dataset.bi, back[b.dataset.bi] + 1));
    document.querySelectorAll('[data-bd]').forEach(b => b.onclick = () => setBack(b.dataset.bd, back[b.dataset.bd] - 1));
    document.querySelectorAll('[data-bq]').forEach(i => i.onchange = () => setBack(i.dataset.bq, i.value));
    document.querySelectorAll('[data-ni]').forEach(b => b.onclick = () => setNew(b.dataset.ni, add.find(x => x.id === b.dataset.ni).qty + 1));
    document.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => setNew(b.dataset.nd, add.find(x => x.id === b.dataset.nd).qty - 1));
    document.querySelectorAll('[data-nq]').forEach(i => i.onchange = () => setNew(i.dataset.nq, i.value));
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const l = add.find(x => x.id === b.dataset.add); if (l) return setNew(l.id, l.qty + 1); add.push({ id: b.dataset.add, qty: 1 }); q = ''; draw(); });
    const sq = $('#swq');
    sq.oninput = () => { q = sq.value; clearTimeout(sq.t); sq.t = setTimeout(() => { draw(); const n = $('#swq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 200); };
    sq.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); const p = S.products.find(x => x.barcode && x.barcode === sq.value.trim() || x.sku === sq.value.trim().toUpperCase()); if (p) { const l = add.find(x => x.id === p.id); if (l) l.qty++; else add.push({ id: p.id, qty: 1 }); q = ''; draw(); } } };
    $('#swcancel').onclick = closeModal;
    $('#swok').onclick = async () => {
      const b = $('#swok'); b.disabled = true;
      try {
        const r = await api('/api/pos/swap', { method: 'POST', body: {
          sale: orig.id, returns: orig.items.filter(i => back[i.product]).map(i => ({ product: i.product, qty: back[i.product] })),
          items: add.map(l => ({ product: l.id, qty: l.qty })),
          payment_method: $('#swm')?.value || '', paid: parseInt(($('#swp')?.value || '0').replace(/\D/g, ''), 10) || 0,
          note: $('#swnote').value.trim(), employee: swEmp } });
        await loadCatalog();
        showReceipt(r.sale, r.items, true);
        S.reloadTx?.();
      } catch (e) { $('#swerr2').innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false; }
    };
  };
  draw();
}

// ── laporan: 8 report tables, Excel (.xlsx) and PDF ─
const REP_TYPES = [['ringkasan', 'Ringkasan'], ['penjualan', 'Penjualan'], ['produk', 'Produk'], ['kategori', 'Kategori'], ['pelanggan', 'Pelanggan'],
  ['karyawan', 'Karyawan'], ['piutang', 'Piutang'], ['preorder', 'Pre-Order'], ['pengeluaran', 'Pengeluaran'], ['retur', 'Tukar barang']];
const repCell = (c, v) => c.type === 'rp' ? rp(v) : c.type === 'num' ? Number(v || 0).toLocaleString('id-ID') : c.type === 'date' ? (v ? fmtTime(v) : '') : c.type === 'day' ? (v ? fd(String(v).slice(0, 10)) : '') : String(v ?? '');
// Long reports (a year of Penjualan is ~3,700 rows) show CB_PAGE rows at a
// time like Buku Kas; Excel and PDF still get every row.
let rtSeq = 0;
async function viewReportTable(el, type) {
  const seq = ++rtSeq;
  el.innerHTML = `<div class="empty">Memuat…</div>`;
  let r;
  try { r = await api(`/api/reports/table?type=${type}&from=${RS.from}&to=${RS.to}`); }
  catch (e) { if (seq === rtSeq) el.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if (seq !== rtSeq || !el.isConnected) return;
  const cols = r.columns, num = c => c.type === 'rp' || c.type === 'num';
  const period = RS.from === RS.to ? fd(RS.from) : `${fd(RS.from)} – ${fd(RS.to)}`;
  const rowHtml = x => `<tr>${cols.map(c => `<td data-l="${esc(c.label)}" class="${num(c) ? 'r num' : ''}">${esc(repCell(c, x[c.key]))}</td>`).join('')}</tr>`;
  const build = rows => `<table class="tbl"><thead><tr>${cols.map(c => `<th class="${num(c) ? 'r' : ''}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>
    ${r.rows.length ? rows.map(rowHtml).join('') : `<tr><td colspan="${cols.length}" class="empty">Tidak ada data di periode ini.</td></tr>`}
    ${r.rows.length ? `<tr class="totrow">${cols.map((c, i) => `<td data-l="${esc(c.label)}" class="${num(c) ? 'r num' : ''}"><b>${i === 0 ? 'Total' : num(c) ? esc(repCell(c, r.totals[c.key])) : ''}</b></td>`).join('')}</tr>` : ''}
    </tbody></table>`;
  let shown = Math.min(CB_PAGE, r.rows.length);
  const more = () => r.rows.length > shown ? `<button class="btn block" id="rmore" style="margin-top:10px">Tampilkan ${Math.min(CB_PAGE, r.rows.length - shown)} baris berikutnya · ${shown} dari ${r.rows.length}</button>` : '';
  const lg = r.legacy, note = !lg ? '' : lg.included
    ? `Termasuk total sistem lama (${fd(lg.first)} – ${fd(lg.last)}), lihat kolom "Dari sistem lama". Sistem lama hanya punya total, tanpa tanggal per transaksi.`
    : lg.overlaps ? `Total sistem lama per ${type === 'kategori' || type === 'produk' ? 'produk' : type} hanya punya total ${fd(lg.first)} – ${fd(lg.last)}, tanpa tanggal: pilih periode yang mencakup seluruh masa itu untuk menyertakannya.` : '';
  el.innerHTML = `<div class="toolbar"><div class="muted" style="flex:1;align-self:center">${esc(r.title)} · ${period} · ${r.rows.length} baris</div>
      <button class="btn" id="rxl">⬇ Excel</button><button class="btn" id="rpdf">⬇ PDF</button></div>
    ${note ? `<div class="muted sm" style="margin:-4px 0 10px">${esc(note)}${lg.included ? '' : ` <button class="link" id="rlg">Pakai ${fd(lg.first)} – ${fd(lg.last)}</button>`}</div>` : ''}
    <div class="card tblwrap" id="rtt">${build(r.rows.slice(0, shown))}</div><div id="rtm">${more()}</div>`;
  const wireMore = () => { const b = $('#rmore'); if (b) b.onclick = () => {
    $('#rtt .totrow').insertAdjacentHTML('beforebegin', r.rows.slice(shown, shown + CB_PAGE).map(rowHtml).join(''));
    shown = Math.min(shown + CB_PAGE, r.rows.length); $('#rtm').innerHTML = more(); wireMore(); }; };
  wireMore();
  const fname = `${r.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}_${RS.from}_${RS.to}`;
  $('#rxl').onclick = () => {
    const head = cols.map(c => c.label);
    const body = r.rows.map(x => cols.map(c => num(c) ? Number(x[c.key] || 0) : repCell(c, x[c.key])));
    const tot = cols.map((c, i) => i === 0 ? 'Total' : num(c) ? Number(r.totals[c.key] || 0) : '');
    downloadXLSX(fname + '.xlsx', r.title, [[`${S.settings.store_name} — ${r.title}`], [`Periode ${period}`], [], head, ...body, ...(r.rows.length ? [tot] : [])], cols.map(c => c.type === 'rp'));
  };
  $('#rpdf').onclick = () => { toast('Pilih "Simpan sebagai PDF" di jendela cetak.'); printReport(`${r.title} ${period}`, (note ? `<p>${esc(note)}</p>` : '') + build(r.rows)); };
  const lgb = $('#rlg');
  if (lgb) lgb.onclick = () => { Object.assign(RS, { from: lg.first, to: lg.last, preset: 'custom' }); viewReports(); };
}

// Minimal .xlsx writer: one sheet, inline strings, numbers as numbers, rupiah
// columns formatted #,##0. Files are zipped uncompressed ("stored"), which
// Excel, LibreOffice and Google Sheets all open.
function downloadXLSX(name, sheet, rows, rpCols) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const widths = [];
  rows.forEach((r, ri) => { if (ri > 2) r.forEach((v, i) => { widths[i] = Math.min(50, Math.max(widths[i] || 8, String(typeof v === 'number' ? v.toLocaleString('id-ID') : v ?? '').length + 2)); }); });
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r, ri) =>
    `<row r="${ri + 1}">${r.map((v, ci) => v === '' || v == null ? '' : typeof v === 'number'
      ? `<c r="${col(ci)}${ri + 1}"${rpCols[ci] ? ' s="1"' : ''}><v>${v}</v></c>`
      : `<c r="${col(ci)}${ri + 1}" t="inlineStr"${ri === 3 || ri === 0 ? ' s="2"' : ''}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const files = {
    '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
    '_rels/.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    'xl/workbook.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(sheet.slice(0, 31).replace(/[\\/?*[\]:]/g, ' '))}" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    'xl/styles.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf numFmtId="164" applyNumberFormat="1"/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>`,
    'xl/worksheets/sheet1.xml': sheetXml,
  };
  const blob = zipStore(files);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// ZIP with "stored" entries (no compression): local headers, data, central directory.
function zipStore(files) {
  const enc = new TextEncoder(), crcT = zipStore.t || (zipStore.t = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; }));
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let off = 0;
  for (const [n, s] of Object.entries(files)) {
    const name = enc.encode(n), data = enc.encode(s), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(h, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c, name);
    off += 30 + name.length + data.length;
  }
  const size = central.reduce((a, p) => a + (p.byteLength ?? p.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// ── dasbor (owner/admin) ────────────────────────────
async function viewDash() {
  $('#view').innerHTML = `<div class="empty">Memuat…</div>`;
  try {
    const d = await api('/api/reports/dashboard');
    const t = d.today;
    $('#view').innerHTML = `
      <div class="muted" style="margin-bottom:10px">Hari ini, ${fd(d.date)}</div>
      <div class="stats">
        <div class="card stat"><small>Transaksi</small><b class="num">${t.count}</b></div>
        <div class="card stat"><small>Omzet</small><b class="num">${rp(t.omzet)}</b>${t.legacy ? `<small class="muted">termasuk sistem lama ${rp(t.legacy)}</small>` : ''}</div>
        ${t.gross_profit !== undefined ? `<div class="card stat"><small>Laba kotor</small><b class="num" style="color:var(--ok)">${rp(t.gross_profit)}</b></div>` : ''}
        ${d.preorders?.count ? `<button class="card stat" id="dpo" style="text-align:left;cursor:pointer"><small>Pre-order aktif (${d.preorders.count})${d.preorders.ready ? ` · ${d.preorders.ready} siap diambil` : ''}</small><b class="num">DP ${rp(d.preorders.dp)}</b><small class="muted">sisa ${rp(d.preorders.rest)}</small></button>` : ''}
        ${d.receivables ? `<div class="card stat"><small>Piutang terbuka (${d.receivables.count})</small><b class="num" style="color:var(--warn)">${rp(d.receivables.amount)}</b></div>` : ''}
      </div>
      <div class="two">
        <section><h3 class="sec">Terlaris hari ini</h3><div class="card">${d.top.length ? d.top.map((p, i) => `
          <div class="tx"><span><b>${i + 1}. ${esc(p.name)}</b></span><b class="num">${p.qty} pcs</b><small class="muted"></small><small class="muted num">${rp(p.amount)}</small></div>`).join('') : '<div class="empty">Belum ada penjualan.</div>'}</div></section>
        <section><h3 class="sec">Stok menipis</h3><div class="card">${d.lowStock.length ? d.lowStock.map(p => `
          <div class="tx"><span><b>${esc(p.name)}</b></span><span class="badge warn num">${p.stock}</span><small class="muted">${esc(p.sku)}</small><small class="muted">min ${p.min_stock}</small></div>`).join('') : '<div class="empty">Semua stok aman.</div>'}</div></section>
      </div>
      ${isManager() ? '<div id="ov"></div>' : ''}`;

const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
function ovRange(k) {

  if (k === '12m') { const [y, m] = t.split('-').map(Number), d = new Date(Date.UTC(y, m - 12, 1)); return [d.toISOString().slice(0, 10), t]; }
  return presetRange(k);
}
// Short rupiah for axis labels: 1,2 M / 45 jt / 900 rb.
const rpShort = v => v >= 1e9 ? (v / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M' : v >= 1e6 ? Math.round(v / 1e6).toLocaleString('id-ID') + ' jt' : v >= 1e3 ? Math.round(v / 1e3) + ' rb' : String(v);
// Old-system daily totals (legacy_sales) carry no items, pelanggan, karyawan or methods.

    const oldTotal = sales.legacy.reduce((a, d) => a + d.total, 0);

        ${pl ? `<div class="card stat"><small>Laba kotor</small><b class="num" style="color:var(--ok)">${rp(pl.gross_profit)}</b></div>` : ''}
      </div>
      ${oldTotal ? `<div class="muted sm" style="margin:-4px 0 10px">${legacyNote(sales.legacy)}</div>` : ''}
      <section class="card ov-chart" aria-label="Penjualan ${byDay ? 'per hari' : 'per bulan'}"><h3 class="sec" style="margin:0 0 6px">Penjualan ${byDay ? 'per hari' : 'per bulan'}</h3>

          ${buckets.map(b => `<tr><td data-l="${byDay ? 'Tanggal' : 'Bulan'}">${b.full}</td><td data-l="Transaksi" class="r num">${b.count.toLocaleString('id-ID')}</td><td data-l="Omzet" class="r num">${rp(b.total)}</td></tr>`).join('')}</tbody></table></details>

          <div class="ov-foot"><span>${umum ? `Pembeli umum (tanpa member): ${rp(umum.penjualan)}` : ''}</span><button class="btn sm" data-rep="pelanggan">Laporan lengkap</button></div></section>

// Ranked horizontal bars, value in text beside each (the bar is only the shape).
function hbars(rows, sub, empty) {
  if (!rows.length) return `<div class="empty">${empty}</div>`;
  const max = Math.max(...rows.map(r => r.penjualan), 1);
  return `<div class="hb-list">${rows.map(r => `<div class="hb">
    <span class="hb-n">${esc(r.nama)}</span><span class="hb-v num">${rp(r.penjualan)}</span><span class="hb-s">${sub(r)}</span>
    <span class="hb-t" aria-hidden="true"><i style="width:${(r.penjualan / max * 100).toFixed(1)}%"></i></span></div>`).join('')}</div>`;
}
// Vertical bars in SVG at the container's real width (text stays 11px on a
// phone), 4 recessive grid lines, the best period labelled, a tooltip per bar
// on hover, tap or keyboard focus.
function barChart(box, tip, data) {
  const W = Math.max(280, box.clientWidth), H = 220, L = 52, R = 6, T = 18, B = 24, pw = W - L - R, ph = H - T - B;
  const maxV = Math.max(...data.map(d => d.total), 0);
  if (!maxV) { box.innerHTML = `<div class="empty">Belum ada penjualan di periode ini.</div>`; return; }
  const raw = maxV / 4, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw), top = step * 4;
  const band = pw / data.length, bw = Math.max(3, Math.min(36, band * 0.68)), y = v => T + ph - v / top * ph;
  const every = Math.ceil(data.length / Math.max(1, Math.floor(pw / 34)));   // thin out day labels on narrow screens
  const peak = data.reduce((a, d) => d.total > a.total ? d : a, data[0]);
  let svg = '';
  for (let i = 0; i <= 4; i++) { const v = step * i, yy = y(v).toFixed(1); svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="axis" x="${L - 6}" y="${yy}" dy="4" text-anchor="end">${i ? rpShort(v) : '0'}</text>`; }
  data.forEach((d, i) => {
    const cx = L + band * i + band / 2, x = cx - bw / 2, h = d.total / top * ph, yy = T + ph - h, r = Math.min(4, bw / 2, h);
    const shape = h > 0 ? `<path class="bar" d="M${x},${T + ph}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + bw - r}Q${x + bw},${yy} ${x + bw},${yy + r}V${T + ph}Z"/>` : '<path class="bar" d=""/>';
    svg += `<rect class="hit" data-i="${i}" x="${L + band * i}" y="${T}" width="${band}" height="${ph}" tabindex="0" aria-label="${esc(d.full)}: ${rp(d.total)}, ${d.count} transaksi"/>${shape}`;
    if (i % every === 0) svg += `<text class="axis" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  const pcx = L + band * data.indexOf(peak) + band / 2;
  svg += `<text class="peak" x="${Math.min(Math.max(pcx, L + 30), W - R - 30)}" y="${y(peak.total) - 6}" text-anchor="middle">${rpShort(peak.total)}</text>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Grafik batang penjualan">${svg}</svg>`;
  const show = el => {
    const d = data[+el.dataset.i], cx = L + band * +el.dataset.i + band / 2;
    tip.innerHTML = `<b>${esc(d.full)}</b>${rp(d.total)} · ${d.count.toLocaleString('id-ID')} transaksi`;
    tip.style.display = 'block';
    const half = tip.offsetWidth / 2 + 4, left = Math.min(Math.max(cx + 14, half), box.clientWidth + 14 - half);
    tip.style.left = left + 'px'; tip.style.top = (box.offsetTop + y(d.total) - 8) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; };
  box.querySelectorAll('.hit').forEach(h => { h.onpointerenter = () => show(h); h.onclick = () => show(h); h.onfocus = () => show(h); h.onpointerleave = hide; h.onblur = hide; });
}

    $('#ym').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { method = b.dataset.m; $('#ym').querySelectorAll('button').forEach(z => z.classList.toggle('on', z === b)); });
    $('#yno').onclick = closeModal;
    $('#yok').onclick = async () => {
      $('#yok').disabled = true;
      try {
        const r = await api('/api/receivables/pay', { method: 'POST', body: { receivable: x.id, amount: parseInt($('#ya').value.replace(/\D/g, ''), 10) || 0, payment_method: method, note: $('#yn').value.trim() } });
        closeModal(); toast(r.left ? `Tersimpan. Sisa ${rp(r.left)}.` : 'Lunas!'); load();
      } catch (e) { $('#yerr').innerHTML = `<div class="err">${esc(e.message)}</div>`; $('#yok').disabled = false; }
    };

  };

    openModal(`<h2>Riwayat ${esc(x.expand?.sale?.number || '')}</h2>
      <div class="sum"><span>Piutang awal</span><b class="num">${rp(x.amount)}</b></div>
      ${p.items.map(y => `<div class="sum"><span>${fmtTime(y.created)} · ${esc(y.expand?.payment_method?.name || '')}<br><small class="muted">${esc(y.note)} ${esc(y.expand?.by?.name || '')}</small></span><span class="num" style="color:var(--ok)">−${rp(y.amount)}</span></div>`).join('') || '<div class="empty">Belum ada pembayaran.</div>'}
      <div class="sum total"><span>Sisa</span><span class="num">${rp(x.status === 'belum' ? x.amount - x.paid : 0)}</span></div>`);
  };
  load();
}

// A year is ~4,000 lines: drawing them all at once froze phones for seconds,
// so the screen shows CB_PAGE lines at a time (print and Excel get all of
// them). cbSeq drops a slow reply when another period was picked meanwhile.
const CB_PAGE = 200;
let cbSeq = 0;
async function finCashbook(el) {
  const seq = ++cbSeq;
  el.innerHTML = `<div class="empty">Memuat…</div>`;
  try {
    const r = await api(`/api/reports/cashbook?from=${FS.from}&to=${FS.to}`);
    if (seq !== cbSeq || !el.isConnected) return;
    // One section per group (Tunai, Transfer, Split = a sale paid with both),
    // each with its own running balance and subtotal; TOTAL sums them at the bottom.
    const rowHtml = l => `<tr>
      <td data-l="Tanggal" class="num">${fd(l.day)}</td>
      <td data-l="Sumber">${esc(l.source)}${l.ref ? ` <span class="muted num">${esc(l.ref)}</span>` : ''}${l.note ? `<div class="muted sm">${esc(l.note)}</div>` : ''}</td>
      <td data-l="Metode">${esc(l.method) || '—'}</td>
      <td data-l="Masuk" class="r num" style="color:var(--ok)">${l.type === 'masuk' ? rp(l.amount) : ''}</td>
      <td data-l="Keluar" class="r num" style="color:var(--bad)">${l.type === 'keluar' ? rp(l.amount) : ''}</td>
      <td data-l="Saldo" class="r num"><b>${rp(l.gbalance)}</b></td></tr>`;
    const byGroup = Object.fromEntries(r.groups.map(g => [g.name, r.lines.filter(l => l.grp === g.name)]));
    const groups = r.groups.filter(g => ['Tunai', 'Transfer', 'Split'].includes(g.name) || g.opening || byGroup[g.name].length);
    const none = '<tr><td colspan="6" class="empty">Tidak ada arus kas di periode ini.</td></tr>';
    const head = g => `<table class="tbl"><thead><tr><th>Tanggal</th><th>Sumber</th><th>Metode</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo</th></tr></thead>
      <tbody><tr class="hl"><td colspan="5">Saldo awal ${esc(g.name)}</td><td class="r num"><b>${rp(g.opening)}</b></td></tr>`;
    const sub = g => `<tr class="totrow"><td colspan="3" data-l=""><b>Subtotal ${esc(g.name)}</b></td><td data-l="Masuk" class="r num" style="color:var(--ok)"><b>${rp(g.total_in)}</b></td>
      <td data-l="Keluar" class="r num" style="color:var(--bad)"><b>${rp(g.total_out)}</b></td><td data-l="Saldo akhir" class="r num"><b>${rp(g.closing)}</b></td></tr>`;
    const section = (g, rows) => head(g) + (rows.map(rowHtml).join('') || none) + sub(g) + '</tbody></table>';
    const totalTable = `<table class="tbl"><thead><tr><th></th><th class="r">Saldo awal</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo akhir</th></tr></thead><tbody>
      ${groups.map(g => `<tr><td data-l="">${esc(g.name)}</td><td data-l="Saldo awal" class="r num">${rp(g.opening)}</td><td data-l="Masuk" class="r num" style="color:var(--ok)">${rp(g.total_in)}</td>
        <td data-l="Keluar" class="r num" style="color:var(--bad)">${rp(g.total_out)}</td><td data-l="Saldo akhir" class="r num">${rp(g.closing)}</td></tr>`).join('')}
      <tr class="totrow"><td data-l=""><b>TOTAL</b></td><td data-l="Saldo awal" class="r num"><b>${rp(r.opening)}</b></td><td data-l="Masuk" class="r num" style="color:var(--ok)"><b>${rp(r.total_in)}</b></td>
        <td data-l="Keluar" class="r num" style="color:var(--bad)"><b>${rp(r.total_out)}</b></td><td data-l="Saldo akhir" class="r num"><b>${rp(r.closing)}</b></td></tr></tbody></table>`;
    const shown = {};
    el.innerHTML = `
      <div class="stats">
        <div class="card stat"><small>Saldo awal</small><b class="num">${rp(r.opening)}</b></div>
        <div class="card stat"><small>Masuk</small><b class="num" style="color:var(--ok)">${rp(r.total_in)}</b></div>
        <div class="card stat"><small>Keluar</small><b class="num" style="color:var(--bad)">${rp(r.total_out)}</b></div>
        <div class="card stat"><small>Saldo akhir</small><b class="num">${rp(r.closing)}</b></div>
      </div>
      <div class="toolbar"><button class="btn primary" id="cnew">+ Catat kas manual</button><button class="btn" id="cprint">🖨 Cetak / PDF</button><button class="btn" id="ccsv">⬇ Excel (CSV)</button></div>
      ${groups.map((g, i) => `<h3 class="sec">${esc(g.name)}${g.name === 'Split' ? ' <small class="muted">(satu transaksi dibayar Tunai + Transfer)</small>' : ''}</h3>
        <div class="card tblwrap" data-g="${i}"></div><div data-gm="${i}"></div>`).join('')}
      <h3 class="sec">TOTAL</h3><div class="card tblwrap">${totalTable}</div>
      <div class="muted sm" style="margin-top:8px">Dihitung otomatis dari penjualan, pembayaran piutang dan pengeluaran. "Catat kas manual" untuk modal awal, setoran ke bank, prive, dll.</div>`;
    // Each section shows CB_PAGE lines at a time.
    groups.forEach((g, i) => {
      const rows = byGroup[g.name];
      shown[i] = Math.min(CB_PAGE, rows.length);
      $(`[data-g="${i}"]`, el).innerHTML = section(g, rows.slice(0, shown[i]));
      const more = () => {
        const box = $(`[data-gm="${i}"]`, el);
        box.innerHTML = rows.length > shown[i] ? `<button class="btn block" style="margin-top:10px">Tampilkan ${Math.min(CB_PAGE, rows.length - shown[i])} baris berikutnya · ${shown[i]} dari ${rows.length}</button>` : '';
        const btn = box.querySelector('button');
        if (btn) btn.onclick = () => {
          $(`[data-g="${i}"] .totrow`, el).insertAdjacentHTML('beforebegin', rows.slice(shown[i], shown[i] + CB_PAGE).map(rowHtml).join(''));
          shown[i] = Math.min(shown[i] + CB_PAGE, rows.length); more();
        };
      };
      more();
    });
    $('#cprint').onclick = () => printReport(`Buku Kas ${fd(r.from)} – ${fd(r.to)}`,
      groups.map(g => `<h3>${esc(g.name)}</h3>${section(g, byGroup[g.name])}`).join('') + `<h3>TOTAL</h3>${totalTable}`);
    $('#ccsv').onclick = () => downloadCSV(`buku-kas_${r.from}_${r.to}.csv`, [['Kelompok', 'Tanggal', 'Sumber', 'Ref', 'Metode', 'Keterangan', 'Masuk', 'Keluar', 'Saldo'],
      ...groups.flatMap(g => [[g.name, '', 'Saldo awal', '', '', '', '', '', g.opening],
        ...byGroup[g.name].map(l => [g.name, l.day, l.source, l.ref, l.method, l.note, l.type === 'masuk' ? l.amount : '', l.type === 'keluar' ? l.amount : '', l.gbalance]),
        [g.name, '', 'Subtotal ' + g.name, '', '', '', g.total_in, g.total_out, g.closing]]),
      ['TOTAL', '', 'TOTAL', '', '', '', r.total_in, r.total_out, r.closing]]);
    $('#cnew').onclick = async () => {
      const methods = (await list('payment_methods', { sort: 'created' })).items;
      openModal(`<h2>Catat kas manual</h2>
        <form id="mf"><div class="pick" id="mty" style="grid-template-columns:1fr 1fr"><button type="button" data-t="masuk" class="on">Uang masuk</button><button type="button" data-t="keluar">Uang keluar</button></div>
        <div class="row"><div><label class="f">Tanggal</label><input class="input" type="date" id="md" value="${wibToday()}" max="${wibToday()}" required></div>
        <div><label class="f">Jumlah (Rp)</label><input class="input num" id="ma" inputmode="numeric" required></div></div>
        <label class="f">Metode</label><select class="input" id="mm"><option value="">—</option>${methods.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
        <label class="f">Keterangan</label><input class="input" id="mn" required maxlength="300" placeholder="mis. modal awal laci, setor ke bank">
        <div id="merr"></div>
        <div class="row" style="margin-top:16px"><button type="button" class="btn" id="mno">Batal</button><button class="btn primary" id="mok">Simpan</button></div></form>`);
      let type = 'masuk';
      $('#mty').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { type = b.dataset.t; $('#mty').querySelectorAll('button').forEach(z => z.classList.toggle('on', z === b)); });
      $('#mno').onclick = closeModal;
      $('#mf').onsubmit = async ev => {
        ev.preventDefault();
        try {
          await api('/api/collections/cash_entries/records', { method: 'POST', body: { date: $('#md').value + ' 00:00:00.000Z', type,
            amount: parseInt($('#ma').value.replace(/\D/g, ''), 10) || 0, payment_method: $('#mm').value, note: $('#mn').value.trim(), by: S.user.id } });
          closeModal(); toast('Tercatat.'); finCashbook(el);
        } catch (e) { $('#merr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
      };
    };
  } catch (e) { if (seq === cbSeq) el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// ── laporan penjualan (owner/admin) ─────────────────
const RS = { from: presetRange('month')[0], to: wibToday(), preset: 'month', type: 'ringkasan' };
function viewReports() {
  $('#view').innerHTML = `<div id="rsub"></div><div id="rrange"></div><div id="rbody"></div>`;
  subTabs($('#rsub'), REP_TYPES, RS, 'type', () => load());
  const load = async () => {
    const el = $('#rbody');
    if (RS.type !== 'ringkasan') return viewReportTable(el, RS.type);
    el.innerHTML = `<div class="empty">Memuat…</div>`;
    try {
      const r = await api(`/api/reports/sales?from=${RS.from}&to=${RS.to}`);
      // Old-system days are summed into their day and tagged "sistem lama".
      const old = Object.fromEntries(r.legacy.map(d => [d.day, d]));
      r.perDay = Object.values([...r.perDay, ...r.legacy].reduce((acc, d) => {
        const x = acc[d.day] = acc[d.day] || { day: d.day, count: 0, subtotal: 0, discount: 0, total: 0, old: 0 };
        x.count += d.count; x.subtotal += d.subtotal; x.discount += d.discount; x.total += d.total;
        if (old[d.day] === d) x.old += d.total;
        return acc;
      }, {})).sort((a, b) => a.day < b.day ? -1 : 1);
      const tot = r.perDay.reduce((a, d) => ({ count: a.count + d.count, total: a.total + d.total, discount: a.discount + d.discount }), { count: 0, total: 0, discount: 0 });
      // Long ranges read better per month than as 180 daily rows.
      const byMonth = r.perDay.length > 62;
      const series = byMonth ? Object.values(r.perDay.reduce((acc, d) => {
        const k = d.day.slice(0, 7);
        acc[k] = acc[k] || { day: k, count: 0, subtotal: 0, discount: 0, total: 0, old: 0 };
        acc[k].count += d.count; acc[k].subtotal += d.subtotal; acc[k].discount += d.discount; acc[k].total += d.total; acc[k].old += d.old;
        return acc;
      }, {})) : r.perDay;
      const label = d => byMonth ? new Date(d + '-01T00:00:00Z').toLocaleDateString('id-ID', { timeZone: 'UTC', month: 'long', year: 'numeric' }) : fd(d);
      const max = Math.max(1, ...series.map(d => d.total));
      const tbl = (head, rows) => `<table class="tbl"><thead><tr>${head.map(h => `<th class="${h[1] || ''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${head.length}" class="empty">—</td></tr>`}</tbody></table>`;
      const days = tbl([[byMonth ? 'Bulan' : 'Tanggal'], ['Transaksi', 'r'], ['Diskon', 'r'], ['Omzet', 'r'], ['']], series.map(d => `<tr><td data-l="${byMonth ? 'Bulan' : 'Tanggal'}">${label(d.day)}${d.old ? ` <span class="badge">${d.old === d.total ? 'sistem lama' : 'termasuk sistem lama'}</span>` : ''}</td><td data-l="Transaksi" class="r num">${d.count}</td><td data-l="Diskon" class="r num">${rp(d.discount)}</td><td data-l="Omzet" class="r num"><b>${rp(d.total)}</b></td><td class="barcell"><span class="bar" style="width:${Math.round(d.total / max * 100)}%"></span></td></tr>`).join(''));
      const prods = tbl([['Produk'], ['Terjual', 'r'], ['Nilai', 'r']], r.perProduct.map(p => `<tr><td data-l="Produk"><b>${esc(p.name)}</b><div class="muted sm">${esc(p.sku)}</div></td><td data-l="Terjual" class="r num">${p.qty}</td><td data-l="Nilai" class="r num">${rp(p.amount)}</td></tr>`).join(''));
      const meth = tbl([['Metode'], ['Transaksi', 'r'], ['Diterima', 'r']], r.perMethod.map(m => `<tr><td data-l="Metode">${esc(m.method)}</td><td data-l="Transaksi" class="r num">${m.count}</td><td data-l="Diterima" class="r num">${rp(m.paid)}</td></tr>`).join(''));
      const cash = tbl([['Kasir'], ['Transaksi', 'r'], ['Omzet', 'r']], r.perCashier.map(c => `<tr><td data-l="Kasir">${esc(c.cashier)}</td><td data-l="Transaksi" class="r num">${c.count}</td><td data-l="Omzet" class="r num">${rp(c.total)}</td></tr>`).join(''));
      el.innerHTML = `
        <div class="stats">
          <div class="card stat"><small>Transaksi</small><b class="num">${tot.count}</b></div>
          <div class="card stat"><small>Omzet</small><b class="num">${rp(tot.total)}</b></div>
          <div class="card stat"><small>Rata-rata / transaksi</small><b class="num">${rp(tot.count ? tot.total / tot.count : 0)}</b></div>
          <div class="card stat"><small>Total diskon</small><b class="num">${rp(tot.discount)}</b></div>
        </div>
        ${r.legacy.length ? `<div class="muted sm" style="margin:-4px 0 10px">${legacyNote(r.legacy)}</div>` : ''}
        <div class="toolbar"><button class="btn" id="rpp">🖨 Cetak / PDF</button><button class="btn" id="rpc">⬇ Excel (CSV) per produk</button><button class="btn" id="rpd">⬇ Excel (CSV) per hari</button></div>
        <h3 class="sec">${byMonth ? 'Per bulan' : 'Per hari'}</h3><div class="card">${days}</div>
        <div class="two"><section><h3 class="sec">Per produk</h3><div class="card">${prods}</div></section>
        <section><h3 class="sec">Per metode bayar</h3><div class="card">${meth}</div><h3 class="sec">Per kasir</h3><div class="card">${cash}</div></section></div>`;
      $('#rpp').onclick = () => printReport(`Laporan Penjualan ${fd(RS.from)} – ${fd(RS.to)}`, `<p>${tot.count} transaksi · omzet ${rp(tot.total)}</p>${r.legacy.length ? `<p>${legacyNote(r.legacy)}</p>` : ''}<h3>${byMonth ? 'Per bulan' : 'Per hari'}</h3>${days}<h3>Per produk</h3>${prods}<h3>Per metode</h3>${meth}<h3>Per kasir</h3>${cash}`);
      $('#rpc').onclick = () => downloadCSV(`penjualan-produk_${RS.from}_${RS.to}.csv`, [['Produk', 'SKU', 'Terjual', 'Nilai'], ...r.perProduct.map(p => [p.name, p.sku, p.qty, p.amount])]);
      $('#rpd').onclick = () => downloadCSV(`penjualan-harian_${RS.from}_${RS.to}.csv`, [['Tanggal', 'Transaksi', 'Subtotal', 'Diskon', 'Omzet', 'Dari sistem lama'], ...r.perDay.map(d => [d.day, d.count, d.subtotal, d.discount, d.total, d.old])]);
    } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  rangePicker($('#rrange'), RS, load);
  load();
}

// ── bon at the counter ──────────────────────────────
// Owner, admin and the shared kasir login take bon payments. The cart shows
// a notice when the chosen pelanggan still owes; Transaksi → Bayar bon finds
// any open bon by name, phone or receipt number.
async function refreshCustomerBon() {
  const c = S.customer;
  S.customerBon = null;
  if (!c) return;
  try {
    const r = await api(`/api/bon/open?customer=${encodeURIComponent(c.id)}`);
    if (S.customer?.id === c.id) S.customerBon = r.items.length ? r : null;
  } catch (_) {}
  if ($('#cart')) renderCart();
}
function openBonSearch(opts = {}) {
  let q = opts.q || '';
  const draw = async () => {
    openModal(`<h2>Bayar bon${opts.label ? ' · ' + esc(opts.label) : ''}</h2>
      ${opts.customer ? '' : `<input class="input" id="bq" placeholder="Nama, no HP, atau no. transaksi" value="${esc(q)}" autocomplete="off">`}
      <div id="bres" style="margin-top:8px"><div class="empty">Memuat…</div></div>
      <button class="btn block" id="bclose" style="margin-top:10px">Tutup</button>`);
    $('#bclose').onclick = () => { closeModal(); opts.after?.(); };
    const load = async () => {
      try {
        const r = await api(`/api/bon/open?${opts.customer ? 'customer=' + encodeURIComponent(opts.customer) : 'q=' + encodeURIComponent(q)}`);
        if (!$('#bres')) return;
        $('#bres').innerHTML = r.items.length ? `<div class="muted sm" style="margin-bottom:4px">${r.items.length} bon · sisa ${rp(r.total)}</div>` + r.items.map(b => `
          <div class="list-item"><span><b>${esc(b.name || '-')}</b>${b.phone ? ` <small class="muted">${esc(b.phone)}</small>` : ''}<br>
            <small class="muted"><span class="num">${esc(b.number)}</span> · ${fmtTime(b.created)}${b.due ? ' · jatuh tempo ' + fd(String(b.due).slice(0, 10)) : ''}</small></span>
            <span class="r"><b class="num">${rp(b.amount - b.paid)}</b><br><small class="muted">dari ${rp(b.amount)}</small></span>
            <button class="btn sm primary" data-bon="${b.id}">Bayar</button></div>`).join('')
          : `<div class="empty">Tidak ada bon yang belum lunas.</div>`;
        $('#bres').querySelectorAll('[data-bon]').forEach(x => x.onclick = () => payBon(r.items.find(b => b.id === x.dataset.bon), draw));

// Proof for the pelanggan after a bon payment: print on the receipt printer or send on WhatsApp.
function bonProof(b, pay, done) {
  const st = S.settings, now = new Date().toISOString().replace('T', ' ');
  const lines = [
    ['Pembayaran bon', ''], ['No. transaksi', b.number], ['Pelanggan', b.name || '-'],
    ['Dibayar', `${rp(pay.amount)} (${pay.method})`], ['Sisa bon', pay.left ? rp(pay.left) : 'LUNAS'],
  ];
  const html = `<div class="receipt">${receiptHead()}<hr>
    <div>${fmtTime(now)} · ${esc(S.user.name || S.user.username)}</div><hr>
    ${lines.map(([k, v]) => v === '' ? `<div><b>${esc(k.toUpperCase())}</b></div>` : `<div class="r"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}
    <hr><div class="c">Terima kasih</div></div>`;
  const text = [`*${st.store_name}*`, 'Bukti pembayaran bon', fmtTime(now), '', `No. transaksi: ${b.number}`, `Dibayar: ${rp(pay.amount)} (${pay.method})`,
    pay.left ? `Sisa bon: ${rp(pay.left)}` : 'Bon LUNAS', '', 'Terima kasih!'].join('\n');
  openModal(`<h2>✓ Pembayaran bon tersimpan</h2>${html}
    <div class="row"><button class="btn" id="bpprint">🖨 Cetak</button>${b.phone ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${waNumber(b.phone)}?text=${encodeURIComponent(text)}">WhatsApp</a>` : ''}</div>
    <button class="btn primary block" id="bpdone" style="margin-top:8px">Selesai</button>`);
  $('#bpprint').onclick = () => { $('#print').innerHTML = html; printAs('receipt'); };
  $('#bpdone').onclick = () => { closeModal(); done?.(); };
}

// Paying a bon from the pelanggan page: same route as Keuangan → Piutang.
async function payBon(b, done) {
  const methods = (await list('payment_methods', { filter: 'active = true', sort: 'created' })).items;
  const left = b.amount - b.paid;
  let method = methods.find(m => m.is_cash)?.id || methods[0]?.id || '';
  openModal(`<h2>Bayar bon ${esc(b.number)}</h2>
    <div class="muted">Sisa ${rp(left)} dari ${rp(b.amount)}</div>
    <label class="f">Metode</label><div class="pick" id="bm">${methods.map(m => `<button type="button" data-m="${m.id}" class="${m.id === method ? 'on' : ''}">${esc(m.name)}</button>`).join('')}</div>
    <label class="f" for="ba">Jumlah</label><input class="input num" id="ba" inputmode="numeric" value="${left}">
    <div class="pick" style="margin-top:6px"><button type="button" id="bfull">Lunasi ${rp(left)}</button></div>
    <label class="f" for="bn">Catatan</label><input class="input" id="bn" maxlength="300">
    <div id="berr"></div>
    <div class="row" style="margin-top:14px"><button type="button" class="btn" id="bno">Batal</button><button type="button" class="btn primary" id="bok">Simpan pembayaran</button></div>`);
  $('#bm').querySelectorAll('[data-m]').forEach(x => x.onclick = () => { method = x.dataset.m; $('#bm').querySelectorAll('button').forEach(y => y.classList.toggle('on', y === x)); });
  $('#bfull').onclick = () => { $('#ba').value = left; };
  $('#bno').onclick = closeModal;
  $('#bok').onclick = async () => {
    const amount = parseInt($('#ba').value.replace(/\D/g, ''), 10) || 0;
    if (amount < 1 || amount > left) { $('#berr').innerHTML = `<div class="err">Jumlah antara Rp 1 dan ${rp(left)}.</div>`; return; }
    $('#bok').disabled = true;
    try {
      const r = await api('/api/receivables/pay', { method: 'POST', body: { receivable: b.id, amount, payment_method: method, note: $('#bn').value.trim() } });
      bonProof(b, { amount, method: methods.find(m => m.id === method)?.name || '', left: r.left }, done);
    } catch (e) { $('#berr').innerHTML = `<div class="err">${esc(e.message)}</div>`; $('#bok').disabled = false; }
  };
}

    $('#etbl').innerHTML = `<thead><tr><th>Karyawan</th><th class="r">Penjualan</th><th class="r">Transaksi</th><th class="r">Item</th>${laba ? '<th class="r">Laba</th>' : ''}</tr></thead><tbody>

const THEMES = [['auto', 'Otomatis', 'Ikuti pengaturan perangkat'], ['light', 'Terang', 'Latar putih, cocok di toko yang terang'], ['dark', 'Gelap', 'Latar gelap, nyaman di mata malam hari']];
// ── colour theme (store-wide, settings.theme_color; owner picks) ──
// "mahogany" is the stylesheet's own look; "awal" is the first orange one;
// the rest are Mas Alin's mahogany chart. For a shade the menu takes the
// colour itself and every text colour is worked out to stay readable (WCAG AA).
const COLOR_THEMES = [['mahogany', 'Mahogany', '#4A0404'], ['awal', 'Tema awal', '#E8590C'],
  ['dark-mahogany', 'Dark Mahogany', '#482029'], ['light-mahogany', 'Light Mahogany', '#AD6D68'], ['cherry-mahogany', 'Cherry Mahogany', '#66362C'],
  ['chestnut', 'Chestnut', '#954535'], ['burnt-mahogany', 'Burnt Mahogany', '#340A0D'], ['cinnamon-brown', 'Cinnamon Brown', '#9E6A19'],
  ['african-mahogany', 'African Mahogany', '#CD4A4A'], ['american-mahogany', 'American Mahogany', '#52352F'], ['bright-mahogany', 'Bright Mahogany', '#86341F'],
  ['burnt-sienna', 'Burnt Sienna', '#E97451'], ['deep-mahogany', 'Deep Mahogany', '#553B39'], ['mahogany-brown', 'Mahogany Brown', '#4C2B20']];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbHex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => rgbHex(hexRgb(a).map((v, i) => v + (hexRgb(b)[i] - v) * t));
const lumHex = h => { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (a, b) => { const x = lumHex(a), y = lumHex(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
// Move c toward `to` until every [fg, bg] pair built from it reads at 4.5:1 or better.
const until = (c, to, ok) => { for (let t = 0; t <= 1.0001; t += 0.04) { const x = mixHex(c, to, t); if (ok(x)) return x; } return to; };
const CREAM = '#f6e9dc', DARKINK = '#2b1411';
function colorThemeCSS(key) {
  if (!key || key === 'mahogany') return '';
  if (key === 'awal') {
    const nav = `--nav-bg:var(--card);--nav-ink:var(--ink);--nav-muted:var(--muted);--nav-on:var(--accent-soft);--nav-on-ink:var(--accent);--nav-line:var(--line);--nav-hover:var(--bg);--nav-badge:var(--accent-soft);`;
    const light = `--bg:#f6f5f3;--card:#fff;--ink:#1d1b19;--muted:#77716b;--line:#e7e3de;--accent:#e8590c;--accent-ink:#fff;--accent-soft:#fff1e8;--chart:#e8590c;${nav}--logo-filter:none;--logo-blend:multiply;`;
    const dark = `--bg:#141210;--card:#1e1b18;--ink:#f1ece6;--muted:#a39a90;--line:#332e29;--accent:#ff7a33;--accent-ink:#1a0d05;--accent-soft:#3a2214;--chart:#ff7a33;${nav}--logo-filter:invert(1);--logo-blend:screen;`;
    return themeBlocks(light, dark);
  }
  const base = COLOR_THEMES.find(t => t[0] === key)?.[2];
  if (!base) return '';
  const nav = (bg) => {
    // mid tones read with neither text colour: deepen the menu until cream text does
    if (Math.max(contrast(CREAM, bg), contrast(DARKINK, bg)) < 4.5) bg = until(bg, '#000000', x => contrast(CREAM, x) >= 4.5);
    const lightText = contrast(CREAM, bg) >= contrast(DARKINK, bg), ink = lightText ? CREAM : DARKINK;
    const muted = until(mixHex(ink, bg, 0.3), ink, x => contrast(x, bg) >= 4.5);
    const onInk = lightText ? '#ffffff' : '#1a0a08';
    const on = until(mixHex(bg, lightText ? '#000000' : '#ffffff', 0.22), lightText ? '#000000' : '#ffffff', x => contrast(onInk, x) >= 4.5);
    return `--nav-bg:${bg};--nav-ink:${ink};--nav-muted:${muted};--nav-on:${on};--nav-on-ink:${onInk};` +
      `--nav-line:${lightText ? 'rgba(246,233,220,.16)' : 'rgba(43,20,17,.16)'};--nav-hover:${lightText ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)'};` +
      `--nav-badge:${lightText ? 'rgba(246,233,220,.14)' : 'rgba(43,20,17,.10)'};--logo-filter:${lightText ? 'invert(1)' : 'none'};--logo-blend:${lightText ? 'screen' : 'multiply'};`;
  };
  // light: the shade itself in the menu; accent darkened until white text and cream page both read
  const acc = until(base, '#000000', x => contrast('#ffffff', x) >= 4.5 && contrast(x, '#f8f2ec') >= 4.5);
  const soft = until(mixHex(base, '#ffffff', 0.88), '#ffffff', x => contrast(acc, x) >= 4.5);
  const light = `${nav(base)}--accent:${acc};--accent-ink:#fff;--accent-soft:${soft};--chart:${acc};`;
  // dark: a deeper menu, accent lightened until it reads on the dark cards with dark text on it
  const dbg = until(mixHex(base, '#000000', 0.35), '#000000', x => contrast(CREAM, x) >= 7);
  const dacc = until(base, '#ffffff', x => contrast(x, '#231210') >= 4.5 && contrast('#1c0906', x) >= 4.5);
  const dsoft = until(mixHex(base, '#231210', 0.72), '#231210', x => contrast(dacc, x) >= 4.5);
  const dark = `${nav(dbg)}--accent:${dacc};--accent-ink:#1c0906;--accent-soft:${dsoft};--chart:${dacc};`;
  return themeBlocks(light, dark);
}
const themeBlocks = (light, dark) => `:root{${light}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;

}

async function setVouchers(el) {

        <td data-l="Berlaku">${!x.active ? '<span class="badge bad">nonaktif</span>' : expired ? '<span class="badge bad">kedaluwarsa</span>' : until ? 's/d ' + fd(until) : 'tanpa batas'}</td>
        <td class="r"><button class="btn sm" data-v="${x.id}">Ubah</button></td></tr>`;
    }).join('') : `<tr><td colspan="6" class="empty">Belum ada voucher.</td></tr>`;
    $('#vtbl').querySelectorAll('[data-v]').forEach(b => b.onclick = () => edit(v.find(x => x.id === b.dataset.v)));

    const custs = (await list('users', { filter: 'role = "pelanggan" && disabled = false', sort: 'name', fields: 'id,name,username' })).items;
    openModal(`<h2>${isNew ? 'Voucher baru' : 'Ubah voucher'}</h2><form id="vf">
      <div class="row"><div><label class="f">Kode</label><input class="input" id="v1" required maxlength="30" value="${esc(x.code)}" autocapitalize="characters"></div>
      <div><label class="f">Jenis</label><select class="input" id="v2"><option value="persen">Persen (%)</option><option value="nominal">Nominal (Rp)</option></select></div></div>
      <div class="row"><div><label class="f">Nilai</label><input class="input num" id="v3" inputmode="numeric" required value="${x.value}"></div>
      <div><label class="f">Maks. potongan (Rp, 0 = bebas)</label><input class="input num" id="v4" inputmode="numeric" value="${x.max_discount}"></div></div>
      <div class="row"><div><label class="f">Min. belanja (Rp)</label><input class="input num" id="v5" inputmode="numeric" value="${x.min_purchase}"></div>
      <div><label class="f">Kuota (0 = tanpa batas)</label><input class="input num" id="v6" inputmode="numeric" value="${x.quota}"></div></div>
      <div class="row"><div><label class="f">Berlaku sampai</label><input class="input" type="date" id="v7" value="${x.valid_until ? x.valid_until.slice(0, 10) : ''}"></div>
      <div><label class="f">Khusus member</label><select class="input" id="v8"><option value="">Semua pelanggan</option>${custs.map(c => `<option value="${c.id}" ${c.id === x.customer ? 'selected' : ''}>${esc(c.name || c.username)}</option>`).join('')}</select></div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="v9" ${x.active ? 'checked' : ''}> Aktif</label>
      <div id="verr2"></div>
      <div class="row" style="margin-top:16px"><button type="button" class="btn" id="vno">Batal</button><button class="btn primary">Simpan</button></div></form>`);
    $('#v2').value = x.kind;
    $('#vno').onclick = closeModal;
    const n = id => parseInt(($('#' + id).value || '').replace(/\D/g, ''), 10) || 0;
    $('#vf').onsubmit = async ev => {
      ev.preventDefault();
      if ($('#v2').value === 'persen' && n('v3') > 100) return $('#verr2').innerHTML = `<div class="err">Persen maksimal 100.</div>`;
      try {
        // End of the chosen WIB day, so "sampai 31 Okt" includes all of the 31st.
        const until = $('#v7').value ? new Date(Date.parse($('#v7').value + 'T23:59:59Z') - 7 * 3600e3).toISOString().replace('T', ' ') : '';
        await api(`/api/collections/vouchers/records${isNew ? '' : '/' + x.id}`, { method: isNew ? 'POST' : 'PATCH', body: {
          code: $('#v1').value.trim().toUpperCase(), kind: $('#v2').value, value: n('v3'), max_discount: n('v4'), min_purchase: n('v5'),

  $('#vnew').onclick = () => edit(null);
  load().catch(e => { $('#vtbl tbody').innerHTML = `<tr><td colspan="6"><div class="err">${esc(e.message)}</div></td></tr>`; });

// ── pesanan online (owner/admin) ────────────────────
// Orders placed on the public shop (~/nelin-store). Every state change goes
// through /api/store/admin/{id}/{action}; confirming payment turns the order
// into a normal sale (stock already left when the order was placed).
const WO_LABEL = { menunggu_bayar: 'Belum bayar', menunggu_verifikasi: 'Perlu dicek', diproses: 'Dikemas', dikirim: 'Dikirim', siap_diambil: 'Siap diambil', selesai: 'Selesai', batal: 'Batal', kedaluwarsa: 'Kedaluwarsa' };
const WO_BADGE = { menunggu_bayar: 'warn', menunggu_verifikasi: 'bad', diproses: '', dikirim: 'ok', siap_diambil: 'ok', selesai: 'ok', batal: '', kedaluwarsa: '' };
const WO_GROUPS = [['cek', 'Perlu dicek', ['menunggu_verifikasi']], ['bayar', 'Belum bayar', ['menunggu_bayar']], ['kemas', 'Dikemas', ['diproses']],
  ['jalan', 'Dikirim / siap diambil', ['dikirim', 'siap_diambil']], ['selesai', 'Selesai', ['selesai']], ['batal', 'Batal', ['batal', 'kedaluwarsa']]];
const WS = { group: 'cek' };
// FormData upload with the session token (the JSON api() helper can't send files).
async function upload(path, fields, method = 'PATCH') {
  const fd = new FormData();
  for (const [k, v] of Object.entries(fields)) fd.append(k, v);
  const r = await fetch(path, { method, headers: { Authorization: S.token }, body: fd });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || `Error ${r.status}`);
  return j;
}
const woJson = v => { if (typeof v === 'string') { try { return JSON.parse(v); } catch (_) { return null; } } return v; };

// Links for one order: the buyer's tracking page (toko…/t/{code}) and the
// order in this app (…/#/o/{number}). Both bases live in Pengaturan → Toko Online.
const STORE_URL = () => (S.settings.store_url || 'https://toko-nelin.necutbarber.shop').replace(/\/+$/, '');
const POS_URL = () => (S.settings.pos_url || location.origin).replace(/\/+$/, '');
const woLinks = o => ({ track: o.track ? `${STORE_URL()}/t/${o.track}` : '', pos: `${POS_URL()}/#/o/${encodeURIComponent(o.number)}` });
// WhatsApp to the buyer for the order's current state, ending with the tracking link.
function woMessage(o) {
  const shop = S.settings.store_name || 'Nelin Batik', link = woLinks(o).track;
  const body = {
    menunggu_bayar: `pesanan ${o.number} di ${shop} menunggu pembayaran ${rp(o.total)}.${o.delivery === 'kirim' ? ` Ongkir ${o.courier} ${rp(o.shipping)} sudah kami cek.` : ''}`,
    menunggu_verifikasi: `bukti bayar pesanan ${o.number} sudah kami terima, sedang kami cek ya.`,
    diproses: `pembayaran pesanan ${o.number} sudah kami terima. Pesanan sedang dikemas.`,
    dikirim: `pesanan ${o.number} sudah dikirim lewat ${o.courier} ${o.service}.\nNomor resi: ${o.resi}`,
    siap_diambil: `pesanan ${o.number} sudah siap diambil di toko ${shop}.`,
    selesai: `pesanan ${o.number} sudah selesai. Terima kasih sudah belanja di ${shop}!`,
  }[o.status] || `terkait pesanan ${o.number} di ${shop}…`;
  return `Halo ${o.name}, ${body}${link ? `\n\nLacak pesanan: ${link}` : ''}\n\nTerima kasih 🙏`;
}
const woWa = o => `https://wa.me/${waNumber(o.phone)}?text=${encodeURIComponent(woMessage(o))}`;
const cekResi = r => `https://cekresi.com/?noresi=${encodeURIComponent(r)}`;
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg || 'Disalin.');
}

        <td class="r"><button class="btn sm ${o.status === 'menunggu_verifikasi' ? 'primary' : ''}" data-o="${o.id}">Buka</button></td></tr>`;

    $('#wtbl').querySelectorAll('[data-o]').forEach(b => b.onclick = () => openWebOrder(all.find(o => o.id === b.dataset.o), load));
  };
  const load = async () => {

    catch (e) { $('#wtbl tbody').innerHTML = `<tr><td colspan="6"><div class="err">${esc(e.message)}</div></td></tr>`; }

  const links = woLinks(o);
  const act = async (action, body = {}) => {

  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { fail(e); b.disabled = false; } }; };
  document.querySelectorAll('.modal [data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy, 'Link disalin.'));
  on('wcopy', async () => { await copyText(addrText, 'Alamat disalin.'); $('#wcopy').disabled = false; });
  on('wfeeok', () => act('shipping', { fee: parseInt($('#wfee').value.replace(/\D/g, ''), 10) || 0 }));
  on('wconf', async () => {
    if (!confirmInline('werr', `Pastikan ${rp(o.total)} sudah masuk ke rekening. Tekan lagi untuk konfirmasi.`)) { $('#wconf').disabled = false; return; }
    await act('confirm');
  });
  on('wrej', async () => {
    const reason = $('#wrejr')?.value.trim();
    if (!reason) { $('#werr').innerHTML = `<input class="input" id="wrejr" placeholder="Alasan, mis. nominal tidak sesuai" style="margin-top:10px">`; $('#wrejr').focus(); $('#wrej').disabled = false; return; }
    await act('reject', { reason });
  });
  on('wship', () => act('ship', { resi: $('#wresi').value.trim().toUpperCase() }));
  on('wresiok', () => act('resi', { resi: $('#wresi2').value.trim().toUpperCase() }));
  on('wready', () => act('ready'));
  on('wdone', () => act('complete'));
  on('wcancel', async () => {
    const reason = $('#wcanr')?.value.trim();
    if (!reason) { $('#werr').innerHTML = `<input class="input" id="wcanr" placeholder="Alasan pembatalan" style="margin-top:10px"><div class="muted sm">Stok dikembalikan.${o.sale ? ' Penjualan dibatalkan; kembalikan dana pembeli secara manual.' : ''}</div>`; $('#wcanr').focus(); $('#wcancel').disabled = false; return; }
    await act('cancel', { reason });
  });
}

// ── pengiriman (owner/admin and the kasir login) ────
// Paid web orders from packing to the buyer's door: type the resi, send the
// buyer a WhatsApp with their tracking link, mark delivered.
const SH_GROUPS = [
  ['kirim', 'Perlu dikirim', o => o.status === 'diproses' && o.delivery === 'kirim'],
  ['jalan', 'Dalam perjalanan', o => o.status === 'dikirim'],
  ['ambil', 'Ambil di toko', o => ['diproses', 'siap_diambil'].includes(o.status) && o.delivery === 'ambil'],
  ['selesai', 'Selesai', o => o.status === 'selesai'],
];
const SHS = { group: 'kirim', q: '' };
async function viewShip() {
  $('#view').innerHTML = `<div id="shtabs"></div>
    <div class="toolbar"><input class="input" id="shq" placeholder="Cari no. pesanan / nama / resi / HP" value="${esc(SHS.q)}"></div>
    <div id="shlist" class="ship-list"><div class="card empty">Memuat…</div></div>`;
  let all = [];
  const tabs = () => subTabs($('#shtabs'), SH_GROUPS.map(([k, l, f]) => [k, `${l} <span class="cnt">${all.filter(f).length}</span>`]), SHS, 'group', draw);
  const card = o => {
    const items = woJson(o.items) || [], a = woJson(o.address) || {}, links = woLinks(o);
    const shipped = (woJson(o.history) || []).filter(h => h.status === 'dikirim').shift();
    return `<div class="card ship" data-id="${o.id}">
      <div class="ship-head"><b class="num">${esc(o.number)}</b><span class="badge ${WO_BADGE[o.status]}">${WO_LABEL[o.status]}</span>
        <span class="muted sm">${o.status === 'dikirim' && shipped ? 'dikirim ' + fmtTime(String(shipped.at).replace('T', ' ')) : 'dipesan ' + fmtTime(o.created)}</span></div>
      <div class="ship-body">
        <div><b>${esc(o.name)}</b> <span class="muted">${esc(o.phone)}</span>
          <div class="muted sm">${o.delivery === 'kirim' ? `${esc(a.city || '')}, ${esc(a.province || '')} · ${esc(o.courier)} ${esc(o.service)} · ${(o.weight / 1000).toLocaleString('id-ID')} kg` : 'Ambil di toko'}</div>
          <div class="sm" style="margin-top:4px">${items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div></div>
        ${o.status === 'diproses' && o.delivery === 'kirim' ? `<form class="ship-resi" data-ship="${o.id}"><input class="input num" name="resi" placeholder="Nomor resi ${esc(o.courier)}" autocapitalize="characters" required minlength="6"><button class="btn primary">Kirim</button></form>` : ''}
        ${o.status === 'dikirim' ? `<div class="ship-resi"><span class="muted sm">Resi</span> <b class="num">${esc(o.resi)}</b>
          <button class="btn sm" data-copy="${esc(o.resi)}" data-msg="Resi disalin.">Salin</button><a class="btn sm" href="${cekResi(o.resi)}" target="_blank" rel="noopener">Cek posisi</a></div>` : ''}
      </div>
      <div class="ship-acts">
        <a class="btn sm wa" target="_blank" rel="noopener" href="${woWa(o)}">WhatsApp pembeli</a>
        ${links.track ? `<button class="btn sm" data-copy="${esc(links.track)}" data-msg="Link lacak disalin.">Salin link lacak</button>` : ''}
        ${o.status === 'dikirim' ? `<button class="btn sm" data-act="complete">Paket diterima</button>` : ''}
        ${o.status === 'diproses' && o.delivery === 'ambil' ? `<button class="btn sm primary" data-act="ready">Siap diambil</button>` : ''}
        ${o.status === 'siap_diambil' ? `<button class="btn sm" data-act="complete">Sudah diambil</button>` : ''}
        <button class="btn sm ghost" data-open>Detail</button>
      </div><div class="ship-err"></div></div>`;
  };
  const draw = () => {
    const f = SH_GROUPS.find(g => g[0] === SHS.group)[2], q = SHS.q.trim().toLowerCase();
    let rows = all.filter(f).filter(o => !q || [o.number, o.name, o.resi, o.phone, o.track].some(v => (v || '').toLowerCase().includes(q)));
    if (SHS.group === 'kirim' || SHS.group === 'ambil') rows.reverse();  // longest waiting first
    if (SHS.group === 'selesai') rows = rows.slice(0, 50);
    const none = { kirim: 'Tidak ada paket yang menunggu dikirim.', jalan: 'Tidak ada paket di perjalanan.', ambil: 'Tidak ada pesanan ambil di toko.', selesai: 'Belum ada pesanan selesai.' }[SHS.group];
    $('#shlist').innerHTML = rows.length ? rows.map(card).join('') : `<div class="card empty">${q ? 'Tidak ada yang cocok.' : none}</div>`;
    const byId = id => all.find(o => o.id === id);
    $('#shlist').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy, b.dataset.msg));
    $('#shlist').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openWebOrder(byId(b.closest('[data-id]').dataset.id), load));
    $('#shlist').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const c = b.closest('[data-id]'); b.disabled = true;
      try { await api(`/api/store/admin/${c.dataset.id}/${b.dataset.act}`, { method: 'POST', body: {} }); toast('Tersimpan.'); await load(); }
      catch (e) { $('.ship-err', c).innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false; }
    });
    $('#shlist').querySelectorAll('form[data-ship]').forEach(f => f.onsubmit = async ev => {
      ev.preventDefault();
      const c = f.closest('[data-id]'), btn = $('button', f); btn.disabled = true;
      try {
        const r = await api(`/api/store/admin/${f.dataset.ship}/ship`, { method: 'POST', body: { resi: f.resi.value.trim().toUpperCase() } });
        await load();
        // The buyer hears about it right away: one tap opens WhatsApp with the resi and tracking link.
        openModal(`<h2>Paket dikirim</h2><p>${esc(r.number)} · ${esc(r.courier)} ${esc(r.service)} · resi <b class="num">${esc(r.resi)}</b></p>
          <p class="muted sm" style="white-space:pre-line;background:var(--bg);border-radius:10px;padding:10px 12px">${esc(woMessage(r))}</p>
          <a class="btn block wa" target="_blank" rel="noopener" href="${woWa(r)}" id="shwa">Kirim WhatsApp ke ${esc(r.name)}</a>
          <button class="btn block" style="margin-top:8px" id="shclose">Nanti saja</button>`);
        $('#shwa').addEventListener('click', () => setTimeout(closeModal, 300));
        $('#shclose').onclick = closeModal;
      } catch (e) { $('.ship-err', c).innerHTML = `<div class="err">${esc(e.message)}</div>`; btn.disabled = false; }
    });
  };
  const load = async () => {
    try { all = (await list('web_orders', { filter: 'status = "diproses" || status = "dikirim" || status = "siap_diambil" || status = "selesai"', sort: '-created', perPage: 500 })).items; tabs(); draw(); openDeepOrder(all, load); }
    catch (e) { $('#shlist').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $('#shq').oninput = () => { SHS.q = $('#shq').value; draw(); };
  load();
}

// …/#/o/{number}: the order link in WhatsApp messages. After login it opens
// Pengiriman (paid orders) or Pesanan Online (the rest) with that order.
async function takeDeepLink() {
  const m = location.hash.match(/^#\/o\/([A-Za-z0-9-]+)$/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  if (!TABS[role()].some(t => t[0] === 'online')) return false;
  try {
    const o = (await list('web_orders', { filter: `number = ${pbq(decodeURIComponent(m[1]))}`, perPage: 1 })).items[0];
    if (!o) { toast('Pesanan ' + m[1] + ' tidak ditemukan.', true); return false; }
    const g = SH_GROUPS.find(([, , f]) => f(o));
    if (g) { S.tab = 'ship'; SHS.group = g[0]; SHS.q = ''; }
    else { S.tab = 'online'; WS.group = (WO_GROUPS.find(x => x[2].includes(o.status)) || WO_GROUPS[0])[0]; }
    S.deep = o.id;
    return true;
  } catch (_) { return false; }
}
function openDeepOrder(all, reload) {
  if (!S.deep) return;
  const o = all.find(x => x.id === S.deep);
  S.deep = '';
  if (o) openWebOrder(o, reload);
}
window.addEventListener('hashchange', async () => { if (S.user && await takeDeepLink()) renderShell(); });

// ── pelanggan ───────────────────────────────────────
async function viewMe() {
  $('#view').innerHTML = `<div class="empty">Memuat…</div>`;
  try {
    const [me, sales, debts] = await Promise.all([
      api(`/api/collections/users/records/${S.user.id}`),
      list('sales', { sort: '-created', perPage: 500 }),
      list('receivables', { filter: 'status = "belum"', sort: 'due_date' }),
    ]);
    const owed = debts.items.reduce((a, d) => a + d.amount - d.paid, 0);
    $('#view').innerHTML = `
      <div class="stats">
        <div class="card stat"><small>Total belanja</small><b class="num">${rp(sales.items.filter(s => s.status !== 'batal').reduce((a, s) => a + s.total, 0))}</b></div>
        <div class="card stat"><small>Transaksi</small><b class="num">${sales.items.filter(s => s.status !== 'batal').length}×</b></div>
        ${owed ? `<div class="card stat"><small>Sisa bon</small><b class="num" style="color:var(--warn)">${rp(owed)}</b></div>` : ''}
      </div>
      <h3 class="sec">Riwayat belanja</h3>
      <div class="card">${sales.items.length ? sales.items.map(s => `
        <button class="tx" data-s="${s.id}">
          <span><b class="num">${esc(s.number)}</b> ${s.status !== 'lunas' ? `<span class="badge ${s.status === 'batal' ? 'bad' : 'warn'}">${s.status}</span>` : ''}</span>
          <b class="num">${rp(s.total)}</b>
          <small class="muted">${fmtTime(s.created)}</small>
          <small class="muted">${s.status === 'piutang' ? 'bon' : ''}</small>
        </button>`).join('') : `<div class="empty">Belum ada belanja.</div>`}</div>`;
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
      const sale = sales.items.find(s => s.id === b.dataset.s);
      const it = await list('sale_items', { filter: `sale = ${pbq(sale.id)}` });
      showReceipt(sale, it.items, false);
    });
  } catch (e) { $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

boot();
</script>
