// ── laporan penjualan (owner/admin) ─────────────────
const RS = { from: presetRange('month')[0], to: wibToday(), preset: 'month', type: 'ringkasan' };
function viewReports() {
  $('#view').innerHTML = `<div id="rsub"></div><div id="rrange"></div><div id="rbody"></div>`;
  subTabs($('#rsub'), REP_TYPES, RS, 'type', () => load());
  const load = async () => {
    const el = $('#rbody');
    if (RS.type !== 'ringkasan') return viewReportTable(el, RS.type);
    el.innerHTML = `<div class="empty">Memuat…</div>`;
    try {
      const r = await api(`/api/reports/sales?from=${RS.from}&to=${RS.to}`);
      const tot = r.perDay.reduce((a, d) => ({ count: a.count + d.count, total: a.total + d.total, discount: a.discount + d.discount }), { count: 0, total: 0, discount: 0 });
      // Long ranges read better per month than as 180 daily rows.
      const byMonth = r.perDay.length > 62;
      const series = byMonth ? Object.values(r.perDay.reduce((acc, d) => {
        const k = d.day.slice(0, 7);
        acc[k] = acc[k] || { day: k, count: 0, subtotal: 0, discount: 0, total: 0 };
        acc[k].count += d.count; acc[k].subtotal += d.subtotal; acc[k].discount += d.discount; acc[k].total += d.total;
        return acc;
      }, {})) : r.perDay;
      const label = d => byMonth ? new Date(d + '-01T00:00:00Z').toLocaleDateString('id-ID', { timeZone: 'UTC', month: 'long', year: 'numeric' }) : fd(d);
      const max = Math.max(1, ...series.map(d => d.total));
      const tbl = (head, rows) => `<table class="tbl"><thead><tr>${head.map(h => `<th class="${h[1] || ''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${head.length}" class="empty">—</td></tr>`}</tbody></table>`;
      const days = tbl([[byMonth ? 'Bulan' : 'Tanggal'], ['Transaksi', 'r'], ['Diskon', 'r'], ['Omzet', 'r'], ['']], series.map(d => `<tr><td data-l="${byMonth ? 'Bulan' : 'Tanggal'}">${label(d.day)}</td><td data-l="Transaksi" class="r num">${d.count}</td><td data-l="Diskon" class="r num">${rp(d.discount)}</td><td data-l="Omzet" class="r num"><b>${rp(d.total)}</b></td><td class="barcell"><span class="bar" style="width:${Math.round(d.total / max * 100)}%"></span></td></tr>`).join(''));
      const prods = tbl([['Produk'], ['Terjual', 'r'], ['Nilai', 'r']], r.perProduct.map(p => `<tr><td data-l="Produk"><b>${esc(p.name)}</b><div class="muted sm">${esc(p.sku)}</div></td><td data-l="Terjual" class="r num">${p.qty}</td><td data-l="Nilai" class="r num">${rp(p.amount)}</td></tr>`).join(''));
      const meth = tbl([['Metode'], ['Transaksi', 'r'], ['Diterima', 'r']], r.perMethod.map(m => `<tr><td data-l="Metode">${esc(m.method)}</td><td data-l="Transaksi" class="r num">${m.count}</td><td data-l="Diterima" class="r num">${rp(m.paid)}</td></tr>`).join(''));
      const cash = tbl([['Kasir'], ['Transaksi', 'r'], ['Omzet', 'r']], r.perCashier.map(c => `<tr><td data-l="Kasir">${esc(c.cashier)}</td><td data-l="Transaksi" class="r num">${c.count}</td><td data-l="Omzet" class="r num">${rp(c.total)}</td></tr>`).join(''));
      el.innerHTML = `
        <div class="stats">
          <div class="card stat"><small>Transaksi</small><b class="num">${tot.count}</b></div>
          <div class="card stat"><small>Omzet</small><b class="num">${rp(tot.total)}</b></div>
          <div class="card stat"><small>Rata-rata / transaksi</small><b class="num">${rp(tot.count ? tot.total / tot.count : 0)}</b></div>
          <div class="card stat"><small>Total diskon</small><b class="num">${rp(tot.discount)}</b></div>
        </div>
        <div class="toolbar"><button class="btn" id="rpp">🖨 Cetak / PDF</button><button class="btn" id="rpc">⬇ Excel (CSV) per produk</button><button class="btn" id="rpd">⬇ Excel (CSV) per hari</button></div>
        <h3 class="sec">${byMonth ? 'Per bulan' : 'Per hari'}</h3><div class="card">${days}</div>
        <div class="two"><section><h3 class="sec">Per produk</h3><div class="card">${prods}</div></section>
        <section><h3 class="sec">Per metode bayar</h3><div class="card">${meth}</div><h3 class="sec">Per kasir</h3><div class="card">${cash}</div></section></div>`;
      $('#rpp').onclick = () => printReport(`Laporan Penjualan ${fd(RS.from)} – ${fd(RS.to)}`, `<p>${tot.count} transaksi · omzet ${rp(tot.total)}</p><h3>${byMonth ? 'Per bulan' : 'Per hari'}</h3>${days}<h3>Per produk</h3>${prods}<h3>Per metode</h3>${meth}<h3>Per kasir</h3>${cash}`);
      $('#rpc').onclick = () => downloadCSV(`penjualan-produk_${RS.from}_${RS.to}.csv`, [['Produk', 'SKU', 'Terjual', 'Nilai'], ...r.perProduct.map(p => [p.name, p.sku, p.qty, p.amount])]);
      $('#rpd').onclick = () => downloadCSV(`penjualan-harian_${RS.from}_${RS.to}.csv`, [['Tanggal', 'Transaksi', 'Subtotal', 'Diskon', 'Omzet'], ...r.perDay.map(d => [d.day, d.count, d.subtotal, d.discount, d.total])]);
    } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  rangePicker($('#rrange'), RS, load);
  load();
}

// ── pengguna ────────────────────────────────────────
// Owner manages everyone. Admin sees pelanggan + kasir and registers pelanggan.
// Key order is the order of the role menu and the role picker.
const ROLE_LABEL = { kasir: 'Kasir', admin: 'Admin', owner: 'Owner', pelanggan: 'Pelanggan' };
const US = { role: 'kasir', q: '' };
async function viewUsers() {
  const owner = role() === 'owner';
  // Pick a role first, then see that role's people (admin sees kasir + pelanggan only).
  const roles = Object.keys(ROLE_LABEL).filter(k => owner || k === 'kasir' || k === 'pelanggan');
  // Karyawan are not logins: the assistants picked per sale on the shared kasir.
  const tabKeys = [...roles]; tabKeys.splice(1, 0, 'karyawan');
  if (!tabKeys.includes(US.role)) US.role = tabKeys[0];
  $('#view').innerHTML = `
    <div id="utabs"></div>
    <div class="toolbar">
      <input class="input" id="uq" placeholder="Cari nama / username / HP" value="${esc(US.q)}">
      <button class="btn primary" id="unew"></button>
    </div>
    <div id="uhint"></div>
    <div class="card"><table class="tbl" id="utbl"><thead></thead><tbody><tr><td colspan="5" class="empty">Memuat…</td></tr></tbody></table></div>`;
  let all = [], emps = [];
  const match = (u, q) => !q || [u.name, u.username, u.phone].some(v => (v || '').toLowerCase().includes(q));
  const tabs = () => subTabs($('#utabs'), tabKeys.map(k => [k, k === 'karyawan' ? `Karyawan <span class="cnt">${emps.filter(x => x.active).length}</span>` : `${ROLE_LABEL[k]} <span class="cnt">${all.filter(u => u.role === k).length}</span>`]), US, 'role', draw);
  const draw = () => {
    const q = US.q.trim().toLowerCase(), pel = US.role === 'pelanggan';
    if (US.role === 'karyawan') return drawEmp(q);
    $('#unew').textContent = '+ ' + (owner ? ROLE_LABEL[US.role] : 'Pelanggan');
    $('#utbl thead').innerHTML = `<tr><th>Nama</th><th>No HP</th>${pel ? '<th class="r">Poin</th>' : ''}<th>Status</th><th></th></tr>`;
    // active people first, then by name
    const rows = all.filter(u => u.role === US.role && match(u, q))
      .sort((x, y) => (x.disabled ? 1 : 0) - (y.disabled ? 1 : 0) || (x.name || x.username).localeCompare(y.name || y.username, 'id'));
    // A search that only hits other roles says where the hits are.
    const elsewhere = q && !rows.length ? roles.filter(k => k !== US.role && all.some(u => u.role === k && match(u, q))) : [];
    $('#uhint').innerHTML = elsewhere.length ? `<p class="muted" style="margin:0 0 10px">Ditemukan di ${elsewhere.map(k => `<button class="link" data-goto="${k}">${ROLE_LABEL[k]}</button>`).join(', ')}.</p>` : '';
    $('#uhint').querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { US.role = b.dataset.goto; tabs(); draw(); });
    $('#utbl tbody').innerHTML = rows.length ? rows.map(u => `<tr class="${u.disabled ? 'off' : ''}">
      <td data-l="Nama"><b>${esc(u.name || u.username)}</b><div class="muted sm">@${esc(u.username)}</div></td>
      <td data-l="No HP">${esc(u.phone) || '<span class="muted">—</span>'}</td>
      ${pel ? `<td data-l="Poin" class="r num">${u.points}</td>` : ''}
      <td data-l="Status">${u.disabled ? '<span class="badge bad">nonaktif</span>' : '<span class="badge ok">aktif</span>'}</td>
      <td class="r">${owner ? `<button class="btn sm" data-u="${u.id}">Ubah</button>` : ''}</td></tr>`).join('')
      : `<tr><td colspan="5" class="empty">${q ? 'Tidak ada yang cocok.' : `Belum ada ${ROLE_LABEL[US.role].toLowerCase()}.`}</td></tr>`;
    $('#utbl').querySelectorAll('[data-u]').forEach(b => b.onclick = () => editUser(all.find(u => u.id === b.dataset.u)));
  };
  const drawEmp = q => {
    $('#unew').textContent = '+ Karyawan';
    $('#uhint').innerHTML = `<p class="muted" style="margin:0 0 10px">Karyawan dipilih di kasir untuk setiap penjualan (Laporan → Karyawan). Mereka tidak perlu akun login.</p>`;
    $('#utbl thead').innerHTML = `<tr><th>Nama</th><th>No HP</th><th>Status</th><th></th></tr>`;
    const rows = emps.filter(x => !q || [x.name, x.phone].some(v => (v || '').toLowerCase().includes(q)))
      .sort((a, b) => (a.active ? 0 : 1) - (b.active ? 0 : 1) || a.name.localeCompare(b.name, 'id'));
    $('#utbl tbody').innerHTML = rows.length ? rows.map(x => `<tr class="${x.active ? '' : 'off'}">
      <td data-l="Nama"><b>${esc(x.name)}</b></td>
      <td data-l="No HP">${esc(x.phone) || '<span class="muted">—</span>'}</td>
      <td data-l="Status">${x.active ? '<span class="badge ok">aktif</span>' : '<span class="badge bad">nonaktif</span>'}</td>
      <td class="r"><button class="btn sm" data-e="${x.id}">Ubah</button></td></tr>`).join('')
      : `<tr><td colspan="4" class="empty">${q ? 'Tidak ada yang cocok.' : 'Belum ada karyawan. Tambahkan supaya kasir bisa memilih siapa yang melayani.'}</td></tr>`;
    $('#utbl').querySelectorAll('[data-e]').forEach(b => b.onclick = () => editEmp(emps.find(x => x.id === b.dataset.e)));
  };
  const editEmp = x => {
    const isNew = !x;
    x = x || { name: '', phone: '', active: true };
    openModal(`<h2>${isNew ? 'Karyawan baru' : 'Ubah ' + esc(x.name)}</h2>
      <form id="kf">
        <label class="f" for="kn">Nama</label><input class="input" id="kn" required maxlength="100" value="${esc(x.name)}">
        <label class="f" for="kp">No HP / WA <small>(opsional)</small></label><input class="input" id="kp" inputmode="tel" maxlength="20" value="${esc(x.phone)}">
        <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="ka" ${x.active ? 'checked' : ''}> Aktif (muncul di kasir)</label>
        <div class="muted sm" style="margin-top:6px">Karyawan yang berhenti cukup dinonaktifkan; penjualan lamanya tetap tercatat atas namanya.</div>
        <div id="kerr"></div>
        <div class="row" style="margin-top:16px"><button type="button" class="btn" id="kno">Batal</button><button class="btn primary">Simpan</button></div>
      </form>`);
    $('#kno').onclick = closeModal;
    $('#kf').onsubmit = async ev => {
      ev.preventDefault();
      try {
        await api(`/api/collections/employees/records${isNew ? '' : '/' + x.id}`, { method: isNew ? 'POST' : 'PATCH', body: { name: $('#kn').value.trim(), phone: $('#kp').value.trim(), active: $('#ka').checked } });
        closeModal(); toast('Tersimpan.'); load();
      } catch (e) { $('#kerr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  };
  const load = async () => {
    try { [all, emps] = await Promise.all([list('users', { sort: 'name' }).then(r => r.items), list('employees', { sort: 'name' }).then(r => r.items)]); tabs(); draw(); }
    catch (e) { $('#utbl tbody').innerHTML = `<tr><td colspan="5"><div class="err">${esc(e.message)}</div></td></tr>`; }
  };
  const editUser = u => {
    const isNew = !u;
    u = u || { name: '', username: '', phone: '', address: '', role: owner ? US.role : 'pelanggan', points: 0, disabled: false };
    const self = u.id === S.user.id;
    openModal(`<h2>${isNew ? 'Pengguna baru' : 'Ubah ' + esc(u.name || u.username)}</h2>
      <form id="gf">
        <label class="f">Nama</label><input class="input" id="gn" required maxlength="100" value="${esc(u.name)}">
        <div class="row"><div><label class="f">Username</label><input class="input" id="gu" required pattern="[a-z0-9_.]{3,32}" title="3–32 huruf kecil, angka, titik atau _" autocapitalize="none" value="${esc(u.username)}"></div>
        <div><label class="f">Peran</label><select class="input" id="gr" ${!owner || self ? 'disabled' : ''}>${Object.entries(ROLE_LABEL).filter(([k]) => owner || k === 'pelanggan').map(([k, l]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
        <div class="row"><div><label class="f">No HP / WA</label><input class="input" id="gp" inputmode="tel" maxlength="20" value="${esc(u.phone)}"></div>
        <div id="gptw"><label class="f">Poin</label><input class="input num" id="gpt" inputmode="numeric" value="${u.points || 0}" ${owner ? '' : 'disabled'}></div></div>
        <label class="f">Alamat</label><input class="input" id="ga" maxlength="300" value="${esc(u.address)}">
        <label class="f">${isNew ? 'Password (min. 8)' : 'Password baru (kosongkan jika tidak diganti)'}</label><input class="input" id="gw" ${isNew ? 'required' : ''} minlength="8" autocomplete="new-password">
        ${!isNew && owner && !self ? `<label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="gd" ${u.disabled ? 'checked' : ''}> Nonaktifkan (tidak bisa login)</label>` : ''}
        <div id="gerr"></div>
        <div class="row" style="margin-top:16px"><button type="button" class="btn" id="gno">Batal</button><button class="btn primary" id="gok">Simpan</button></div>
      </form>`);
    const togglePts = () => $('#gptw').style.visibility = $('#gr').value === 'pelanggan' ? '' : 'hidden';
    $('#gr').onchange = togglePts; togglePts();
    $('#gno').onclick = closeModal;
    $('#gf').onsubmit = async ev => {
      ev.preventDefault();
      const body = { name: $('#gn').value.trim(), username: $('#gu').value.trim().toLowerCase(), phone: $('#gp').value.trim(), address: $('#ga').value.trim() };
      if (owner && !self) body.role = $('#gr').value;
      if (isNew && !owner) body.role = 'pelanggan';
      if (owner && $('#gr').value === 'pelanggan') body.points = parseInt($('#gpt').value.replace(/\D/g, ''), 10) || 0;
      if ($('#gd')) body.disabled = $('#gd').checked;
      if ($('#gw').value) { body.password = $('#gw').value; body.passwordConfirm = $('#gw').value; }
      $('#gok').disabled = true;
      try {
        await api(`/api/collections/users/records${isNew ? '' : '/' + u.id}`, { method: isNew ? 'POST' : 'PATCH', body });
        closeModal(); toast('Tersimpan.'); load();
      } catch (e) {
        $('#gerr').innerHTML = `<div class="err">${esc(/username/.test(e.message) && /unique|exist/i.test(e.message) ? 'Username sudah dipakai.' : e.message)}</div>`;
        $('#gok').disabled = false;
      }
    };
  };
  $('#uq').oninput = () => { US.q = $('#uq').value; draw(); };
  $('#unew').onclick = () => US.role === 'karyawan' ? editEmp(null) : owner ? editUser(null) : openNewCustomerStandalone(load);
  load();
}

function openNewCustomerStandalone(after) {

const THEMES = [['auto', 'Otomatis', 'Ikuti pengaturan perangkat'], ['light', 'Terang', 'Latar putih, cocok di toko yang terang'], ['dark', 'Gelap', 'Latar gelap, nyaman di mata malam hari']];
function setTheme(el) {

  try { cur = localStorage.getItem('nb_theme') || 'auto'; } catch (_) {}
  el.innerHTML = `<div class="card formcard">
    <label class="f" style="margin-top:0">Tema aplikasi</label>
    <div class="themes" role="radiogroup" aria-label="Tema aplikasi">${THEMES.map(([k, l, d]) => `
      <label class="theme-opt"><input type="radio" name="theme" value="${k}" ${cur === k ? 'checked' : ''}>
        <span class="theme-prev ${k}" aria-hidden="true"><i></i><i></i><i></i></span>
        <b>${l}</b><small class="muted">${d}</small></label>`).join('')}</div>
    <p class="muted sm" style="margin:12px 0 0">Tersimpan di perangkat ini saja.</p></div>`;
  el.querySelectorAll('input[name=theme]').forEach(r => r.onchange = () => {
    const t = r.value;
    try { t === 'auto' ? localStorage.removeItem('nb_theme') : localStorage.setItem('nb_theme', t); } catch (_) {}

    toast('Tema: ' + THEMES.find(x => x[0] === t)[1]);
  });
}
async function setVouchers(el) {
  el.innerHTML = `<div class="toolbar"><div class="muted" style="flex:1;align-self:center">Kasir mengetik kode voucher di layar Kasir.</div><button class="btn primary" id="vnew">+ Voucher</button></div>

    $('#vtbl tbody').innerHTML = v.length ? v.map(x => {

        <td data-l="Dipakai" class="r num">${x.used}${x.quota ? ' / ' + x.quota : ''}</td>
        <td data-l="Berlaku">${!x.active ? '<span class="badge bad">nonaktif</span>' : expired ? '<span class="badge bad">kedaluwarsa</span>' : until ? 's/d ' + fd(until) : 'tanpa batas'}</td>
        <td class="r"><button class="btn sm" data-v="${x.id}">Ubah</button></td></tr>`;
    }).join('') : `<tr><td colspan="6" class="empty">Belum ada voucher.</td></tr>`;

  const edit = async x => {
    const isNew = !x;
    x = x || { code: '', kind: 'persen', value: 10, max_discount: 0, min_purchase: 0, quota: 0, valid_until: '', customer: '', active: true };
    const custs = (await list('users', { filter: 'role = "pelanggan" && disabled = false', sort: 'name', fields: 'id,name,username' })).items;
    openModal(`<h2>${isNew ? 'Voucher baru' : 'Ubah voucher'}</h2><form id="vf">
      <div class="row"><div><label class="f">Kode</label><input class="input" id="v1" required maxlength="30" value="${esc(x.code)}" autocapitalize="characters"></div>
      <div><label class="f">Jenis</label><select class="input" id="v2"><option value="persen">Persen (%)</option><option value="nominal">Nominal (Rp)</option></select></div></div>
      <div class="row"><div><label class="f">Nilai</label><input class="input num" id="v3" inputmode="numeric" required value="${x.value}"></div>
      <div><label class="f">Maks. potongan (Rp, 0 = bebas)</label><input class="input num" id="v4" inputmode="numeric" value="${x.max_discount}"></div></div>
      <div class="row"><div><label class="f">Min. belanja (Rp)</label><input class="input num" id="v5" inputmode="numeric" value="${x.min_purchase}"></div>
      <div><label class="f">Kuota (0 = tanpa batas)</label><input class="input num" id="v6" inputmode="numeric" value="${x.quota}"></div></div>
      <div class="row"><div><label class="f">Berlaku sampai</label><input class="input" type="date" id="v7" value="${x.valid_until ? x.valid_until.slice(0, 10) : ''}"></div>
      <div><label class="f">Khusus member</label><select class="input" id="v8"><option value="">Semua pelanggan</option>${custs.map(c => `<option value="${c.id}" ${c.id === x.customer ? 'selected' : ''}>${esc(c.name || c.username)}</option>`).join('')}</select></div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="v9" ${x.active ? 'checked' : ''}> Aktif</label>
      <div id="verr2"></div>
      <div class="row" style="margin-top:16px"><button type="button" class="btn" id="vno">Batal</button><button class="btn primary">Simpan</button></div></form>`);
    $('#v2').value = x.kind;
    $('#vno').onclick = closeModal;
    const n = id => parseInt(($('#' + id).value || '').replace(/\D/g, ''), 10) || 0;
    $('#vf').onsubmit = async ev => {
      ev.preventDefault();
      if ($('#v2').value === 'persen' && n('v3') > 100) return $('#verr2').innerHTML = `<div class="err">Persen maksimal 100.</div>`;
      try {
        // End of the chosen WIB day, so "sampai 31 Okt" includes all of the 31st.
        const until = $('#v7').value ? new Date(Date.parse($('#v7').value + 'T23:59:59Z') - 7 * 3600e3).toISOString().replace('T', ' ') : '';
        await api(`/api/collections/vouchers/records${isNew ? '' : '/' + x.id}`, { method: isNew ? 'POST' : 'PATCH', body: {
          code: $('#v1').value.trim().toUpperCase(), kind: $('#v2').value, value: n('v3'), max_discount: n('v4'), min_purchase: n('v5'),
          quota: n('v6'), valid_until: until, customer: $('#v8').value, active: $('#v9').checked } });
        closeModal(); toast('Voucher disimpan.'); load();
      } catch (e) { $('#verr2').innerHTML = `<div class="err">${esc(/code/.test(e.message) && /unique|exist/i.test(e.message) ? 'Kode sudah dipakai.' : e.message)}</div>`; }
    };
  };
  $('#vnew').onclick = () => edit(null);
  load().catch(e => { $('#vtbl tbody').innerHTML = `<tr><td colspan="6"><div class="err">${esc(e.message)}</div></td></tr>`; });
}

// ── pesanan online (owner/admin) ────────────────────
// Orders placed on the public shop (~/nelin-store). Every state change goes
// through /api/store/admin/{id}/{action}; confirming payment turns the order
// into a normal sale (stock already left when the order was placed).
const WO_LABEL = { menunggu_bayar: 'Belum bayar', menunggu_verifikasi: 'Perlu dicek', diproses: 'Dikemas', dikirim: 'Dikirim', siap_diambil: 'Siap diambil', selesai: 'Selesai', batal: 'Batal', kedaluwarsa: 'Kedaluwarsa' };
const WO_BADGE = { menunggu_bayar: 'warn', menunggu_verifikasi: 'bad', diproses: '', dikirim: 'ok', siap_diambil: 'ok', selesai: 'ok', batal: '', kedaluwarsa: '' };
const WO_GROUPS = [['cek', 'Perlu dicek', ['menunggu_verifikasi']], ['bayar', 'Belum bayar', ['menunggu_bayar']], ['kemas', 'Dikemas', ['diproses']],
  ['jalan', 'Dikirim / siap diambil', ['dikirim', 'siap_diambil']], ['selesai', 'Selesai', ['selesai']], ['batal', 'Batal', ['batal', 'kedaluwarsa']]];
const WS = { group: 'cek' };
// FormData upload with the session token (the JSON api() helper can't send files).
async function upload(path, fields, method = 'PATCH') {
  const fd = new FormData();
  for (const [k, v] of Object.entries(fields)) fd.append(k, v);
  const r = await fetch(path, { method, headers: { Authorization: S.token }, body: fd });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || `Error ${r.status}`);
  return j;
}
const woJson = v => { if (typeof v === 'string') { try { return JSON.parse(v); } catch (_) { return null; } } return v; };

// Links for one order: the buyer's tracking page (toko…/t/{code}) and the
// order in this app (…/#/o/{number}). Both bases live in Pengaturan → Toko Online.
const STORE_URL = () => (S.settings.store_url || 'https://toko-nelin.necutbarber.shop').replace(/\/+$/, '');
const POS_URL = () => (S.settings.pos_url || location.origin).replace(/\/+$/, '');
const woLinks = o => ({ track: o.track ? `${STORE_URL()}/t/${o.track}` : '', pos: `${POS_URL()}/#/o/${encodeURIComponent(o.number)}` });
// WhatsApp to the buyer for the order's current state, ending with the tracking link.
function woMessage(o) {
  const shop = S.settings.store_name || 'Nelin Batik', link = woLinks(o).track;
  const body = {
    menunggu_bayar: `pesanan ${o.number} di ${shop} menunggu pembayaran ${rp(o.total)}.${o.delivery === 'kirim' ? ` Ongkir ${o.courier} ${rp(o.shipping)} sudah kami cek.` : ''}`,
    menunggu_verifikasi: `bukti bayar pesanan ${o.number} sudah kami terima, sedang kami cek ya.`,
    diproses: `pembayaran pesanan ${o.number} sudah kami terima. Pesanan sedang dikemas.`,
    dikirim: `pesanan ${o.number} sudah dikirim lewat ${o.courier} ${o.service}.\nNomor resi: ${o.resi}`,
    siap_diambil: `pesanan ${o.number} sudah siap diambil di toko ${shop}.`,
    selesai: `pesanan ${o.number} sudah selesai. Terima kasih sudah belanja di ${shop}!`,
  }[o.status] || `terkait pesanan ${o.number} di ${shop}…`;
  return `Halo ${o.name}, ${body}${link ? `\n\nLacak pesanan: ${link}` : ''}\n\nTerima kasih 🙏`;
}
const woWa = o => `https://wa.me/${waNumber(o.phone)}?text=${encodeURIComponent(woMessage(o))}`;
const cekResi = r => `https://cekresi.com/?noresi=${encodeURIComponent(r)}`;
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch (_) { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg || 'Disalin.');
}

        <td data-l="Pembeli">${esc(o.name)}<div class="muted sm">${esc(o.phone)}</div></td>
        <td data-l="Kirim">${o.delivery === 'ambil' ? 'Ambil di toko' : `${esc(o.courier)} ${esc(o.service)}<div class="muted sm">${esc(a.city || '')}, ${esc(a.province || '')}</div>`}</td>
        <td data-l="Total" class="r num"><b>${rp(o.total)}</b><div class="muted sm">${o.payment === 'qris' ? 'QRIS' : 'Transfer'}</div></td>
        <td data-l="Status"><span class="badge ${WO_BADGE[o.status]}">${WO_LABEL[o.status]}</span></td>
        <td class="r"><button class="btn sm ${o.status === 'menunggu_verifikasi' ? 'primary' : ''}" data-o="${o.id}">Buka</button></td></tr>`;
    }).join('') : `<tr><td colspan="6" class="empty">Tidak ada pesanan di sini.</td></tr>`;
    $('#wtbl').querySelectorAll('[data-o]').forEach(b => b.onclick = () => openWebOrder(all.find(o => o.id === b.dataset.o), load));
  };
  const load = async () => {

    catch (e) { $('#wtbl tbody').innerHTML = `<tr><td colspan="6"><div class="err">${esc(e.message)}</div></td></tr>`; }
  };
  load();

// One order in a modal: items, address, proof, the next action, links, history.
// `reload` refreshes whichever list opened it.
function openWebOrder(o, reload) {
  const items = woJson(o.items) || [], a = woJson(o.address) || {}, hist = woJson(o.history) || [];
  const proof = o.proof ? `/api/files/web_orders/${o.id}/${o.proof}` : '';
  const pre = ['menunggu_bayar', 'menunggu_verifikasi'].includes(o.status);
  const addrText = `${o.name} (${o.phone})\n${a.street}, ${a.district}, ${a.city}, ${a.province} ${a.postal}`;
  const links = woLinks(o);
  const act = async (action, body = {}) => {
    const r = await api(`/api/store/admin/${o.id}/${action}`, { method: 'POST', body });
    toast('Tersimpan.'); await reload(); openWebOrder(r, reload);
  };
  openModal(`
    <h2 class="num">${esc(o.number)} <span class="badge ${WO_BADGE[o.status]}">${WO_LABEL[o.status]}</span></h2>
    <div class="muted">${fmtTime(o.created)} · ${o.payment === 'qris' ? 'QRIS' : 'Transfer'}${o.status === 'menunggu_bayar' && o.expires_at ? ` · batal otomatis ${fmtTime(o.expires_at)}` : ''}</div>
    <h3 class="sec">Barang</h3>
    ${items.map(i => `<div class="sum"><span>${i.qty} × ${esc(i.name)} <span class="muted num">${esc(i.sku)}</span></span><span class="num">${rp(i.price * i.qty)}</span></div>`).join('')}
    <div class="sum"><span>Ongkir ${o.delivery === 'kirim' ? `(${esc(o.courier)} ${esc(o.service)}, ${(o.weight / 1000).toLocaleString('id-ID')} kg${o.shipping_adjusted ? ', sudah dicek' : ', perkiraan'})` : '(ambil di toko)'}</span><span class="num">${rp(o.shipping)}</span></div>
    <div class="sum"><span>Kode unik</span><span class="num">${rp(o.unique_code)}</span></div>
    <div class="sum total"><span>Harus dibayar</span><span class="num">${rp(o.total)}</span></div>
    ${o.delivery === 'kirim' ? `<h3 class="sec">Alamat kirim</h3><div style="white-space:pre-line">${esc(addrText)}</div><button class="btn sm" id="wcopy" style="margin-top:6px">Salin alamat</button>` : ''}
    ${o.note ? `<h3 class="sec">Catatan pembeli</h3><div>${esc(o.note)}</div>` : ''}
    ${proof ? `<h3 class="sec">Bukti bayar</h3>${/\.pdf$/i.test(o.proof) ? `<a class="btn sm" href="${proof}" target="_blank" rel="noopener">Buka PDF</a>` : `<a href="${proof}" target="_blank" rel="noopener"><img src="${proof}" alt="Bukti bayar" style="max-height:260px;border-radius:8px;border:1px solid var(--line)"></a>`}
      <div class="muted sm">Cocokkan dengan mutasi rekening: nominal persis ${rp(o.total)}.</div>` : ''}
    ${pre && o.delivery === 'kirim' ? `<h3 class="sec">Cek ulang ongkir</h3><div class="row"><input class="input num" id="wfee" inputmode="numeric" value="${o.shipping}"><button class="btn" id="wfeeok" style="flex:0 0 auto">Ubah ongkir</button></div>` : ''}
    ${o.status === 'diproses' && o.delivery === 'kirim' ? `<h3 class="sec">Nomor resi ${esc(o.courier)}</h3><input class="input" id="wresi" placeholder="mis. JX1234567890" autocapitalize="characters">` : ''}
    ${o.status === 'dikirim' ? `<h3 class="sec">Resi ${esc(o.courier)} ${esc(o.service)}</h3><div class="row"><input class="input num" id="wresi2" value="${esc(o.resi)}"><button class="btn" id="wresiok" style="flex:0 0 auto">Ubah resi</button></div>
      <a class="muted sm" href="${cekResi(o.resi)}" target="_blank" rel="noopener">Cek posisi paket di cekresi.com</a>` : ''}
    <div id="werr"></div>
    <div class="row" style="margin-top:14px;flex-wrap:wrap">
      ${pre ? `<button class="btn primary" id="wconf">Pembayaran diterima</button>` : ''}
      ${o.status === 'menunggu_verifikasi' ? `<button class="btn" id="wrej">Tolak bukti</button>` : ''}
      ${o.status === 'diproses' ? (o.delivery === 'kirim' ? `<button class="btn primary" id="wship">Simpan resi & kirim</button>` : `<button class="btn primary" id="wready">Siap diambil</button>`) : ''}
      ${['dikirim', 'siap_diambil'].includes(o.status) ? `<button class="btn primary" id="wdone">${o.status === 'dikirim' ? 'Paket sudah diterima' : 'Sudah diambil'}</button>` : ''}
    </div>
    <a class="btn block wa" style="margin-top:8px" target="_blank" rel="noopener" href="${woWa(o)}">WhatsApp pembeli</a>
    ${['menunggu_bayar', 'menunggu_verifikasi', 'diproses'].includes(o.status) ? `<button class="btn danger block" id="wcancel" style="margin-top:8px">Batalkan pesanan</button>` : ''}
    <h3 class="sec">Link pesanan</h3>
    ${links.track ? `<div class="linkrow"><span><b>Lacak</b> <span class="muted sm">untuk pembeli, tanpa login</span><a href="${esc(links.track)}" target="_blank" rel="noopener">${esc(links.track.replace(/^https?:\/\//, ''))}</a></span><button class="btn sm" data-copy="${esc(links.track)}">Salin</button></div>` : ''}
    <div class="linkrow"><span><b>Kasir</b> <span class="muted sm">untuk staf, perlu login</span><a href="${esc(links.pos)}">${esc(links.pos.replace(/^https?:\/\//, ''))}</a></span><button class="btn sm" data-copy="${esc(links.pos)}">Salin</button></div>
    <h3 class="sec">Riwayat</h3>
    ${hist.slice().reverse().map(h => `<div class="sum"><span>${esc(h.note)}${h.by ? ` <span class="muted">· ${esc(h.by)}</span>` : ''}</span><span class="muted sm" style="white-space:nowrap">${fmtTime(String(h.at).replace('T', ' '))}</span></div>`).join('')}`);
  const fail = e => { $('#werr').innerHTML = `<div class="err">${esc(e.message)}</div>`; };
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { fail(e); b.disabled = false; } }; };
  document.querySelectorAll('.modal [data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy, 'Link disalin.'));
  on('wcopy', async () => { await copyText(addrText, 'Alamat disalin.'); $('#wcopy').disabled = false; });
  on('wfeeok', () => act('shipping', { fee: parseInt($('#wfee').value.replace(/\D/g, ''), 10) || 0 }));
  on('wconf', async () => {
    if (!confirmInline('werr', `Pastikan ${rp(o.total)} sudah masuk ke rekening/QRIS. Tekan lagi untuk konfirmasi.`)) { $('#wconf').disabled = false; return; }
    await act('confirm');
  });
  on('wrej', async () => {
    const reason = $('#wrejr')?.value.trim();
    if (!reason) { $('#werr').innerHTML = `<input class="input" id="wrejr" placeholder="Alasan, mis. nominal tidak sesuai" style="margin-top:10px">`; $('#wrejr').focus(); $('#wrej').disabled = false; return; }
    await act('reject', { reason });
  });
  on('wship', () => act('ship', { resi: $('#wresi').value.trim().toUpperCase() }));
  on('wresiok', () => act('resi', { resi: $('#wresi2').value.trim().toUpperCase() }));
  on('wready', () => act('ready'));
  on('wdone', () => act('complete'));
  on('wcancel', async () => {
    const reason = $('#wcanr')?.value.trim();
    if (!reason) { $('#werr').innerHTML = `<input class="input" id="wcanr" placeholder="Alasan pembatalan" style="margin-top:10px"><div class="muted sm">Stok dikembalikan.${o.sale ? ' Penjualan dibatalkan; kembalikan dana pembeli secara manual.' : ''}</div>`; $('#wcanr').focus(); $('#wcancel').disabled = false; return; }
    await act('cancel', { reason });
  });
}

// ── pengiriman (owner/admin) ────────────────────────
// Paid web orders from packing to the buyer's door: type the resi, send the
// buyer a WhatsApp with their tracking link, mark delivered.
const SH_GROUPS = [
  ['kirim', 'Perlu dikirim', o => o.status === 'diproses' && o.delivery === 'kirim'],
  ['jalan', 'Dalam perjalanan', o => o.status === 'dikirim'],
  ['ambil', 'Ambil di toko', o => ['diproses', 'siap_diambil'].includes(o.status) && o.delivery === 'ambil'],
  ['selesai', 'Selesai', o => o.status === 'selesai'],
];
const SHS = { group: 'kirim', q: '' };
async function viewShip() {
  $('#view').innerHTML = `<div id="shtabs"></div>
    <div class="toolbar"><input class="input" id="shq" placeholder="Cari no. pesanan / nama / resi / HP" value="${esc(SHS.q)}"></div>
    <div id="shlist" class="ship-list"><div class="card empty">Memuat…</div></div>`;
  let all = [];
  const tabs = () => subTabs($('#shtabs'), SH_GROUPS.map(([k, l, f]) => [k, `${l} <span class="cnt">${all.filter(f).length}</span>`]), SHS, 'group', draw);
  const card = o => {
    const items = woJson(o.items) || [], a = woJson(o.address) || {}, links = woLinks(o);
    const shipped = (woJson(o.history) || []).filter(h => h.status === 'dikirim').shift();
    return `<div class="card ship" data-id="${o.id}">
      <div class="ship-head"><b class="num">${esc(o.number)}</b><span class="badge ${WO_BADGE[o.status]}">${WO_LABEL[o.status]}</span>
        <span class="muted sm">${o.status === 'dikirim' && shipped ? 'dikirim ' + fmtTime(String(shipped.at).replace('T', ' ')) : 'dipesan ' + fmtTime(o.created)}</span></div>
      <div class="ship-body">
        <div><b>${esc(o.name)}</b> <span class="muted">${esc(o.phone)}</span>
          <div class="muted sm">${o.delivery === 'kirim' ? `${esc(a.city || '')}, ${esc(a.province || '')} · ${esc(o.courier)} ${esc(o.service)} · ${(o.weight / 1000).toLocaleString('id-ID')} kg` : 'Ambil di toko'}</div>
          <div class="sm" style="margin-top:4px">${items.map(i => `${i.qty}× ${esc(i.name)}`).join(', ')}</div></div>
        ${o.status === 'diproses' && o.delivery === 'kirim' ? `<form class="ship-resi" data-ship="${o.id}"><input class="input num" name="resi" placeholder="Nomor resi ${esc(o.courier)}" autocapitalize="characters" required minlength="6"><button class="btn primary">Kirim</button></form>` : ''}
        ${o.status === 'dikirim' ? `<div class="ship-resi"><span class="muted sm">Resi</span> <b class="num">${esc(o.resi)}</b>
          <button class="btn sm" data-copy="${esc(o.resi)}" data-msg="Resi disalin.">Salin</button><a class="btn sm" href="${cekResi(o.resi)}" target="_blank" rel="noopener">Cek posisi</a></div>` : ''}
      </div>
      <div class="ship-acts">
        <a class="btn sm wa" target="_blank" rel="noopener" href="${woWa(o)}">WhatsApp pembeli</a>
        ${links.track ? `<button class="btn sm" data-copy="${esc(links.track)}" data-msg="Link lacak disalin.">Salin link lacak</button>` : ''}
        ${o.status === 'dikirim' ? `<button class="btn sm" data-act="complete">Paket diterima</button>` : ''}
        ${o.status === 'diproses' && o.delivery === 'ambil' ? `<button class="btn sm primary" data-act="ready">Siap diambil</button>` : ''}
        ${o.status === 'siap_diambil' ? `<button class="btn sm" data-act="complete">Sudah diambil</button>` : ''}
        <button class="btn sm ghost" data-open>Detail</button>
      </div><div class="ship-err"></div></div>`;
  };
  const draw = () => {
    const f = SH_GROUPS.find(g => g[0] === SHS.group)[2], q = SHS.q.trim().toLowerCase();
    let rows = all.filter(f).filter(o => !q || [o.number, o.name, o.resi, o.phone, o.track].some(v => (v || '').toLowerCase().includes(q)));
    if (SHS.group === 'kirim' || SHS.group === 'ambil') rows.reverse();  // longest waiting first
    if (SHS.group === 'selesai') rows = rows.slice(0, 50);
    const none = { kirim: 'Tidak ada paket yang menunggu dikirim.', jalan: 'Tidak ada paket di perjalanan.', ambil: 'Tidak ada pesanan ambil di toko.', selesai: 'Belum ada pesanan selesai.' }[SHS.group];
    $('#shlist').innerHTML = rows.length ? rows.map(card).join('') : `<div class="card empty">${q ? 'Tidak ada yang cocok.' : none}</div>`;
    const byId = id => all.find(o => o.id === id);
    $('#shlist').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy, b.dataset.msg));
    $('#shlist').querySelectorAll('[data-open]').forEach(b => b.onclick = () => openWebOrder(byId(b.closest('[data-id]').dataset.id), load));
    $('#shlist').querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const c = b.closest('[data-id]'); b.disabled = true;
      try { await api(`/api/store/admin/${c.dataset.id}/${b.dataset.act}`, { method: 'POST', body: {} }); toast('Tersimpan.'); await load(); }
      catch (e) { $('.ship-err', c).innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false; }
    });
    $('#shlist').querySelectorAll('form[data-ship]').forEach(f => f.onsubmit = async ev => {
      ev.preventDefault();
      const c = f.closest('[data-id]'), btn = $('button', f); btn.disabled = true;
      try {
        const r = await api(`/api/store/admin/${f.dataset.ship}/ship`, { method: 'POST', body: { resi: f.resi.value.trim().toUpperCase() } });
        await load();
        // The buyer hears about it right away: one tap opens WhatsApp with the resi and tracking link.
        openModal(`<h2>Paket dikirim</h2><p>${esc(r.number)} · ${esc(r.courier)} ${esc(r.service)} · resi <b class="num">${esc(r.resi)}</b></p>
          <p class="muted sm" style="white-space:pre-line;background:var(--bg);border-radius:10px;padding:10px 12px">${esc(woMessage(r))}</p>
          <a class="btn block wa" target="_blank" rel="noopener" href="${woWa(r)}" id="shwa">Kirim WhatsApp ke ${esc(r.name)}</a>
          <button class="btn block" style="margin-top:8px" id="shclose">Nanti saja</button>`);
        $('#shwa').addEventListener('click', () => setTimeout(closeModal, 300));
        $('#shclose').onclick = closeModal;
      } catch (e) { $('.ship-err', c).innerHTML = `<div class="err">${esc(e.message)}</div>`; btn.disabled = false; }
    });
  };
  const load = async () => {
    try { all = (await list('web_orders', { filter: 'status = "diproses" || status = "dikirim" || status = "siap_diambil" || status = "selesai"', sort: '-created', perPage: 500 })).items; tabs(); draw(); openDeepOrder(all, load); }
    catch (e) { $('#shlist').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $('#shq').oninput = () => { SHS.q = $('#shq').value; draw(); };
  load();
}

// …/#/o/{number}: the order link in WhatsApp messages. After login it opens
// Pengiriman (paid orders) or Pesanan Online (the rest) with that order.
async function takeDeepLink() {
  const m = location.hash.match(/^#\/o\/([A-Za-z0-9-]+)$/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  if (!TABS[role()].some(t => t[0] === 'online')) return false;
  try {
    const o = (await list('web_orders', { filter: `number = ${pbq(decodeURIComponent(m[1]))}`, perPage: 1 })).items[0];
    if (!o) { toast('Pesanan ' + m[1] + ' tidak ditemukan.', true); return false; }
    const g = SH_GROUPS.find(([, , f]) => f(o));
    if (g) { S.tab = 'ship'; SHS.group = g[0]; SHS.q = ''; }
    else { S.tab = 'online'; WS.group = (WO_GROUPS.find(x => x[2].includes(o.status)) || WO_GROUPS[0])[0]; }
    S.deep = o.id;
    return true;
  } catch (_) { return false; }
}
function openDeepOrder(all, reload) {
  if (!S.deep) return;
  const o = all.find(x => x.id === S.deep);
  S.deep = '';
  if (o) openWebOrder(o, reload);
}
window.addEventListener('hashchange', async () => { if (S.user && await takeDeepLink()) renderShell(); });

// ── pelanggan ───────────────────────────────────────
async function viewMe() {
  $('#view').innerHTML = `<div class="empty">Memuat…</div>`;
  try {
    const [me, sales, debts] = await Promise.all([
      api(`/api/collections/users/records/${S.user.id}`),
      list('sales', { sort: '-created', perPage: 50 }),
      list('receivables', { filter: 'status = "belum"', sort: 'due_date' }),
    ]);
    const owed = debts.items.reduce((a, d) => a + d.amount - d.paid, 0);
    $('#view').innerHTML = `
      <div class="stats">
        <div class="card stat"><small>Poin kamu</small><b class="num">${me.points}</b></div>
        <div class="card stat"><small>Total belanja</small><b class="num">${sales.items.filter(s => s.status !== 'batal').length}×</b></div>
        ${owed ? `<div class="card stat"><small>Sisa piutang</small><b class="num" style="color:var(--warn)">${rp(owed)}</b></div>` : ''}
      </div>
      <h3 class="sec">Riwayat belanja</h3>
      <div class="card">${sales.items.length ? sales.items.map(s => `
        <button class="tx" data-s="${s.id}">
          <span><b class="num">${esc(s.number)}</b> ${s.status !== 'lunas' ? `<span class="badge ${s.status === 'batal' ? 'bad' : 'warn'}">${s.status}</span>` : ''}</span>
          <b class="num">${rp(s.total)}</b>
          <small class="muted">${fmtTime(s.created)}</small>
          <small class="muted">${s.points_earned && s.status !== 'batal' ? '+' + s.points_earned + ' poin' : ''}</small>
        </button>`).join('') : `<div class="empty">Belum ada belanja.</div>`}</div>`;
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
      const sale = sales.items.find(s => s.id === b.dataset.s);
      const it = await list('sale_items', { filter: `sale = ${pbq(sale.id)}` });
      showReceipt(sale, it.items, false);
    });
  } catch (e) { $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

boot();
</script>
