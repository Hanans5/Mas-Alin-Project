<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a0404">
<title>Nelin Batik</title>
<script>try{var t=localStorage.getItem('nb_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(_){}</script>
<style>
:root{
  --bg:#f8f2ec;--card:#fff;--ink:#2b1411;--muted:#7a5d55;--line:#eadcd3;
  --accent:#8a2b1f;--accent-ink:#fff;--accent-soft:#f6e4dd;
  --nav-bg:#4a0404;--nav-ink:#f6e9dc;--nav-muted:#d8b5a3;--nav-on:#6b1f1a;--nav-line:rgba(246,233,220,.16);
  --ok:#16803c;--ok-soft:#e8f6ed;--bad:#c62828;--bad-soft:#fdecec;--warn:#a15c00;--warn-soft:#fff6e0;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
/* Theme: Pengaturan → Tampilan stores auto / light / dark per device (nb_theme);
   auto follows the device, the other two pin it via <html data-theme>. */
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170a08;--card:#231210;--ink:#f6e9dc;--muted:#c9a99b;--line:#3d211c;
  --accent:#ec8a55;--accent-ink:#1c0906;--accent-soft:#40190f;
  --nav-bg:#2c0605;--nav-ink:#f6e9dc;--nav-muted:#d2ad9b;--nav-on:#5a1a14;--nav-line:rgba(246,233,220,.12);
  --ok:#4cc27a;--ok-soft:#173222;--bad:#ff6b6b;--bad-soft:#3a1a1a;--warn:#f0b44a;--warn-soft:#352a12;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#170a08;--card:#231210;--ink:#f6e9dc;--muted:#c9a99b;--line:#3d211c;
  --accent:#ec8a55;--accent-ink:#1c0906;--accent-soft:#40190f;
  --nav-bg:#2c0605;--nav-ink:#f6e9dc;--nav-muted:#d2ad9b;--nav-on:#5a1a14;--nav-line:rgba(246,233,220,.12);
  --ok:#4cc27a;--ok-soft:#173222;--bad:#ff6b6b;--bad-soft:#3a1a1a;--warn:#f0b44a;--warn-soft:#352a12;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:var(--shadow)}
.login h1{margin:0 0 2px;font-size:24px}
.login .btn{margin-top:18px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:56px}
.brand{font-weight:800;font-size:17px;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:40px}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.who{font-size:13px;text-align:right;line-height:1.2;white-space:nowrap}
.who b{display:block;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
main{padding:16px}

/* POS */
.pos{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
/* grid children default to min-width:auto, so the scrolling chip row would
   stretch the column past the screen on phones */
.pos>*{min-width:0}
.search{display:flex;gap:8px;position:sticky;top:var(--sticky-top,72px);z-index:5;background:var(--bg);padding-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:104px;box-shadow:var(--shadow);transition:transform .08s}
.prod:active{transform:scale(.97)}
.prod:disabled{opacity:.45}
.prod .n{font-weight:650;font-size:14px;line-height:1.25}
.prod .p{font-weight:800;color:var(--accent);margin-top:auto}
.prod .s{font-size:12px;color:var(--muted)}
.prod .s.low{color:var(--warn);font-weight:700}
.prod .inCart{align-self:flex-start}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

.cart{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:sticky;top:var(--sticky-top,72px);display:flex;flex-direction:column;max-height:calc(100vh - var(--sticky-top,72px) - 16px)}
.cart-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.cust{flex:1;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;min-height:44px}
.cust b{display:block;font-size:14px}
.cust small{color:var(--muted)}
.lines{overflow:auto;flex:1;padding:4px 16px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .n{font-weight:600;font-size:14px}
.line .u{font-size:13px;color:var(--muted)}
.line .t{font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800}
.qty input{width:44px;text-align:center;border:1px solid var(--line);border-radius:8px;height:32px;background:var(--card)}
.cart-f{padding:12px 16px 16px;border-top:1px solid var(--line)}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.extras .input{min-height:38px;padding:7px 10px;font-size:14px}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.sum.total{font-size:20px;font-weight:800;padding-top:6px}
.sum.disc{color:var(--ok)}
.cart-f .btn.primary{margin-top:12px;font-size:17px;min-height:52px}
.pv-err{color:var(--bad);font-size:13px;margin-top:6px}

/* mobile cart bar */
.cartbar{display:none}
@media (max-width:860px){
  .pos{grid-template-columns:1fr}
  .cart{display:none;position:fixed;inset:0;z-index:40;max-height:none;border-radius:0;border:0}
  .cart.open{display:flex}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:800;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  main{padding-bottom:96px}
  .top{flex-wrap:wrap;row-gap:0;padding-bottom:4px}
  .brand{flex:1}
  .nav{order:3;flex-basis:100%}
  .who .badge{display:none}
  .search{position:static}
}
.only-mobile{display:none}
@media (max-width:860px){.only-mobile{display:inline-flex}}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.modal{align-items:center;padding:16px}}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:600px){.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px;font-size:19px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:46px;font-weight:700}
.pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bigtotal{font-size:30px;font-weight:800;text-align:center;margin:6px 0 2px}
.change{text-align:center;font-size:18px;font-weight:700;margin-top:10px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list-item:hover{background:var(--bg)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* receipt */
.receipt{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#000;border:1px dashed #bbb;border-radius:8px;padding:14px;margin:12px 0}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.legacy-day{padding:12px 14px;margin:-4px 0 12px;border-left:4px solid var(--accent)}
.receipt .rlogo{display:block;width:75%;max-width:220px;height:auto;margin:0 auto 4px}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:58mm;padding:2mm}
  #print .receipt{border:0;margin:0;padding:0;font-size:11px}
  body.print-a4 #print{width:auto;padding:0}
  .report-print{font:12px/1.4 system-ui,sans-serif;color:#000}
  .report-print .tbl{font-size:11px}
  .report-print .tbl th,.report-print .tbl td{padding:4px 6px;border-bottom:1px solid #ccc;color:#000}
  .report-print .sum{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:4px 0}
  .report-print .bar{background:#999}
}


/* tables / cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.tx:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:14px}
.stat small{color:var(--muted);font-weight:600}
.stat b{display:block;font-size:22px}
h3.sec{margin:18px 0 8px;font-size:15px}
.sm{font-size:12px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.subtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:0}
.bonnote{display:block;width:calc(100% - 24px);margin:6px 12px 0;text-align:left;border:1.5px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:600}
.cd-grid{display:grid;gap:16px;margin-top:10px}
@media (min-width:900px){.cd-grid{grid-template-columns:minmax(300px,380px) 1fr;align-items:start}.cd-form{position:sticky;top:var(--sticky-top,72px)}}
.cd-spend{min-width:0}
.cd-big b{color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 6px;font-weight:700;min-height:46px;line-height:1.2;color:var(--ink)}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.payrow{margin-top:4px}
.payrow .pick{flex-wrap:wrap}
.paysum{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.paysum .sum.ok b{color:var(--ok)}.paysum .sum.warn b{color:var(--warn)}.paysum .sum.bad b{color:var(--bad)}
.paysum .err{margin-top:6px}
.bonbox{margin-top:10px;padding:10px 12px;border:1.5px solid var(--warn);border-radius:10px;background:var(--warn-soft)}
.emp-hint{margin:8px 12px 0}
.input.emp{margin:8px 12px 2px;width:calc(100% - 24px);font-weight:600}
.input.emp.need{border-color:var(--warn);background:var(--warn-soft)}
/* menu layout: sidebar (PC, like the old system), top tabs (phone/tablet), drawer (sidebar on a phone) */
.shell[data-nav=side]{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;--sticky-top:16px}
.shell[data-nav=side] .top{display:none}
.shell[data-nav=top] .side,.shell[data-nav=top] .side-scrim{display:none}
.shell .menu-btn{display:none}
.shell[data-nav=drawer] .menu-btn{display:inline-flex;font-size:20px}
.shell[data-nav=drawer] .nav{display:none}
.shell-main{min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.shell[data-nav=side] .side{position:sticky;top:0;height:100vh;overflow:hidden}
.shell[data-nav=drawer] .side{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(280px,85vw);overflow:hidden;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.shell[data-nav=drawer].open .side{transform:none}
.side-scrim{display:none}
.shell[data-nav=drawer].open .side-scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4)}
.side-brand{font-weight:800;font-size:18px;padding:18px 20px 10px}
.side-nav{display:grid;align-content:start;gap:1px;padding:4px 10px 12px;flex:1 1 auto;min-height:0;overflow-y:auto}
.side-nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;font-weight:600;color:var(--muted);min-height:36px}
.side-nav button:hover{background:var(--bg);color:var(--ink)}
.side-nav button.on{background:var(--accent-soft);color:var(--accent)}
.side-nav .ni{flex:0 0 auto}
.side-group{font-size:12px;font-weight:700;color:var(--muted);padding:12px 10px 3px}
.side-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.side-foot .who{text-align:left}
@media (prefers-reduced-motion:reduce){.shell .side{transition:none}}
.nav-prev{display:grid;gap:3px;height:64px;padding:5px;border-radius:8px;margin-bottom:6px;border:1px solid var(--line);background:var(--bg)}
.nav-prev i{border-radius:3px;background:var(--line)}
.nav-prev i.hl{background:var(--accent)}
/* np-* modifiers, not .side/.top: those names are the app's own sidebar and top bar */
.nav-prev.np-side{grid-template-columns:1fr 3fr}.nav-prev.np-side i:first-child{grid-row:span 2}
.nav-prev.np-top{grid-template-rows:9px 1fr}
.nav-prev.np-auto{grid-template-columns:1fr 1fr}
.swline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.swline.off{opacity:.5}
.swline .qty{flex:0 0 auto}
.swhits{display:grid;gap:4px;margin:6px 0 8px}
.swhits button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.swhits button:disabled{opacity:.5}
.tblwrap{overflow-x:auto}
.tbl .totrow td{border-top:2px solid var(--line);background:var(--bg)}
.pos-tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tool{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);min-height:34px}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.prod .kodi{display:block;font-size:11px;font-weight:600;color:var(--ok)}
.prod.withimg{padding-top:8px}
.pimg{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:6px;background:var(--bg)}
.pimg.ph{display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--muted)}
.line .u.special{color:var(--ok);font-weight:600}
.lp{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:7px;font-size:12px;font-weight:700;padding:3px 9px;margin-left:6px;min-height:28px;vertical-align:middle}
.lp.on{background:var(--accent);color:#fff}
.cart-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:2px 0 4px;flex-wrap:wrap}
.cart-tools #cclear{color:var(--bad);border:1px solid var(--line);min-height:30px;padding:4px 10px}
.cart-tools .err{margin:0;padding:6px 10px;font-size:13px}
.choice-list{display:grid;gap:8px}
.pick{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pick:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block}.pick small{color:var(--muted)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;text-decoration:none}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.linkrow>span{display:grid;min-width:0}.linkrow a{overflow-wrap:anywhere;font-size:13px}
.ship-list{display:grid;gap:10px}
.ship{padding:14px 16px;display:grid;gap:10px}
.ship-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ship-head .muted{margin-left:auto}
.ship-body{display:grid;gap:10px}
@media (min-width:861px){.ship-body{grid-template-columns:1fr minmax(300px,380px);align-items:center}}
.ship-resi{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
form.ship-resi .input{flex:1;min-width:0}
.ship-acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.ship-acts .btn{text-decoration:none}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.theme-opt{display:grid;gap:4px;align-content:start;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}
.theme-opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-opt input{position:absolute;opacity:0;pointer-events:none}
.theme-opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.theme-prev{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:10px 1fr;gap:4px;height:64px;padding:6px;border-radius:8px;margin-bottom:6px;border:1px solid var(--line)}
.theme-prev i:first-child{grid-column:1/-1;border-radius:3px}
.theme-prev i{border-radius:4px}
.theme-prev.light{background:#f6f5f3}.theme-prev.light i{background:#fff;border:1px solid #e7e3de}.theme-prev.light i:first-child{background:#e8590c;border:0}
.theme-prev.dark{background:#141210}.theme-prev.dark i{background:#1e1b18;border:1px solid #332e29}.theme-prev.dark i:first-child{background:#ff7a33;border:0}
.theme-prev.auto{background:linear-gradient(135deg,#f6f5f3 50%,#141210 50%)}.theme-prev.auto i{background:rgba(127,127,127,.35)}.theme-prev.auto i:first-child{background:#e8590c}
.subtabs .cnt{display:inline-block;min-width:22px;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);font-size:12px;font-weight:700;text-align:center}
.subtabs button.on .cnt{background:var(--accent-soft);color:var(--accent)}
.range{align-items:center}
.range .chips{flex:1 1 100%}
.range .input{flex:1 1 140px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* Dasbor overview (owner/admin): one orange series; #e8590c passes the chart colour checks on both surfaces */
:root{--chart:#e8590c}
.ov-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:26px 0 10px}
.ov-head h2{margin:0;font-size:18px;flex:1 1 auto}
.ov-chart{position:relative;padding:14px 14px 8px}
.ov-chart svg{display:block;width:100%;overflow:visible}
.ov-chart .bar{fill:var(--chart)}
.ov-chart .hit{fill:transparent;cursor:pointer;outline:none}
.ov-chart .hit:hover+.bar,.ov-chart .hit:focus-visible+.bar{opacity:.78}
.ov-chart .grid{stroke:var(--line);stroke-width:1}
.ov-chart .axis{fill:var(--muted);font-size:11px}
.ov-chart .peak{fill:var(--ink);font-size:11px;font-weight:700}
.ov-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2}
.ov-tip b{display:block;font-size:13px}
.ov-chart details{margin-top:8px}
.ov-chart summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.hb-list{padding:8px 14px 12px}
.hb{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.hb:last-child{border-bottom:0}
.hb-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hb-s{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-2px}
.hb-v{font-weight:700}
.hb-t{grid-column:1/-1;height:8px}
.hb-t i{display:block;height:100%;min-width:2px;background:var(--chart);border-radius:0 4px 4px 0}
.ov-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px 12px;color:var(--muted);font-size:13px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.statement{padding:16px 18px;max-width:560px}
.statement .sum{padding:6px 0;border-bottom:1px solid var(--line)}
.statement .sum.total{border-bottom:0;padding-top:12px}
.pl-sub{font-size:16px}
.tbl tr.hl td{background:var(--bg)}
.barcell{width:30%}
.bar{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.formcard{padding:16px 18px;max-width:720px}
textarea.input{min-height:90px;resize:vertical}
@media (max-width:720px){.barcell{display:none!important}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar>.input{flex:1 1 160px;width:auto}
.toolbar>#pq,.toolbar>#sp{flex:3 1 240px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}

.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.off td{opacity:.55}
.tbl td .btn.sm{min-height:32px}
/* Phones: each row becomes a small card with labels. */
@media (max-width:720px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left}

  .tbl td:last-child:not([data-l]){justify-content:flex-end;gap:8px;padding-top:8px}

/* Mahogany (Mas Alin, 2026-10-07): deep red-brown menu with cream text,

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.wm{position:fixed;left:50%;top:50%;width:min(56vw,560px);aspect-ratio:392/167;transform:translate(-50%,-50%);

@media print{.wm{display:none}}
/* "Beta" pill on Pre-Order (menu and page title): the menu's own badge colours, so it reads in every theme */

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="print"></div>
<script>
'use strict';
// Nelin Batik front end. Talks to PocketBase on the same origin. Prices,
// stock and permissions are decided by the server (pb_hooks); this page only
// shows what it's told and sends what the kasir picked.

const LS_AUTH = 'nb_auth';
const S = {
  token: '', user: null, settings: null,
  products: [], categories: [], methods: [],
  q: '', cat: '',
  cart: [],            // [{id, qty}]
  customer: null,      // users record (role pelanggan)
  voucher: '', points: 0, discount: 0,
  preview: null, previewErr: '',
  tab: 'pos',
};

// ── helpers ─────────────────────────────────────────
// @page can't depend on a class, so the paper size is swapped in just before
// printing: 58mm roll for receipts, A4 for reports.
function printAs(paper) {
  let st = document.getElementById('pagesize');
  if (!st) { st = document.createElement('style'); st.id = 'pagesize'; document.head.appendChild(st); }
  st.textContent = paper === 'a4' ? '@page{size:A4;margin:12mm}' : '@page{size:58mm auto;margin:0}';
  document.body.classList.toggle('print-a4', paper === 'a4');
  window.print();
  setTimeout(() => document.body.classList.remove('print-a4'), 500);
}
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
// A superadmin works as the owner everywhere; realRole() is what the badge shows
// and what keeps owner accounts out of a superadmin's hands.
const realRole = () => S.user?.role || '';
const role = () => realRole() === 'superadmin' ? 'owner' : realRole();
const isSuperadmin = () => realRole() === 'superadmin';
// Mas Alin stays anonymous to buyers (2026-10-08): on struk and in Transaksi a
// sale made from an owner login, or with no cashier (old-system receipts),
// shows "Toko". Internal reports keep the real name.
const cashierLabel = u => !u || u.role === 'owner' ? 'Toko' : (u.name || u.username);
const isManager = () => role() === 'owner' || role() === 'admin';
const isOwner = () => role() === 'owner';
// The cart's "Harga" button: kasir and admin get Per pcs + Kodian, the owner everything.
const canPrice = () => isManager() || role() === 'kasir';
// Till preferences, per device: ask quantity on tap, show product photos, how
// the struk prints (browser print window or RawBT for a Bluetooth printer) and
// whether it prints by itself after a sale.
const POSP_DEFAULT = { askQty: false, images: false, printMode: 'browser', autoPrint: false };
const POSP = (() => { try { return Object.assign({}, POSP_DEFAULT, JSON.parse(localStorage.getItem('nb_posp') || '{}')); } catch (_) { return Object.assign({}, POSP_DEFAULT); } })();
const savePOSP = () => { try { localStorage.setItem('nb_posp', JSON.stringify(POSP)); } catch (_) {} };
const pbDate = s => new Date(String(s).replace(' ', 'T'));
const fmtTime = s => pbDate(s).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const WIB = 7 * 3600e3;
const wibToday = () => new Date(Date.now() + WIB).toISOString().slice(0, 10);
// UTC instant, PocketBase format, of 00:00 WIB on a WIB date.
const wibStartUTC = d => new Date(Date.parse(d + 'T00:00:00Z') - WIB).toISOString().replace('T', ' ');
const pbq = v => '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';

let toastT;
function toast(msg, bad) {
  clearTimeout(toastT);
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); document.body.appendChild(t); }
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  toastT = setTimeout(() => t.remove(), bad ? 4500 : 2200);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token) { logout(); throw new Error('Sesi berakhir, silakan login lagi.'); }
  if (!r.ok) {
    // PocketBase puts field errors under data: {field: {message}}
    const fields = j.data && Object.entries(j.data).map(([k, v]) => `${k}: ${v.message}`).join(', ');
    throw new Error(fields ? `${j.message} (${fields})` : (j.message || `Error ${r.status}`));
  }
  return j;
}
const list = (coll, params = {}) => api(`/api/collections/${coll}/records?` + new URLSearchParams({ perPage: 500, ...params }));

// ── auth ────────────────────────────────────────────
function saveAuth(token, user) {
  S.token = token; S.user = user;
  try { localStorage.setItem(LS_AUTH, JSON.stringify({ token, user })); } catch (_) {}
}
function logout() {
  S.token = ''; S.user = null; S.cart = []; S.customer = null;
  try { localStorage.removeItem(LS_AUTH); } catch (_) {}
  renderLogin();
}
async function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_AUTH) || 'null'); } catch (_) {}
  if (!saved?.token) return renderLogin();
  S.token = saved.token;
  try {
    const r = await api('/api/collections/users/auth-refresh', { method: 'POST' });
    saveAuth(r.token, r.record);
    await startApp();
  } catch (_) { logout(); }
}

function renderLogin(err) {
  closeModal();
  $('#app').innerHTML = `
  <div class="login">
    <form id="lf" autocomplete="on">
      <h1>Nelin Batik</h1>
      <div class="muted">Masuk untuk melanjutkan</div>
      <label class="f" for="lu">Username</label>
      <input class="input" id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="f" for="lp">Password</label>
      <input class="input" id="lp" type="password" autocomplete="current-password" required>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <button class="btn primary block" id="lb">Masuk</button>
    </form>
  </div>`;
  $('#lu').focus();
  $('#lf').onsubmit = async ev => {
    ev.preventDefault();
    $('#lb').disabled = true; $('#lb').textContent = 'Memeriksa…';
    try {
      const r = await api('/api/collections/users/auth-with-password', { method: 'POST',
        body: { identity: $('#lu').value.trim().toLowerCase(), password: $('#lp').value } });
      saveAuth(r.token, r.record);
      await startApp();
    } catch (e) {
      renderLogin(/fail|authenticate|invalid/i.test(e.message) ? 'Username atau password salah.' : e.message);
    }
  };
}

// ── app shell ───────────────────────────────────────
const TABS = {
  owner:     [['dash', 'Dasbor'], ['pos', 'Kasir'], ['po', 'Pre-Order'], ['tx', 'Transaksi'], ['online', 'Pesanan Online'], ['ship', 'Pengiriman'], ['prod', 'Produk'], ['stock', 'Stok'], ['fin', 'Keuangan'], ['rep', 'Laporan'], ['users', 'Pengguna'], ['set', 'Pengaturan'], ['emp', 'Karyawan']],
  admin:     [['dash', 'Dasbor'], ['pos', 'Kasir'], ['po', 'Pre-Order'], ['tx', 'Transaksi'], ['online', 'Pesanan Online'], ['ship', 'Pengiriman'], ['prod', 'Produk'], ['stock', 'Stok'], ['fin', 'Keuangan'], ['rep', 'Laporan'], ['users', 'Pengguna'], ['set', 'Pengaturan'], ['emp', 'Karyawan']],
  // kasir = the karyawan's shared login; it opens on Kasir (first entry), the menu keeps NAV order
  kasir:     [['pos', 'Kasir'], ['po', 'Pre-Order'], ['dash', 'Dasbor'], ['tx', 'Transaksi'], ['users', 'Pelanggan'], ['fin', 'Keuangan'], ['online', 'Pesanan Online'], ['ship', 'Pengiriman'], ['stock', 'Stok']],
  pelanggan: [['me', 'Akun Saya']],
};
async function startApp() {
  const tabs = TABS[role()];
  if (!tabs) { logout(); return renderLogin('Akun ini tidak punya akses.'); }
  S.tab = tabs[0][0];
  try {
    const st = await list('settings', { perPage: 1 });
    S.settings = st.items[0] || { store_name: 'Nelin Batik' };
  } catch (_) { S.settings = { store_name: 'Nelin Batik' }; }
  applyColorTheme(S.settings.theme_color || '');
  await loadLogo();
  await takeDeepLink();
  renderShell();
}
// The store logo (settings.logo, black on white for the thermal printer) as a
// data URL: the struk prints it without waiting for a download.
async function loadLogo() {
  S.logoData = '';
  const st = S.settings;
  if (!st.logo || !st.id) return;
  try {
    const b = await (await fetch(`/api/files/${st.collectionId || 'settings'}/${st.id}/${st.logo}`)).blob();
    S.logoData = await new Promise((ok, no) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = no; f.readAsDataURL(b); });
    document.documentElement.style.setProperty('--wm-img', `url("${S.logoData}")`);
  } catch (_) {}
}
const brandHtml = store => S.logoData ? `<img class="brand-logo" src="${S.logoData}" alt="">${store}` : store;
// ── menu: left sidebar like Mas Alin's old system, or tabs on top ──
// Order and groups follow the old billing.nelinbatik.my.id sidebar from his
// recording (Dasbor, POS, Transaksi, Pelanggan, Karyawan, Piutang,
// Pengeluaran, Buku Kas, Laba Rugi, Laporan · Inventaris · Pengguna ·
// Setting). Each item opens its page directly. Which views a role may open
// still comes from TABS; the server enforces the same rules.
const NAV_ICON = {
  dash: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  pos: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  tx: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  po: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h3"/>',
  pelanggan: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5a3 3 0 0 1 0 6M21 20c0-2.6-1.7-4.8-4-5.6"/>',
  karyawan: '<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c.8-1.8 2.3-3 4-3s3.2 1.2 4 3"/>',
  piutang: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  pengeluaran: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  bukukas: '<path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h4"/>',
  labarugi: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  fin: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  rep: '<path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/>',
  online: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  ship: '<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  stock: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  prod: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  kategori: '<path d="M3 6h6l2 2h10v11H3z"/>',
  users: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  set: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
};
// [key, label, group, tab, setup?, ownerOnly?]  label null = the role's own TABS label
const NAV = [
  ['dash', null, '', 'dash'],
  ['pos', null, '', 'pos'],
  ['po', null, '', 'po'],
  ['tx', null, '', 'tx'],
  ['pelanggan', 'Pelanggan', '', 'users', () => { US.role = 'pelanggan'; }],
  ['karyawan', 'Karyawan', '', 'emp'],
  ['piutang', 'Piutang', '', 'fin', () => { FS.sub = 'recv'; }],
  ['pengeluaran', 'Pengeluaran', '', 'fin', () => { FS.sub = 'exp'; }],
  ['bukukas', 'Buku Kas', '', 'fin', () => { FS.sub = 'cash'; }, true],
  ['labarugi', 'Laba Rugi', '', 'fin', () => { FS.sub = 'pl'; }, true],
  ['rep', null, '', 'rep'],
  ['online', null, 'Toko Online', 'online'],
  ['ship', null, 'Toko Online', 'ship'],
  ['stock', null, 'Inventaris', 'stock'],
  ['prod', null, 'Inventaris', 'prod'],
  ['kategori', 'Kategori', 'Inventaris', 'prod', () => { S.openCategories = true; }],
  ['users', null, 'Pengguna', 'users', () => { if (US.role === 'pelanggan') US.role = 'kasir'; }],
  ['set', null, 'Setting', 'set'],
  ['me', null, '', 'me'],
];
// The top bar keeps a compact list in the same order (Keuangan holds Piutang…Laba Rugi).

    if (!box || !el || !box.clientWidth) return;
    const [lo, hi, view, scroll] = horiz ? ['left', 'right', 'clientWidth', 'scrollLeft'] : ['top', 'bottom', 'clientHeight', 'scrollTop'];
    const br = box.getBoundingClientRect(), er = el.getBoundingClientRect();
    const start = er[lo] - br[lo] + box[scroll] - 12, end = er[hi] - br[lo] + box[scroll] + 12;

// Line pricing, mirroring the server (lib.js splitPrice): the whole line at

    const seq = ++pvSeq;
    try {
      if (isPO() && !S.customer) throw new Error('Pilih pelanggan dulu: pre-order harus atas nama pelanggan.');
      const r = await api(isPO() ? '/api/po/preview' : '/api/pos/preview', { method: 'POST', body: cartBody() });
      if (seq !== pvSeq) return;
      S.preview = r; S.previewErr = '';
    } catch (e) {
      if (seq !== pvSeq) return;
      S.preview = null; S.previewErr = e.message;
    }
    renderTotals();
  }, 250);
}

function renderCart() {
  const el = $('#cart'); if (!el) return;
  const c = S.customer;
  el.innerHTML = `
    <div class="cart-h">
      <button class="btn ghost sm only-mobile" id="cclose" aria-label="Tutup">←</button>
      <button class="cust" id="pickCust">${c
        ? `<b>${esc(c.name || c.username)}</b><small>${esc(c.phone || '@' + c.username)}</small>`
        : `<b>Pelanggan umum</b><small>Ketuk untuk pilih / daftar member</small>`}</button>
      ${c ? `<button class="btn ghost sm" id="clrCust" aria-label="Hapus pelanggan">✕</button>` : ''}
    </div>
    ${c && S.customerBon ? `<button class="bonnote" id="cbon">Bon belum lunas <b class="num">${rp(S.customerBon.total)}</b> · Bayar</button>` : ''}
    ${S.employees?.length ? `<select class="input emp ${S.employee ? '' : 'need'}" id="emp" aria-label="Karyawan yang melayani"><option value="">Pilih karyawan yang melayani…</option>${S.employees.map(x => `<option value="${x.id}" ${S.employee === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="toko" ${S.employee === 'toko' ? 'selected' : ''}>Toko (tanpa karyawan)</option></select>`

    ${S.cart.length ? `<div class="cart-tools"><button class="btn ghost sm" id="cclear">Kosongkan</button><span id="clrmsg"></span></div>` : ''}
    <div class="lines">${S.cart.length ? S.cart.map(l => {
      const p = prodById(l.id), parts = linePricing(l);
      const how = parts.map(x => partLabel(x, parts.length > 1)).join(' + ');
      return `<div class="line">
        <div><div class="n">${esc(p.name)}</div><div class="u num ${parts.some(x => x.tier !== 'normal') ? 'special' : ''}">${how}</div></div>
        <div class="t num">${rp(lineTotal(l))}</div>
        <div class="u">${l.custom ? 'barang custom' : esc(p.sku)}${canPrice() && !l.custom ? ` <button class="lp ${TIER_NAME[l.tier] ? 'on' : ''}" data-price="${l.id}">${TAG_ICON}${TIER_NAME[l.tier] || 'Harga'}</button>` : ''}</div>
        <div class="qty">
          <button data-dec="${l.id}" aria-label="Kurangi">−</button>
          <input data-qty="${l.id}" value="${l.qty}" inputmode="numeric" aria-label="Jumlah">
          <button data-inc="${l.id}" aria-label="Tambah">+</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty">Keranjang kosong.<br><small>Ketuk produk atau scan barcode.</small></div>`}</div>
    <div class="cart-f">
      <div class="extras">
        ${isManager() ? `<input class="input" id="dc" placeholder="Diskon manual (Rp)" inputmode="numeric" value="${S.discount || ''}">` : ''}
        ${isPO() && isManager() ? `<button class="btn sm" id="pocustom" type="button">+ Barang custom</button>` : ''}

  $('#pickCust').onclick = openCustomerPicker;
  if ($('#clrCust')) $('#clrCust').onclick = () => { S.customer = null; S.customerBon = null; renderCart(); schedulePreview(); };
  if ($('#cbon')) $('#cbon').onclick = () => openBonSearch({ customer: S.customer.id, label: S.customer.name || S.customer.username, after: refreshCustomerBon });
  $('#cclose').onclick = () => el.classList.remove('open');
  el.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => addToCart(b.dataset.inc));
  el.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { const l = S.cart.find(x => x.id === b.dataset.dec); setQty(l.id, l.qty - 1); });
  el.querySelectorAll('[data-qty]').forEach(i => i.onchange = () => setQty(i.dataset.qty, i.value));
  el.querySelectorAll('[data-price]').forEach(b => b.onclick = () => openLinePrice(b.dataset.price));
  if ($('#emp')) $('#emp').onchange = () => { S.employee = $('#emp').value; $('#emp').classList.toggle('need', !S.employee); renderTotals(); };
  const clr = $('#cclear');
  if (clr) clr.onclick = () => { if (!confirmInline('clrmsg', 'Tekan Kosongkan lagi untuk menghapus semua barang.')) return; resetSale(); renderCart(); renderGrid(); schedulePreview(); };
  const bind = (id, key, num) => { const i = $('#' + id); if (i) i.oninput = () => { S[key] = num ? (parseInt(i.value.replace(/\D/g, ''), 10) || 0) : i.value; schedulePreview(); }; };
  bind('dc', 'discount', true);
  $('#pay').onclick = isPO() ? openPoCreate : openPayment;
  if ($('#pocustom')) $('#pocustom').onclick = openCustomItem;
  renderTotals();
}

function renderTotals() {
  const el = $('#totals'); if (!el) return;
  const sub = localSubtotal();
  const p = S.preview;
  const items = S.cart.reduce((a, l) => a + l.qty, 0);
  el.innerHTML = `
    <div class="sum"><span>Subtotal (${items} item)</span><span class="num">${rp(p ? p.subtotal : sub)}</span></div>
    ${p && p.discount > 0 ? `<div class="sum disc"><span>Diskon</span><span class="num">−${rp(p.discount)}</span></div>` : ''}
    <div class="sum total"><span>Total</span><span class="num">${rp(p ? p.total : sub)}</span></div>
    ${isPO() && p ? `<div class="sum"><span>DP minimal</span><span class="num">${rp(p.min_dp)}</span></div>` : ''}
    ${S.previewErr ? `<div class="pv-err">${esc(S.previewErr)}</div>` : ''}
    ${S.cart.length && S.employees?.length && !S.employee ? `<div class="pv-err">Pilih karyawan yang melayani dulu.</div>` : ''}`;
  const pay = $('#pay'); if (pay) pay.disabled = !S.cart.length || !!S.previewErr || (S.employees?.length > 0 && !S.employee);
  const bar = $('#cartbar');
  if (bar) {
    bar.classList.toggle('hidden', !S.cart.length);
    bar.innerHTML = `<span>${items} item</span><span class="num">${rp(p ? p.total : sub)} ›</span>`;
  }
}

// ── customer picker ─────────────────────────────────

  $('#mbg').onclick = ev => { if (ev.target.id === 'mbg') closeModal(); };
}
function closeModal() { $('#modal').innerHTML = ''; }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#mbg')) closeModal(); });

function openCustomerPicker() {
  openModal(`
    <h2>Pilih pelanggan</h2>

    <div id="cres" style="margin-top:6px"></div>

    try {

        <button class="list-item" data-u="${u.id}">

// ── payment ─────────────────────────────────────────
// Payment: first choose how the buyer pays (Tunai, Transfer or Split), then
// the amount. Change only comes from cash; a shortfall can become a bon
// (DP = what is paid now) on a named pelanggan. Mirrors lib.js takePayments;
// the server has the final word.
function openPayment() {
  const p = S.preview;
  if (!p) return toast(S.previewErr || 'Menghitung total, coba lagi.', true);
  const total = p.total;
  const cashM = S.methods.find(m => m.is_cash);
  const trfM = S.methods.find(m => !m.is_cash);
  const modes = [cashM && ['tunai', 'Tunai'], trfM && ['transfer', 'Transfer'], cashM && trfM && ['split', 'Split']].filter(Boolean);
  if (!modes.length) return toast('Belum ada metode bayar aktif.', true);
  let mode = modes[0][0], bon = false, trfTouched = false;
  const val = id => parseInt(($('#' + id)?.value || '').replace(/\D/g, ''), 10) || 0;
  const quick = [...new Set([total, ...[10000, 20000, 50000, 100000].map(n => Math.ceil(total / n) * n)].filter(v => v >= total))].slice(0, 4);
  openModal(`
    <h2>Pembayaran</h2>
    <div class="bigtotal num">${rp(total)}</div>
    <div class="seg" role="radiogroup" aria-label="Cara bayar">${modes.map(([k, l]) => `<button type="button" role="radio" data-mode="${k}">${l}</button>`).join('')}</div>
    <div id="payfields"></div>
    <div class="paysum" id="psum"></div>
    ${S.customer ? `<div id="bonbox" class="bonbox hidden">
      <label style="display:flex;gap:8px;align-items:flex-start;font-weight:600"><input type="checkbox" id="cr" style="margin-top:3px"> <span id="bonlbl"></span></label>
      <div id="duewrap" class="hidden"><label class="f" for="due">Jatuh tempo <small>(opsional)</small></label><input class="input" type="date" id="due" min="${wibToday()}"></div>
    </div>
    <button type="button" class="btn block" id="fullbon" style="margin-top:8px">Bon penuh (bayar nanti, ${esc(S.customer.name || S.customer.username)})</button>`
    : `<div class="muted sm" style="margin-top:8px">Untuk DP atau bon, pilih pelanggan dulu di keranjang.</div>`}
    <label class="f" for="note">Catatan</label><input class="input" id="note" maxlength="300">
    <div id="perr"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="pback">Kembali</button><button class="btn primary" id="pgo">Selesaikan</button></div>`);

  const cashField = (label, value) => `<div class="payrow"><label class="f" for="pcash">${label}</label>
    <input class="input num pay-in" id="pcash" inputmode="numeric" value="${value || ''}" placeholder="0">
    ${mode === 'tunai' ? `<div class="pick" style="margin-top:6px">${quick.map(v => `<button type="button" data-v="${v}">${v === total ? 'Uang pas' : rp(v)}</button>`).join('')}</div>` : ''}</div>`;
  const trfField = (label, value, hint) => `<div class="payrow"><label class="f" for="ptrf">${label}</label>
    <input class="input num pay-in" id="ptrf" inputmode="numeric" value="${value || ''}" placeholder="0">
    <div class="muted sm" style="margin-top:4px">${hint}</div></div>`;
  // Switching mode starts that mode's amounts fresh: full amount in its method.
  const setMode = m => {
    mode = m; bon = false; trfTouched = false;
    document.querySelectorAll('#mbg [data-mode]').forEach(b => { b.classList.toggle('on', b.dataset.mode === m); b.setAttribute('aria-checked', b.dataset.mode === m); });
    $('#payfields').innerHTML = m === 'tunai' ? cashField('Uang diterima (tunai)', total)
      : m === 'transfer' ? trfField('Jumlah transfer', total, 'Transfer harus pas, tidak ada kembalian. Kurangi jumlahnya untuk DP.')
      : cashField('Bagian tunai', '') + trfField('Bagian transfer', total, 'Terisi otomatis: total dikurangi bagian tunai. Bisa diubah.');
    if ($('#cr')) $('#cr').checked = false;
    const c = $('#pcash'), t = $('#ptrf');
    if (c) { c.oninput = () => { if (mode === 'split' && !trfTouched) t.value = Math.max(0, total - val('pcash')) || ''; update(); }; c.onfocus = () => c.select(); }
    if (t) { t.oninput = () => { trfTouched = true; update(); }; t.onfocus = () => t.select(); }
    document.querySelectorAll('#payfields [data-v]').forEach(b => b.onclick = () => { $('#pcash').value = b.dataset.v; update(); });
    update();
    const first = mode === 'transfer' ? t : c;
    first?.focus(); first?.select();
  };
  const read = () => {
    const cash = mode === 'transfer' ? 0 : val('pcash');
    const other = mode === 'tunai' ? 0 : val('ptrf');
    return { cash, other, sum: cash + other };
  };
  const update = () => {
    const { cash, other, sum } = read();
    const go = $('#pgo'), box = $('#psum');
    let ok = true, html = `<div class="sum"><span>Dibayar</span><b class="num">${rp(sum)}</b></div>`;
    if (other > total) { ok = false; html += `<div class="err">Transfer melebihi total. Kembalian hanya dari tunai.</div>`; }
    else if (sum >= total) {
      html += mode === 'transfer' ? `<div class="sum ok"><span>Status</span><b>Lunas</b></div>`
        : `<div class="sum ok"><span>Kembalian (tunai)</span><b class="num">${rp(sum - total)}</b></div>`;
      if (bon) { bon = false; if ($('#cr')) $('#cr').checked = false; }
    } else {
      const short = total - sum;
      if (S.customer && bon) html += `<div class="sum warn"><span>${sum ? 'DP sekarang' : 'Dibayar sekarang'}</span><b class="num">${rp(sum)}</b></div><div class="sum warn"><span>Sisa jadi bon</span><b class="num">${rp(short)}</b></div>`;
      else html += `<div class="sum bad"><span>Kurang</span><b class="num">${rp(short)}</b></div>`;
      ok = !!S.customer && bon;
    }
    box.innerHTML = html;
    if ($('#bonbox')) {
      $('#bonbox').classList.toggle('hidden', sum >= total || other > total);
      $('#bonlbl').innerHTML = `Jadikan bon atas nama <b>${esc(S.customer.name || S.customer.username)}</b>: ${sum ? `DP ${rp(sum)}, ` : ''}sisa ${rp(Math.max(0, total - sum))} dibayar nanti`;
      $('#duewrap').classList.toggle('hidden', !bon);
    }
    go.disabled = !ok;
    go.textContent = sum >= total ? 'Selesaikan' : bon ? (sum ? `Simpan DP ${rp(sum)}` : 'Simpan bon') : 'Selesaikan';
    return { cash, other, sum };
  };
  document.querySelectorAll('#mbg [data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  if ($('#cr')) $('#cr').onchange = () => { bon = $('#cr').checked; update(); };
  if ($('#fullbon')) $('#fullbon').onclick = () => {
    if ($('#pcash')) $('#pcash').value = '';
    if ($('#ptrf')) { $('#ptrf').value = ''; trfTouched = true; }
    bon = true; $('#cr').checked = true; update();
  };
  $('#pback').onclick = closeModal;
  $('#pgo').onclick = async () => {
    const go = $('#pgo'), label = go.textContent;
    const { cash, other, sum } = update();
    go.disabled = true; go.textContent = 'Menyimpan…';
    const payments = [cash > 0 && { method: cashM.id, amount: cash }, other > 0 && { method: trfM.id, amount: other }].filter(Boolean);
    try {
      const r = await api('/api/pos/checkout', { method: 'POST', body: {
        ...cartBody(), payments, credit: sum < total && bon, due_date: bon && $('#due')?.value || '', note: $('#note').value.trim() } });
      resetSale();
      $('#cart')?.classList.remove('open');
      showReceipt(r.sale, r.items, true, r.payments);
      loadCatalog().then(() => { if (S.tab === 'pos' && $('#grid')) { renderGrid(); renderCart(); } }).catch(() => {});
    } catch (e) {
      $('#perr').innerHTML = `<div class="err">${esc(e.message)}</div>`;
      go.disabled = false; go.textContent = label;
    }
  };
  setMode(mode);
}

// ── Pre-Order (2026-10-08) ─────────────────
// DP first, goods later. "Pre-order baru" is the Kasir screen in pre-order
// mode (own cart, no stock limit, customer required); "Daftar" lists the
// orders: Menunggu → Siap diambil → Selesai (pelunasan makes a normal sale) or Batal.
const PS = { sub: 'list', status: 'aktif', q: '' };
const PO_STATUS = { menunggu: ['Menunggu', 'warn'], siap: ['Siap diambil', 'ok'], selesai: ['Selesai', ''], batal: ['Batal', 'bad'] };
function viewPO() {
  const head = () => `<h2 class="po-title">Pre-Order <span class="beta">Beta</span></h2><div id="posub"></div>`;
  const tabs = [['list', 'Daftar pre-order'], ['new', 'Pre-order baru']];
  if (PS.sub === 'new') {
    swapCart('po');
    viewPOS().then(() => { $('#view').insertAdjacentHTML('afterbegin', head()); subTabs($('#posub'), tabs, PS, 'sub', viewPO); });
    return;
  }
  $('#view').innerHTML = head() + `<div id="polist"></div>`;
  subTabs($('#posub'), tabs, PS, 'sub', viewPO);
  (S.methods?.length ? Promise.resolve() : loadCatalog()).then(() => poList($('#polist'))).catch(e => { $('#polist').innerHTML = `<div class="err">${esc(e.message)}</div>`; });
}
async function poList(el) {
  const chips = [['aktif', 'Aktif'], ['siap', 'Siap diambil'], ['selesai', 'Selesai'], ['batal', 'Batal'], ['semua', 'Semua']];
  el.innerHTML = `<div class="row" style="max-width:720px;margin:4px 0 8px"><input class="input" id="poq" placeholder="Cari nama, no HP atau no. PO" value="${esc(PS.q)}" autocomplete="off"></div>
    <div class="chips" style="padding:0 0 8px">${chips.map(([k, l]) => `<button class="chip ${PS.status === k ? 'on' : ''}" data-ps="${k}">${l}</button>`).join('')}</div>
    <div id="postats"></div><div class="card" id="porows"><div class="empty">Memuat…</div></div>`;
  el.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => { PS.status = b.dataset.ps; poList(el); });
  let t; $('#poq').oninput = () => { clearTimeout(t); t = setTimeout(() => { PS.q = $('#poq').value; load(); }, 250); };
  const load = async () => {
    const f = [PS.status === 'aktif' ? `(status = "menunggu" || status = "siap")` : PS.status === 'semua' ? '' : `status = ${pbq(PS.status)}`];
    const q = PS.q.trim();
    if (q) f.push(`(number ~ ${pbq(q)} || customer.name ~ ${pbq(q)} || customer.phone ~ ${pbq(q)} || customer.username ~ ${pbq(q)})`);
    try {
      const r = await list('preorders', { filter: f.filter(Boolean).join(' && '), sort: '-created', perPage: 200, expand: 'customer,employee' });
      const open = r.items.filter(x => x.status === 'menunggu' || x.status === 'siap');
      $('#postats').innerHTML = open.length ? `<div class="stats">
        <div class="card stat"><small>Pre-order aktif</small><b class="num">${open.length}</b></div>
        <div class="card stat"><small>Siap diambil</small><b class="num">${open.filter(x => x.status === 'siap').length}</b></div>
        <div class="card stat"><small>DP diterima</small><b class="num">${rp(open.reduce((a, x) => a + x.dp, 0))}</b></div>
        <div class="card stat"><small>Sisa tagihan</small><b class="num">${rp(open.reduce((a, x) => a + x.total - x.dp, 0))}</b></div></div>` : '';
      $('#porows').innerHTML = r.items.length ? r.items.map(x => {
        const [lbl, cls] = PO_STATUS[x.status] || [x.status, ''];
        const late = (x.status === 'menunggu') && x.ready_date && x.ready_date.slice(0, 10) < wibToday();
        return `<button class="tx" data-po="${x.id}">
          <span><b class="num">${esc(x.number)}</b> <span class="badge ${cls}">${lbl}</span>${late ? ' <span class="badge bad">lewat tanggal</span>' : ''}</span>
          <b class="num">${rp(x.total)}</b>
          <small class="muted">${fmtTime(x.created)} · ${esc(x.expand?.customer?.name || x.expand?.customer?.username || '')}${x.ready_date ? ' · siap ' + fd(x.ready_date.slice(0, 10)) : ''}</small>
          <small class="muted num">${x.status === 'menunggu' || x.status === 'siap' ? `DP ${rp(x.dp)} · sisa ${rp(x.total - x.dp)}` : `DP ${rp(x.dp)}`}</small></button>`;
      }).join('') : `<div class="empty">Belum ada pre-order${PS.status === 'aktif' ? ' aktif' : ''}.</div>`;
      $('#porows').querySelectorAll('[data-po]').forEach(b => b.onclick = () => poDetail(b.dataset.po, () => load()));

// Tunai / Transfer / Split for an amount due; returns () => payments.
function payWidget(el, due, opts = {}) {
  const cashM = S.methods.find(m => m.is_cash), trfM = S.methods.find(m => !m.is_cash);
  const modes = [cashM && ['tunai', 'Tunai'], trfM && ['transfer', 'Transfer'], cashM && trfM && ['split', 'Split']].filter(Boolean);
  let mode = modes[0][0];
  const val = id => parseInt(($('#' + id)?.value || '').replace(/\D/g, ''), 10) || 0;
  const draw = () => {
    el.innerHTML = `<div class="seg" role="radiogroup">${modes.map(([k, l]) => `<button type="button" role="radio" class="${k === mode ? 'on' : ''}" aria-checked="${k === mode}" data-pm="${k}">${l}</button>`).join('')}</div>
      ${mode !== 'transfer' ? `<label class="f" for="pwc">${mode === 'split' ? 'Bagian tunai' : opts.cashLabel || 'Tunai diterima'}</label><input class="input num" id="pwc" inputmode="numeric" value="${mode === 'tunai' ? (opts.start ?? due) || '' : ''}">` : ''}
      ${mode !== 'tunai' ? `<label class="f" for="pwt">${mode === 'split' ? 'Bagian transfer' : 'Jumlah transfer'}</label><input class="input num" id="pwt" inputmode="numeric" value="${mode === 'transfer' ? (opts.start ?? due) || '' : ''}">` : ''}
      <div class="paysum" id="pws"></div>`;
    el.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { mode = b.dataset.pm; draw(); });
    el.querySelectorAll('input').forEach(i => { i.oninput = sum; i.onfocus = () => i.select(); });
    sum();
  };
  const sum = () => {
    const got = val('pwc') + val('pwt'), change = Math.max(0, got - due);
    $('#pws', el).innerHTML = `<div class="sum"><span>Dibayar</span><span class="num">${rp(got)}</span></div>${change && val('pwc') >= change ? `<div class="sum"><span>Kembalian</span><span class="num">${rp(change)}</span></div>` : ''}${opts.after ? opts.after(Math.min(got, due)) : ''}`;
  };
  draw();
  return () => [cashM && { method: cashM.id, amount: val('pwc') }, trfM && { method: trfM.id, amount: val('pwt') }].filter(x => x && x.amount > 0);
}

function payLines(sale, pays) {
  const dp = sale.total > sale.paid ? 'DP ' : '';

    return pays.map(p => [dp + (p.expand?.payment_method?.name || 'Bayar'), p.amount + (p === cash ? sale.change : 0)]);

}

// ── struk printing ──
// Three ways, picked per device (🖨 Printer on the Kasir screen):
//   browser: the print window with the 58 mm layout above (PC/laptop with the
//            printer's driver; Chrome started with --kiosk-printing skips the window)
//   serial:  ESC/POS bytes straight to a COM port through Web Serial (Chrome /
//            Edge on a PC; Bluetooth printers such as the Rongta RPP02N)
//   rawbt:   ESC/POS bytes handed to the RawBT app on Android
// escposReceipt mirrors receiptHtml line for line; change both together.
const ESC_COLS = 32;   // characters per line on a 58 mm roll (font A)
const ESC_DOTS = 384;  // printable dots per line
const asciiOnly = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[×]/g, 'x').replace(/[·•]/g, '-').replace(/[–—]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
  .replace(/[^\x20-\x7e\n]/g, '');
// The logo as a 1-bit raster (GS v 0), cached per logo. Transparent = white.
let escLogo = { src: '', bytes: null };
async function escposLogo() {
  if (!S.logoData) return null;
  if (escLogo.src === S.logoData) return escLogo.bytes;
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = S.logoData; });
  const w = Math.min(256, ESC_DOTS), h = Math.max(1, Math.round(img.height * w / img.width));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
  const px = cx.getImageData(0, 0, w, h).data, wb = w / 8;
  const out = [0x1d, 0x76, 0x30, 0x00, wb & 255, wb >> 8, h & 255, h >> 8];
  for (let y = 0; y < h; y++) for (let xb = 0; xb < wb; xb++) {
    let b = 0;
    for (let bit = 0; bit < 8; bit++) {
      const i = (y * w + xb * 8 + bit) * 4;
      if (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114 < 150) b |= 0x80 >> bit;
    }
    out.push(b);
  }
  escLogo = { src: S.logoData, bytes: out };
  return out;
}

  const raw = (...v) => b.push(...v);
  const text = s => { for (const ch of asciiOnly(s)) b.push(ch.charCodeAt(0)); };

      let r = part.trimEnd();

        let cut = r.lastIndexOf(' ', cols);
        if (cut < cols / 2) cut = cols;
        o.push(r.slice(0, cut).trimEnd()); r = r.slice(cut).trimStart();
      }

  align(1);
  try { const logo = await escposLogo(); if (logo) { raw(...logo); raw(0x0a); } } catch (_) {}
  bold(1); size(0x11); wrap(String(st.store_name || '').toUpperCase(), ESC_COLS / 2).forEach(l => line(l)); size(0); bold(0);
  const head = st.receipt_header || st.address || '';
  if (head) wrap(head).forEach(l => line(l));
  align(0); sep();
  line(sale.number);
  wrap(`${fmtTime(sale.created)} - ${cashierLabel(x.cashier)}`).forEach(l => line(l));
  wrap('Staf: ' + (x.employee ? x.employee.name : 'Toko')).forEach(l => line(l));
  if (x.customer) wrap('Member: ' + (x.customer.name || x.customer.username)).forEach(l => line(l));
  sep();
  if (sale.kind === 'tukar') { bold(1); line('TUKAR BARANG'); bold(0); if (x.ref_sale) line('dari ' + x.ref_sale.number); sep(); }
  for (const i of items) {
    wrap(i.name + (TIER_NOTE[i.tier] ? ` (${TIER_NOTE[i.tier]})` : '')).forEach(l => line(l));
    line(lr(`  ${i.qty} x ${n(i.price)}`, n(i.subtotal)));
  }
  sep();
  line(lr('Subtotal', n(sale.subtotal)));
  if (sale.discount) line(lr('Diskon', '-' + n(sale.discount)));
  bold(1); size(0x01); line(lr('TOTAL', n(sale.total))); size(0); bold(0);
  if (x.preorder) line(lr('DP pre-order ' + x.preorder.number, n(x.preorder.dp)));
  for (const l of payLines(sale, pays)) line(lr(l[0], n(l[1])));
  if (sale.change) line(lr('Kembali', n(sale.change)));
  if (sale.total > sale.paid) { bold(1); line(lr(sale.status === 'piutang' ? 'SISA BON' : 'BON (sudah lunas)', n(sale.total - sale.paid))); bold(0); }
  if (sale.status === 'batal') { align(1); bold(1); line('*** DIBATALKAN ***'); bold(0); align(0); }
  sep();
  if (st.receipt_footer) { align(1); wrap(st.receipt_footer).forEach(l => line(l)); align(0); }
  raw(0x1b, 0x64, 4); // feed 4 lines so the struk clears the tear bar
  return new Uint8Array(b);
}
// Hands the bytes to RawBT (Android). The intent form opens the Play Store
// page when RawBT isn't installed yet.
function sendRawBT(bytes) {
  let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  const b64 = btoa(s);
  location.href = /Android/i.test(navigator.userAgent)
    ? `intent:base64,${b64}#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;`
    : `rawbt:base64,${b64}`;
}
// Web Serial (Chrome / Edge on a PC): ESC/POS straight to the printer's COM

// after that Chrome remembers the port, so auto-print works without asking.
const hasSerial = () => 'serial' in navigator;
let serialPort = null;
async function serialConnect() {
  const port = await navigator.serial.requestPort();
  for (const p of await navigator.serial.getPorts()) if (p !== port) { try { await p.forget(); } catch (_) {} }
  if (serialPort && serialPort !== port) { try { await serialPort.close(); } catch (_) {} }
  serialPort = port;
  return port;
}
async function sendSerial(bytes) {
  if (!hasSerial()) throw new Error('Browser ini tidak mendukung printer serial. Pakai Chrome atau Edge di PC.');
  if (!serialPort) serialPort = (await navigator.serial.getPorts())[0] || null;
  if (!serialPort) throw new Error('Printer belum disambungkan. Buka 🖨 Printer → Sambungkan printer.');
  if (!serialPort.writable) {
    try { await serialPort.open({ baudRate: 9600 }); }
    catch (e) { throw new Error('Port printer tidak bisa dibuka (dipakai aplikasi lain, atau printer mati?). ' + e.message); }
  }
  const w = serialPort.writable.getWriter();
  try { await w.write(bytes); } finally { w.releaseLock(); }
}

    return;
  }
  if (POSP.printMode === 'rawbt') {
    try { sendRawBT(await escposReceipt(sale, items, pays)); }
    catch (e) { toast('Gagal menyiapkan struk untuk printer Bluetooth: ' + e.message, true); }

        <td data-l="Laba" class="r num" style="color:${margin < 0 ? 'var(--bad)' : 'var(--ok)'}"><span>${rp(margin)}${p.price ? ` <small class="muted">${Math.round(margin / p.price * 100)}%</small>` : ''}</span></td>
        <td class="r"><button class="btn sm" data-edit="${p.id}">Ubah</button> <button class="btn sm" data-stk="${p.id}">Stok</button></td>
      </tr>`;
    }).join('') : `<tr><td colspan="7" class="empty">Tidak ada produk.</td></tr>`;
    $('#ptbl').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editProduct(all.find(p => p.id === b.dataset.edit), cats, all, load));
    $('#ptbl').querySelectorAll('[data-stk]').forEach(b => b.onclick = () => openStockMove(all.find(p => p.id === b.dataset.stk), load));
  };
  $('#pq').oninput = () => { PF.q = $('#pq').value; draw(); };
  $('#pc').onchange = () => { PF.cat = $('#pc').value; draw(); };
  $('#ps').onchange = () => { PF.show = $('#ps').value; draw(); };
  $('#pnew').onclick = () => editProduct(null, cats, all, load);
  $('#pcat').onclick = () => manageCategories(load);
  try { await load(); } catch (e) { $('#ptbl tbody').innerHTML = `<tr><td colspan="7"><div class="err">${esc(e.message)}</div></td></tr>`; }
  if (S.openCategories) { S.openCategories = false; manageCategories(load); }
}

// Next SKU in the shop's existing style: TUN-TUN-0055 (category prefix twice,
// then one running number across all products).
function suggestSku(cat, all) {
  const pre = (cat?.name || 'PRD').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase().padEnd(3, 'X');
  const max = all.reduce((m, p) => Math.max(m, parseInt((p.sku.match(/(\d+)$/) || [])[1] || '0', 10)), 0);
  return `${pre}-${pre}-${String(max + 1).padStart(4, '0')}`;
}

// Two-press confirmation without a browser dialog: first press warns, second goes.
function confirmInline(boxId, msg) {
  const box = $('#' + boxId);
  if (box.dataset.armed === msg) { delete box.dataset.armed; return true; }
  box.dataset.armed = msg;
  box.innerHTML = `<div class="err" style="background:var(--warn-soft);color:var(--warn)">${esc(msg)}</div>`;
  return false;
}
