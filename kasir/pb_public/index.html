<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8590c">
<title>Nelin Batik</title>
<script>try{var t=localStorage.getItem('nb_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(_){}</script>
<style>
:root{
  --bg:#f6f5f3;--card:#fff;--ink:#1d1b19;--muted:#77716b;--line:#e7e3de;
  --accent:#e8590c;--accent-ink:#fff;--accent-soft:#fff1e8;
  --ok:#16803c;--ok-soft:#e8f6ed;--bad:#c62828;--bad-soft:#fdecec;--warn:#a15c00;--warn-soft:#fff6e0;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
/* Theme: Pengaturan → Tampilan stores auto / light / dark per device (nb_theme);
   auto follows the device, the other two pin it via <html data-theme>. */
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141210;--card:#1e1b18;--ink:#f1ece6;--muted:#a39a90;--line:#332e29;
  --accent:#ff7a33;--accent-ink:#1a0d05;--accent-soft:#3a2214;
  --ok:#4cc27a;--ok-soft:#173222;--bad:#ff6b6b;--bad-soft:#3a1a1a;--warn:#f0b44a;--warn-soft:#352a12;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#141210;--card:#1e1b18;--ink:#f1ece6;--muted:#a39a90;--line:#332e29;
  --accent:#ff7a33;--accent-ink:#1a0d05;--accent-soft:#3a2214;
  --ok:#4cc27a;--ok-soft:#173222;--bad:#ff6b6b;--bad-soft:#3a1a1a;--warn:#f0b44a;--warn-soft:#352a12;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:var(--shadow)}
.login h1{margin:0 0 2px;font-size:24px}
.login .btn{margin-top:18px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:56px}
.brand{font-weight:800;font-size:17px;white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:40px}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.who{font-size:13px;text-align:right;line-height:1.2;white-space:nowrap}
.who b{display:block;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
main{padding:16px}

/* POS */
.pos{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
/* grid children default to min-width:auto, so the scrolling chip row would
   stretch the column past the screen on phones */
.pos>*{min-width:0}
.search{display:flex;gap:8px;position:sticky;top:72px;z-index:5;background:var(--bg);padding-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:104px;box-shadow:var(--shadow);transition:transform .08s}
.prod:active{transform:scale(.97)}
.prod:disabled{opacity:.45}
.prod .n{font-weight:650;font-size:14px;line-height:1.25}
.prod .p{font-weight:800;color:var(--accent);margin-top:auto}
.prod .s{font-size:12px;color:var(--muted)}
.prod .s.low{color:var(--warn);font-weight:700}
.prod .inCart{align-self:flex-start}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

.cart{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:sticky;top:72px;display:flex;flex-direction:column;max-height:calc(100vh - 88px)}
.cart-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.cust{flex:1;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;min-height:44px}
.cust b{display:block;font-size:14px}
.cust small{color:var(--muted)}
.lines{overflow:auto;flex:1;padding:4px 16px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .n{font-weight:600;font-size:14px}
.line .u{font-size:13px;color:var(--muted)}
.line .t{font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800}
.qty input{width:44px;text-align:center;border:1px solid var(--line);border-radius:8px;height:32px;background:var(--card)}
.cart-f{padding:12px 16px 16px;border-top:1px solid var(--line)}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.extras .input{min-height:38px;padding:7px 10px;font-size:14px}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.sum.total{font-size:20px;font-weight:800;padding-top:6px}
.sum.disc{color:var(--ok)}
.cart-f .btn.primary{margin-top:12px;font-size:17px;min-height:52px}
.pv-err{color:var(--bad);font-size:13px;margin-top:6px}

/* mobile cart bar */
.cartbar{display:none}
@media (max-width:860px){
  .pos{grid-template-columns:1fr}
  .cart{display:none;position:fixed;inset:0;z-index:40;max-height:none;border-radius:0;border:0}
  .cart.open{display:flex}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:800;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  main{padding-bottom:96px}
  .top{flex-wrap:wrap;row-gap:0;padding-bottom:4px}
  .brand{flex:1}
  .nav{order:3;flex-basis:100%}
  .who .badge{display:none}
  .search{position:static}
}
.only-mobile{display:none}
@media (max-width:860px){.only-mobile{display:inline-flex}}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.modal{align-items:center;padding:16px}}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:600px){.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px;font-size:19px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:46px;font-weight:700}
.pick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bigtotal{font-size:30px;font-weight:800;text-align:center;margin:6px 0 2px}
.change{text-align:center;font-size:18px;font-weight:700;margin-top:10px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list-item:hover{background:var(--bg)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* receipt */
.receipt{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#000;border:1px dashed #bbb;border-radius:8px;padding:14px;margin:12px 0}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
#print{display:none}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:58mm;padding:2mm}
  #print .receipt{border:0;margin:0;padding:0;font-size:11px}
  body.print-a4 #print{width:auto;padding:0}
  .report-print{font:12px/1.4 system-ui,sans-serif;color:#000}
  .report-print .tbl{font-size:11px}
  .report-print .tbl th,.report-print .tbl td{padding:4px 6px;border-bottom:1px solid #ccc;color:#000}
  .report-print .sum{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:4px 0}
  .report-print .bar{background:#999}
}


/* tables / cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.tx:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:14px}
.stat small{color:var(--muted);font-weight:600}
.stat b{display:block;font-size:22px}
h3.sec{margin:18px 0 8px;font-size:15px}
.sm{font-size:12px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:44px}
.subtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:0}
.input.emp{margin:8px 12px 2px;width:calc(100% - 24px);font-weight:600}
.input.emp.need{border-color:var(--warn);background:var(--warn-soft)}
.swline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.swline.off{opacity:.5}
.swline .qty{flex:0 0 auto}
.swhits{display:grid;gap:4px;margin:6px 0 8px}
.swhits button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.swhits button:disabled{opacity:.5}
.tblwrap{overflow-x:auto}
.tbl .totrow td{border-top:2px solid var(--line);background:var(--bg)}
.pos-tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tool{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);min-height:34px}
.tool.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.prod .kodi{display:block;font-size:11px;font-weight:600;color:var(--ok)}
.prod.withimg{padding-top:8px}
.pimg{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:6px;background:var(--bg)}
.pimg.ph{display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--muted)}
.line .u.special{color:var(--ok);font-weight:600}
.lp{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:6px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:4px;min-height:0}
.cart-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:2px 0 4px;flex-wrap:wrap}
.cart-tools #cclear{color:var(--bad);border:1px solid var(--line);min-height:30px;padding:4px 10px}
.cart-tools .err{margin:0;padding:6px 10px;font-size:13px}
.choice-list{display:grid;gap:8px}
.pick{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pick:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block}.pick small{color:var(--muted)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff;text-decoration:none}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.linkrow>span{display:grid;min-width:0}.linkrow a{overflow-wrap:anywhere;font-size:13px}
.ship-list{display:grid;gap:10px}
.ship{padding:14px 16px;display:grid;gap:10px}
.ship-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ship-head .muted{margin-left:auto}
.ship-body{display:grid;gap:10px}
@media (min-width:861px){.ship-body{grid-template-columns:1fr minmax(300px,380px);align-items:center}}
.ship-resi{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
form.ship-resi .input{flex:1;min-width:0}
.ship-acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.ship-acts .btn{text-decoration:none}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.theme-opt{display:grid;gap:4px;align-content:start;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}
.theme-opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-opt input{position:absolute;opacity:0;pointer-events:none}
.theme-opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.theme-prev{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:10px 1fr;gap:4px;height:64px;padding:6px;border-radius:8px;margin-bottom:6px;border:1px solid var(--line)}
.theme-prev i:first-child{grid-column:1/-1;border-radius:3px}
.theme-prev i{border-radius:4px}
.theme-prev.light{background:#f6f5f3}.theme-prev.light i{background:#fff;border:1px solid #e7e3de}.theme-prev.light i:first-child{background:#e8590c;border:0}
.theme-prev.dark{background:#141210}.theme-prev.dark i{background:#1e1b18;border:1px solid #332e29}.theme-prev.dark i:first-child{background:#ff7a33;border:0}
.theme-prev.auto{background:linear-gradient(135deg,#f6f5f3 50%,#141210 50%)}.theme-prev.auto i{background:rgba(127,127,127,.35)}.theme-prev.auto i:first-child{background:#e8590c}
.subtabs .cnt{display:inline-block;min-width:22px;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--muted);font-size:12px;font-weight:700;text-align:center}
.subtabs button.on .cnt{background:var(--accent-soft);color:var(--accent)}
.range{align-items:center}
.range .chips{flex:1 1 100%}
.range .input{flex:1 1 140px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.statement{padding:16px 18px;max-width:560px}
.statement .sum{padding:6px 0;border-bottom:1px solid var(--line)}
.statement .sum.total{border-bottom:0;padding-top:12px}
.pl-sub{font-size:16px}
.tbl tr.hl td{background:var(--bg)}
.barcell{width:30%}
.bar{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.formcard{padding:16px 18px;max-width:720px}
textarea.input{min-height:90px;resize:vertical}
@media (max-width:720px){.barcell{display:none!important}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar>.input{flex:1 1 160px;width:auto}
.toolbar>#pq,.toolbar>#sp{flex:3 1 240px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.off td{opacity:.55}
.tbl td .btn.sm{min-height:32px}
/* Phones: each row becomes a small card with labels. */
@media (max-width:720px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left}
  .tbl td:first-child{display:block;text-align:left;padding-bottom:6px}
  .tbl td:first-child::before{display:none}
  .tbl td.empty{display:block;text-align:center}
  .tbl td:last-child:not([data-l]){justify-content:flex-end;gap:8px;padding-top:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="print"></div>
<script>
'use strict';
// Nelin Batik front end. Talks to PocketBase on the same origin. Prices,
// stock and permissions are decided by the server (pb_hooks); this page only
// shows what it's told and sends what the kasir picked.

const LS_AUTH = 'nb_auth';
const S = {
  token: '', user: null, settings: null,
  products: [], categories: [], methods: [],
  q: '', cat: '',
  cart: [],            // [{id, qty}]
  customer: null,      // users record (role pelanggan)
  voucher: '', points: 0, discount: 0,
  preview: null, previewErr: '',
  tab: 'pos',
};

// ── helpers ─────────────────────────────────────────
// @page can't depend on a class, so the paper size is swapped in just before
// printing: 58mm roll for receipts, A4 for reports.
function printAs(paper) {
  let st = document.getElementById('pagesize');
  if (!st) { st = document.createElement('style'); st.id = 'pagesize'; document.head.appendChild(st); }
  st.textContent = paper === 'a4' ? '@page{size:A4;margin:12mm}' : '@page{size:58mm auto;margin:0}';
  document.body.classList.toggle('print-a4', paper === 'a4');
  window.print();
  setTimeout(() => document.body.classList.remove('print-a4'), 500);
}
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const role = () => S.user?.role || '';
const isManager = () => role() === 'owner' || role() === 'admin';
const isOwner = () => role() === 'owner';
// Till preferences, per device: ask quantity on tap, show product photos.
const POSP = (() => { try { return Object.assign({ askQty: false, images: false }, JSON.parse(localStorage.getItem('nb_posp') || '{}')); } catch (_) { return { askQty: false, images: false }; } })();

let toastT;
function toast(msg, bad) {
  clearTimeout(toastT);
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); document.body.appendChild(t); }
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  toastT = setTimeout(() => t.remove(), bad ? 4500 : 2200);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: S.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token) { logout(); throw new Error('Sesi berakhir, silakan login lagi.'); }
  if (!r.ok) {
    // PocketBase puts field errors under data: {field: {message}}
    const fields = j.data && Object.entries(j.data).map(([k, v]) => `${k}: ${v.message}`).join(', ');
    throw new Error(fields ? `${j.message} (${fields})` : (j.message || `Error ${r.status}`));
  }
  return j;
}
const list = (coll, params = {}) => api(`/api/collections/${coll}/records?` + new URLSearchParams({ perPage: 500, ...params }));

function saveAuth(token, user) {
  S.token = token; S.user = user;
  try { localStorage.setItem(LS_AUTH, JSON.stringify({ token, user })); } catch (_) {}
}
function logout() {
  S.token = ''; S.user = null; S.cart = []; S.customer = null;
  try { localStorage.removeItem(LS_AUTH); } catch (_) {}
  renderLogin();
}
async function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_AUTH) || 'null'); } catch (_) {}
  if (!saved?.token) return renderLogin();
  S.token = saved.token;
  try {
    const r = await api('/api/collections/users/auth-refresh', { method: 'POST' });
    saveAuth(r.token, r.record);
    await startApp();
  } catch (_) { logout(); }
}

    list('categories', { sort: 'name' }),

function addToCart(id, n = 1) {
  const p = prodById(id); if (!p) return;

  if (l) l.qty += n; else S.cart.push({ id, qty: n });
  cartChanged();
}

// Line pricing, mirroring the server (lib.js splitPrice): every full 20 pcs
// at the kodian price, the rest at the normal price; a custom price (owner
// only) covers the whole line. The server recomputes it at checkout.
const KODI = 20;
function linePricing(l) {
  const p = prodById(l.id);
  if (!p) return [];
  if (l.price != null) return [{ qty: l.qty, price: l.price, tier: 'kustom' }];
  const k = p.price_kodi > 0 ? Math.floor(l.qty / KODI) * KODI : 0;
  const out = [];
  if (k) out.push({ qty: k, price: p.price_kodi, tier: 'kodian' });
  if (l.qty - k) out.push({ qty: l.qty - k, price: p.price, tier: 'normal' });
  return out;
}
const lineTotal = l => linePricing(l).reduce((a, x) => a + x.qty * x.price, 0);
// The owner's "Harga" button: automatic (normal/kodian) or a custom unit price.
function openLinePrice(id) {

      <label class="pick"><input type="radio" name="lp" value="custom" ${custom ? 'checked' : ''}><span><b>Harga khusus</b><small>Berlaku untuk semua ${l.qty} pcs di baris ini</small></span></label>
      <input class="input num" id="lpv" inputmode="numeric" placeholder="Harga per pcs" value="${custom ? l.price : ''}">
      <div id="lperr"></div>

  const v = $('#lpv');
  v.oninput = () => { document.querySelector('#lpf input[value=custom]').checked = true; };
  $('#lpno').onclick = closeModal;
  $('#lpf').onsubmit = ev => {
    ev.preventDefault();
    if (document.querySelector('#lpf input[name=lp]:checked').value === 'auto') { delete l.price; closeModal(); return cartChanged(); }
    const n = parseInt(v.value.replace(/\D/g, ''), 10);

    if (p.hpp && n < p.hpp && !confirmInline('lperr', `Di bawah modal (HPP ${rp(p.hpp)}). Tekan Simpan lagi untuk tetap memakai harga ini.`)) return;
    l.price = n; closeModal(); cartChanged();
  };
}
function setQty(id, qty) {
  const p = prodById(id);

  S.cart = S.cart.map(l => l.id === id ? { ...l, qty } : l).filter(l => l.qty > 0);
  cartChanged();
}

// Ask the server for the real totals whenever something that affects them
// changes. Debounced; a stale reply (cart changed meanwhile) is dropped.
let pvTimer, pvSeq = 0;
function schedulePreview() {
  clearTimeout(pvTimer);
  S.previewErr = '';
  if (!S.cart.length) { S.preview = null; renderTotals(); return; }
  pvTimer = setTimeout(async () => {
    const seq = ++pvSeq;
    try {
      const r = await api('/api/pos/preview', { method: 'POST', body: cartBody() });
      if (seq !== pvSeq) return;
      S.preview = r; S.previewErr = '';
    } catch (e) {
      if (seq !== pvSeq) return;
      S.preview = null; S.previewErr = e.message;
    }
    renderTotals();
  }, 250);
}

function renderTotals() {
  const el = $('#totals'); if (!el) return;
  const sub = localSubtotal();
  const p = S.preview;
  const items = S.cart.reduce((a, l) => a + l.qty, 0);
  el.innerHTML = `
    <div class="sum"><span>Subtotal (${items} item)</span><span class="num">${rp(p ? p.subtotal : sub)}</span></div>
    ${p && p.voucher_discount ? `<div class="sum disc"><span>Voucher</span><span class="num">−${rp(p.voucher_discount)}</span></div>` : ''}
    ${p && p.points_discount ? `<div class="sum disc"><span>Poin (${p.points_used})</span><span class="num">−${rp(p.points_discount)}</span></div>` : ''}
    ${p && p.discount - p.voucher_discount - p.points_discount > 0 ? `<div class="sum disc"><span>Diskon</span><span class="num">−${rp(p.discount - p.voucher_discount - p.points_discount)}</span></div>` : ''}
    <div class="sum total"><span>Total</span><span class="num">${rp(p ? p.total : sub)}</span></div>
    ${p && p.points_will_earn ? `<div class="sum muted"><span>Poin didapat (jika lunas)</span><span>+${p.points_will_earn}</span></div>` : ''}
    ${S.previewErr ? `<div class="pv-err">${esc(S.previewErr)}</div>` : ''}
    ${S.cart.length && S.employees?.length && !S.employee ? `<div class="pv-err">Pilih karyawan yang melayani dulu.</div>` : ''}`;
  const pay = $('#pay'); if (pay) pay.disabled = !S.cart.length || !!S.previewErr || (S.employees?.length > 0 && !S.employee);
  const bar = $('#cartbar');
  if (bar) {
    bar.classList.toggle('hidden', !S.cart.length);
    bar.innerHTML = `<span>${items} item</span><span class="num">${rp(p ? p.total : sub)} ›</span>`;
  }
}

// ── customer picker ─────────────────────────────────
function openModal(html) {
  $('#modal').innerHTML = `<div class="modal" id="mbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#mbg').onclick = ev => { if (ev.target.id === 'mbg') closeModal(); };
}
function closeModal() { $('#modal').innerHTML = ''; }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#mbg')) closeModal(); });

function openCustomerPicker() {
  openModal(`
    <h2>Pilih pelanggan</h2>
    <input class="input" id="cq" placeholder="Cari nama, username, atau no HP" autocomplete="off" style="margin-top:10px">
    <div id="cres" style="margin-top:6px"></div>
    <button class="btn block" id="cnew" style="margin-top:12px">+ Daftar member baru</button>`);
  const run = async () => {
    const v = $('#cq').value.trim();
    const f = v ? `role = "pelanggan" && (name ~ ${pbq(v)} || username ~ ${pbq(v)} || phone ~ ${pbq(v)})` : 'role = "pelanggan"';
    try {
      const r = await list('users', { filter: f, sort: '-updated', perPage: 20, fields: 'id,name,username,phone,points' });
      if (!$('#cres')) return;
      $('#cres').innerHTML = r.items.length ? r.items.map(u => `
        <button class="list-item" data-u="${u.id}">
          <span><b>${esc(u.name || u.username)}</b><br><small class="muted">@${esc(u.username)}${u.phone ? ' · ' + esc(u.phone) : ''}</small></span>
          <span class="badge">${u.points} poin</span>
        </button>`).join('') : `<div class="empty">Tidak ditemukan.</div>`;
      $('#cres').querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
        S.customer = r.items.find(u => u.id === b.dataset.u); S.points = 0;
        closeModal(); renderCart(); schedulePreview();
      });
    } catch (e) { $('#cres').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  let t; $('#cq').oninput = () => { clearTimeout(t); t = setTimeout(run, 200); };
  $('#cnew').onclick = openNewCustomer;
  $('#cq').focus(); run();
}

function openNewCustomer() {
  openModal(`
    <h2>Daftar member baru</h2>
    <div class="muted" style="font-size:14px">Pelanggan bisa login dengan username & password ini untuk melihat poin dan riwayat belanja.</div>
    <form id="nf">
      <label class="f">Nama</label><input class="input" id="nn" required maxlength="100">
      <label class="f">No HP / WhatsApp</label><input class="input" id="nh" inputmode="tel" maxlength="20">
      <label class="f">Username</label><input class="input" id="nu" required autocapitalize="none" pattern="[a-z0-9_.]{3,32}" title="3–32 huruf kecil, angka, titik atau _">
      <label class="f">Password (min. 8)</label><input class="input" id="np" required minlength="8">
      <div id="nerr"></div>
      <div class="row" style="margin-top:16px"><button type="button" class="btn" id="nback">Batal</button><button class="btn primary" id="nsave">Simpan</button></div>
    </form>`);
  // Suggest a username from the name.
  $('#nn').oninput = () => { if (!$('#nu').dataset.touched) $('#nu').value = $('#nn').value.toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '').slice(0, 32); };
  $('#nu').oninput = () => { $('#nu').dataset.touched = 1; };
  $('#nback').onclick = openCustomerPicker;
  $('#nf').onsubmit = async ev => {
    ev.preventDefault();
    $('#nsave').disabled = true;
    try {
      const pw = $('#np').value;
      const u = await api('/api/collections/users/records', { method: 'POST', body: {
        name: $('#nn').value.trim(), phone: $('#nh').value.trim(), username: $('#nu').value.trim().toLowerCase(),
        password: pw, passwordConfirm: pw, role: 'pelanggan' } });
      S.customer = u; S.points = 0;
      closeModal(); renderCart(); schedulePreview();
      toast('Member terdaftar.');
    } catch (e) {
      $('#nerr').innerHTML = `<div class="err">${esc(/username/.test(e.message) && /unique|exist/i.test(e.message) ? 'Username sudah dipakai.' : e.message)}</div>`;
      $('#nsave').disabled = false;
    }
  };
  $('#nn').focus();
}

// ── payment ─────────────────────────────────────────
function openPayment() {
  const p = S.preview;
  if (!p) return toast(S.previewErr || 'Menghitung total, coba lagi.', true);
  const total = p.total;
  let method = S.methods[0]?.id || '';
  let credit = false;
  // Quick cash buttons: exact, then the next round notes above the total.
  const quick = [...new Set([total, ...[10000, 20000, 50000, 100000].map(n => Math.ceil(total / n) * n)].filter(v => v >= total))].slice(0, 4);
  openModal(`
    <h2>Pembayaran</h2>
    <div class="bigtotal num">${rp(total)}</div>
    <label class="f">Metode</label>
    <div class="pick" id="pm">${S.methods.map(m => `<button type="button" data-m="${m.id}" class="${m.id === method ? 'on' : ''}">${esc(m.name)}</button>`).join('')}</div>
    <label class="f" for="paid">Uang diterima</label>
    <input class="input num" id="paid" inputmode="numeric" value="${total}" style="font-size:20px;font-weight:700">
    <div class="pick" id="qk" style="margin-top:8px">${quick.map(v => `<button type="button" data-v="${v}">${v === total ? 'Uang pas' : rp(v)}</button>`).join('')}</div>
    ${S.customer ? `
      <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="cr"> Sisanya jadi piutang (${esc(S.customer.name || S.customer.username)})</label>
      <div id="duewrap" class="hidden"><label class="f">Jatuh tempo</label><input class="input" type="date" id="due"></div>` : ''}
    <label class="f">Catatan</label><input class="input" id="note" maxlength="300">
    <div class="change" id="chg"></div>
    <div id="perr"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="pback">Kembali</button><button class="btn primary" id="pgo">Selesaikan</button></div>`);
  const paidI = $('#paid');
  const update = () => {
    const v = parseInt(paidI.value.replace(/\D/g, ''), 10) || 0;
    const ch = $('#chg'), go = $('#pgo');
    if (v >= total) { ch.innerHTML = `Kembalian <span class="num">${rp(v - total)}</span>`; ch.style.color = 'var(--ok)'; go.disabled = false; }
    else if (credit) { ch.innerHTML = `Piutang <span class="num">${rp(total - v)}</span>`; ch.style.color = 'var(--warn)'; go.disabled = false; }
    else { ch.innerHTML = `Kurang <span class="num">${rp(total - v)}</span>`; ch.style.color = 'var(--bad)'; go.disabled = true; }
    return v;
  };
  paidI.oninput = update;
  paidI.onfocus = () => paidI.select();
  $('#pm').querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    method = b.dataset.m;
    $('#pm').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#qk').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { paidI.value = b.dataset.v; update(); });
  if ($('#cr')) $('#cr').onchange = () => { credit = $('#cr').checked; $('#duewrap').classList.toggle('hidden', !credit); update(); };
  $('#pback').onclick = closeModal;
  $('#pgo').onclick = async () => {
    const go = $('#pgo');
    go.disabled = true; go.textContent = 'Menyimpan…';
    try {
      const r = await api('/api/pos/checkout', { method: 'POST', body: {
        ...cartBody(), payment_method: method, paid: update(), credit,
        due_date: credit && $('#due')?.value || '', note: $('#note').value.trim() } });
      resetSale();
      $('#cart')?.classList.remove('open');
      showReceipt(r.sale, r.items, true);
      loadCatalog().then(() => { if (S.tab === 'pos' && $('#grid')) { renderGrid(); renderCart(); } }).catch(() => {});
    } catch (e) {
      $('#perr').innerHTML = `<div class="err">${esc(e.message)}</div>`;
      go.disabled = false; go.textContent = 'Selesaikan';
    }
  };
  update(); paidI.focus();
}

// ── receipt ─────────────────────────────────────────
const TIER_NOTE = { kodian: 'kodian', kustom: 'harga khusus', retur: 'dikembalikan' };
function receiptHtml(sale, items) {
  const st = S.settings, x = sale.expand || {};
  const lines = s => esc(s || '').split('\n').map(l => `<div class="c">${l || '&nbsp;'}</div>`).join('');
  return `<div class="receipt">
    <div class="c"><b>${esc(st.store_name)}</b></div>
    ${st.receipt_header ? lines(st.receipt_header) : st.address ? `<div class="c">${esc(st.address)}</div>` : ''}
    <hr>
    <div>${esc(sale.number)}</div>
    <div>${fmtTime(sale.created)} · ${esc(x.cashier?.name || x.cashier?.username || '')}</div>
    ${x.employee ? `<div>Dilayani: ${esc(x.employee.name)}</div>` : ''}
    ${x.customer ? `<div>Member: ${esc(x.customer.name || x.customer.username)}</div>` : ''}
    <hr>
    ${sale.kind === 'tukar' ? `<div><b>TUKAR BARANG</b>${x.ref_sale ? ' dari ' + esc(x.ref_sale.number) : ''}</div><hr>` : ''}
    ${items.map(i => `<div>${esc(i.name)}${TIER_NOTE[i.tier] ? ` <small>(${TIER_NOTE[i.tier]})</small>` : ''}</div><div class="r"><span>${i.qty} x ${i.price.toLocaleString('id-ID')}</span><span>${i.subtotal.toLocaleString('id-ID')}</span></div>`).join('')}
    <hr>
    <div class="r"><span>Subtotal</span><span>${sale.subtotal.toLocaleString('id-ID')}</span></div>
    ${sale.discount ? `<div class="r"><span>Diskon</span><span>-${sale.discount.toLocaleString('id-ID')}</span></div>` : ''}
    <div class="r"><b>TOTAL</b><b>${sale.total.toLocaleString('id-ID')}</b></div>
    <div class="r"><span>${esc(x.payment_method?.name || 'Bayar')}</span><span>${(sale.paid + sale.change).toLocaleString('id-ID')}</span></div>
    ${sale.change ? `<div class="r"><span>Kembali</span><span>${sale.change.toLocaleString('id-ID')}</span></div>` : ''}
    ${sale.status === 'piutang' ? `<div class="r"><b>PIUTANG</b><b>${(sale.total - sale.paid).toLocaleString('id-ID')}</b></div>` : ''}
    ${sale.status === 'batal' ? `<div class="c"><b>*** DIBATALKAN ***</b></div>` : ''}
    ${x.customer && sale.points_earned ? `<div>Poin didapat: +${sale.points_earned}</div>` : ''}
    <hr>
    ${lines(st.receipt_footer)}
  </div>`;
}
function receiptText(sale, items) {
  const st = S.settings;
  return [`*${st.store_name}*`, sale.number, fmtTime(sale.created), sale.expand?.employee ? `Dilayani: ${sale.expand.employee.name}` : '', '',
    sale.kind === 'tukar' ? 'Tukar barang' : '',
    ...items.map(i => `${i.name}${TIER_NOTE[i.tier] ? ` (${TIER_NOTE[i.tier]})` : ''}\n  ${i.qty} x ${rp(i.price)} = ${rp(i.subtotal)}`), '',
    sale.discount ? `Diskon: -${rp(sale.discount)}` : '', `*Total: ${rp(sale.total)}*`,
    sale.status === 'piutang' ? `Sisa piutang: ${rp(sale.total - sale.paid)}` : '',
    sale.points_earned ? `Poin didapat: +${sale.points_earned}` : '', '', 'Terima kasih!'].filter((l, i, a) => l !== '' || a[i - 1] !== '').join('\n');
}
function waNumber(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d.startsWith('0')) d = '62' + d.slice(1);
  return d;
}
function showReceipt(sale, items, fresh) {
  const cust = sale.expand?.customer;
  openModal(`
    <h2>${fresh ? '✓ Transaksi berhasil' : 'Struk'}</h2>
    ${fresh && sale.change ? `<div class="change" style="color:var(--ok)">Kembalian <span class="num">${rp(sale.change)}</span></div>` : ''}
    ${receiptHtml(sale, items)}
    <div class="row">
      <button class="btn" id="rprint">🖨 Cetak</button>
      ${cust?.phone ? `<a class="btn" id="rwa" target="_blank" rel="noopener" href="https://wa.me/${waNumber(cust.phone)}?text=${encodeURIComponent(receiptText(sale, items))}">WhatsApp</a>` : ''}
    </div>
    ${role() !== 'pelanggan' && sale.status !== 'batal' && sale.kind !== 'tukar' && !fresh ? `<button class="btn block" id="rswap" style="margin-top:8px">Tukar barang</button>` : ''}
    ${isManager() && sale.status !== 'batal' && !fresh ? `<button class="btn danger block" id="rvoid" style="margin-top:8px">Batalkan transaksi</button>` : ''}
    <button class="btn primary block" id="rdone" style="margin-top:8px">${fresh ? 'Transaksi baru' : 'Tutup'}</button>`);
  $('#rprint').onclick = () => { $('#print').innerHTML = receiptHtml(sale, items); printAs('receipt'); };
  $('#rdone').onclick = () => { closeModal(); if (fresh) $('#q')?.focus(); };
  if ($('#rvoid')) $('#rvoid').onclick = () => openVoid(sale);
  if ($('#rswap')) $('#rswap').onclick = () => openSwap(sale.id).catch(e => toast(e.message, true));
}

// ── transactions ────────────────────────────────────
async function viewTx() {
  const kasir = role() === 'kasir';
  let day = wibToday();
  $('#view').innerHTML = `
    <div class="row" style="max-width:420px;margin-bottom:12px">
      ${kasir ? `<div class="muted" style="align-self:center">Transaksi kamu hari ini</div>` : `<input class="input" type="date" id="td" value="${day}" max="${day}">`}
      <button class="btn" id="tswap" style="flex:0 0 auto">Tukar barang</button>
    </div>
    <div id="tstats"></div>
    <div class="card" id="tlist"><div class="empty">Memuat…</div></div>`;
  const load = async () => {
    const next = new Date(Date.parse(day + 'T00:00:00Z') + 86400e3).toISOString().slice(0, 10);
    try {
      const r = await list('sales', {
        filter: `created >= "${wibStartUTC(day)}" && created < "${wibStartUTC(next)}"`,
        sort: '-created', perPage: 200, expand: 'customer,cashier,payment_method,ref_sale,employee' });
      const live = r.items.filter(s => s.status !== 'batal');
      $('#tstats').innerHTML = `<div class="stats">
        <div class="card stat"><small>Transaksi</small><b class="num">${live.length}</b></div>
        <div class="card stat"><small>Omzet</small><b class="num">${rp(live.reduce((a, s) => a + s.total, 0))}</b></div>
        <div class="card stat"><small>Diterima</small><b class="num">${rp(live.reduce((a, s) => a + s.paid, 0))}</b></div>
      </div>`;
      $('#tlist').innerHTML = r.items.length ? r.items.map(s => `
        <button class="tx" data-s="${s.id}">
          <span><b class="num">${esc(s.number)}</b> <span class="badge ${s.status === 'lunas' ? 'ok' : s.status === 'batal' ? 'bad' : 'warn'}">${s.status}</span>${s.kind === 'tukar' ? ` <span class="badge">tukar${s.expand?.ref_sale ? ' · ' + esc(s.expand.ref_sale.number) : ''}</span>` : ''}</span>
          <b class="num">${rp(s.total)}</b>
          <small class="muted">${fmtTime(s.created)} · ${esc(s.expand?.customer?.name || 'Umum')}${s.expand?.employee ? ' · ' + esc(s.expand.employee.name) : kasir ? '' : ' · ' + esc(s.expand?.cashier?.name || s.expand?.cashier?.username || '')}</small>
          <small class="muted">${esc(s.expand?.payment_method?.name || '')}</small>
        </button>`).join('') : `<div class="empty">Belum ada transaksi.</div>`;
      $('#tlist').querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
        const sale = r.items.find(s => s.id === b.dataset.s);
        try {
          const it = await list('sale_items', { filter: `sale = ${pbq(sale.id)}`, sort: 'created' });
          showReceipt(sale, it.items, false);
        } catch (e) { toast(e.message, true); }
      });
    } catch (e) { $('#tlist').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  if ($('#td')) $('#td').onchange = () => { day = $('#td').value || wibToday(); load(); };
  $('#tswap').onclick = askSwap;
  S.reloadTx = load;
  load();
}

function openVoid(sale) {
  openModal(`
    <h2>Batalkan ${esc(sale.number)}?</h2>
    <div class="muted">Stok dikembalikan, poin pelanggan ditarik, piutang ditutup. Tidak bisa diurungkan.</div>
    <label class="f">Alasan</label><input class="input" id="vr" maxlength="200" placeholder="mis. salah input, barang dikembalikan">
    <div id="verr"></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="vno">Jangan</button><button class="btn danger" id="vyes">Batalkan</button></div>`);
  $('#vno').onclick = closeModal;
  $('#vyes').onclick = async () => {
    const reason = $('#vr').value.trim();
    if (!reason) return $('#verr').innerHTML = `<div class="err">Isi alasan pembatalan.</div>`;
    $('#vyes').disabled = true;
    try {
      await api(`/api/pos/void/${sale.id}`, { method: 'POST', body: { reason } });
      closeModal(); toast('Transaksi dibatalkan.'); S.reloadTx?.();
    } catch (e) { $('#verr').innerHTML = `<div class="err">${esc(e.message)}</div>`; $('#vyes').disabled = false; }
  };
  $('#vr').focus();
}

// ── produk (owner/admin) ────────────────────────────
// Stock is shown here but changed only on the Stok tab: the server rejects a
// direct stock edit, so every change leaves a ledger line.
const PF = { q: '', cat: '', show: 'active' };
async function viewProducts() {
  $('#view').innerHTML = `
    <div class="toolbar">
      <input class="input" id="pq" placeholder="Cari nama / SKU / barcode" value="${esc(PF.q)}">
      <select class="input" id="pc"></select>
      <select class="input" id="ps">
        <option value="active">Aktif</option><option value="low">Stok menipis</option>
        <option value="inactive">Nonaktif</option><option value="all">Semua</option>
      </select>
      <button class="btn" id="pcat">Kategori</button>
      <button class="btn primary" id="pnew">+ Produk</button>
    </div>
    <div id="psum" class="muted" style="font-size:14px;margin-bottom:8px"></div>
    <div class="card"><table class="tbl" id="ptbl"><thead><tr>
      <th>Produk</th><th>Kategori</th><th class="r">Stok</th><th class="r">HPP</th><th class="r">Harga jual</th><th class="r">Laba</th><th></th>
    </tr></thead><tbody><tr><td colspan="7" class="empty">Memuat…</td></tr></tbody></table></div>`;
  $('#ps').value = PF.show;
  let all = [], cats = [];
  const load = async () => {
    const [p, c] = await Promise.all([list('products', { sort: 'name' }), list('categories', { sort: 'name' })]);
    all = p.items; cats = c.items; S.categories = cats;
    $('#pc').innerHTML = `<option value="">Semua kategori</option>` + cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    $('#pc').value = PF.cat;
    draw();
  };
  const draw = () => {
    const q = PF.q.trim().toLowerCase();
    const catName = id => cats.find(c => c.id === id)?.name || '—';
    const rows = all.filter(p =>
      (!PF.cat || p.category === PF.cat) &&
      (PF.show === 'all' || (PF.show === 'inactive' ? !p.active : p.active)) &&
      (PF.show !== 'low' || (p.min_stock > 0 && p.stock <= p.min_stock)) &&
      (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.barcode || '').toLowerCase().includes(q)));
    const value = rows.reduce((a, p) => a + p.hpp * Math.max(p.stock, 0), 0);
    $('#psum').textContent = `${rows.length} produk · ${rows.reduce((a, p) => a + p.stock, 0).toLocaleString('id-ID')} pcs · nilai stok (HPP) ${rp(value)}`;
    $('#ptbl tbody').innerHTML = rows.length ? rows.map(p => {
      const low = p.min_stock > 0 && p.stock <= p.min_stock;
      const margin = p.price - p.hpp;
      return `<tr class="${p.active ? '' : 'off'}">
        <td data-l="Produk"><b>${esc(p.name)}</b><div class="muted sm">${esc(p.sku)}${p.barcode ? ' · ' + esc(p.barcode) : ''}${p.active ? '' : ' · nonaktif'}</div></td>
        <td data-l="Kategori">${esc(catName(p.category))}</td>
        <td data-l="Stok" class="r num">${low ? `<span class="badge warn">${p.stock}</span>` : p.stock.toLocaleString('id-ID')}</td>
        <td data-l="HPP" class="r num">${rp(p.hpp)}</td>
        <td data-l="Harga jual" class="r num"><b>${rp(p.price)}</b>${p.price_kodi ? `<div class="muted sm">kodian ${rp(p.price_kodi)}</div>` : ''}</td>
        <td data-l="Laba" class="r num" style="color:${margin < 0 ? 'var(--bad)' : 'var(--ok)'}"><span>${rp(margin)}${p.price ? ` <small class="muted">${Math.round(margin / p.price * 100)}%</small>` : ''}</span></td>
        <td class="r"><button class="btn sm" data-edit="${p.id}">Ubah</button> <button class="btn sm" data-stk="${p.id}">Stok</button></td>
      </tr>`;
    }).join('') : `<tr><td colspan="7" class="empty">Tidak ada produk.</td></tr>`;

  };
  $('#pq').oninput = () => { PF.q = $('#pq').value; draw(); };
  $('#pc').onchange = () => { PF.cat = $('#pc').value; draw(); };
  $('#ps').onchange = () => { PF.show = $('#ps').value; draw(); };

  try { await load(); } catch (e) { $('#ptbl tbody').innerHTML = `<tr><td colspan="7"><div class="err">${esc(e.message)}</div></td></tr>`; }
}

// Next SKU in the shop's existing style: TUN-TUN-0055 (category prefix twice,
// then one running number across all products).
function suggestSku(cat, all) {
  const pre = (cat?.name || 'PRD').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase().padEnd(3, 'X');
  const max = all.reduce((m, p) => Math.max(m, parseInt((p.sku.match(/(\d+)$/) || [])[1] || '0', 10)), 0);
  return `${pre}-${pre}-${String(max + 1).padStart(4, '0')}`;
}

// Two-press confirmation without a browser dialog: first press warns, second goes.
function confirmInline(boxId, msg) {
  const box = $('#' + boxId);
  if (box.dataset.armed === msg) { delete box.dataset.armed; return true; }
  box.dataset.armed = msg;
  box.innerHTML = `<div class="err" style="background:var(--warn-soft);color:var(--warn)">${esc(msg)}</div>`;
  return false;
}

// ── shared: date ranges, sub-tabs, export ───────────
// All ranges are WIB calendar days; the server turns them into UTC bounds.
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10);
function presetRange(k) {
  const t = wibToday(), [y, m] = t.split('-').map(Number);
  const first = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}-01`;
  if (k === 'today') return [t, t];
  if (k === 'yesterday') return [addDays(t, -1), addDays(t, -1)];
  // weeks start on Monday
  const dow = (new Date(t + 'T00:00:00Z').getUTCDay() + 6) % 7;
  if (k === 'week') return [addDays(t, -dow), t];
  if (k === 'lastweek') return [addDays(t, -dow - 7), addDays(t, -dow - 1)];
  if (k === 'lastyear') return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  if (k === '7d') return [addDays(t, -6), t];
  if (k === 'month') return [first(y, m), t];
  if (k === 'lastmonth') { const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y; return [first(py, pm), addDays(first(y, m), -1)]; }
  if (k === 'year') return [`${y}-01-01`, t];
  // Rolling windows ending yesterday, so a period is whole days.
  if (k === '1m') return [addDays(t, -30), addDays(t, -1)];
  if (k === '3m') return [addDays(t, -91), addDays(t, -1)];
  if (k === '6m') return [addDays(t, -182), addDays(t, -1)];
}
const fd = d => new Date(d + 'T00:00:00Z').toLocaleDateString('id-ID', { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' });
// Renders preset buttons + two date inputs into `el`; calls onChange(from, to).
function rangePicker(el, state, onChange) {
  const presets = [['today', 'Hari ini'], ['yesterday', 'Kemarin'], ['week', 'Minggu ini'], ['lastweek', 'Minggu lalu'], ['month', 'Bulan ini'], ['lastmonth', 'Bulan lalu'],
    ['year', 'Tahun ini'], ['lastyear', 'Tahun lalu'], ['1m', '1 bulan'], ['3m', '3 bulan'], ['6m', '6 bulan']];
  el.innerHTML = `<div class="toolbar range">
    <div class="chips" style="padding:0">${presets.map(([k, l]) => `<button class="chip ${state.preset === k ? 'on' : ''}" data-p="${k}">${l}</button>`).join('')}</div>
    <input class="input" type="date" id="rf" value="${state.from}"><input class="input" type="date" id="rt" value="${state.to}">
  </div>`;
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    [state.from, state.to] = presetRange(b.dataset.p); state.preset = b.dataset.p;
    rangePicker(el, state, onChange); onChange();
  });
  const custom = () => {
    const f = $('#rf', el).value, t = $('#rt', el).value;
    if (!f || !t) return;
    state.from = f <= t ? f : t; state.to = f <= t ? t : f; state.preset = '';
    rangePicker(el, state, onChange); onChange();
  };
  $('#rf', el).onchange = custom; $('#rt', el).onchange = custom;
}
function subTabs(el, tabs, state, key, onChange) {
  el.innerHTML = `<div class="subtabs">${tabs.map(([k, l]) => `<button data-st="${k}" class="${state[key] === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  el.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { state[key] = b.dataset.st; subTabs(el, tabs, state, key, onChange); onChange(); });
  // on a phone the row scrolls sideways; keep the chosen tab in sight
  const on = $('.on', el), row = on?.parentElement;
  if (on && row.scrollWidth > row.clientWidth) row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
}
function downloadCSV(name, rows) {
  const cell = v => { const s = String(v ?? ''); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  // BOM + semicolons so Excel in Indonesian locale opens it in columns.
  const csv = '﻿' + rows.map(r => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function openSwap(key) {
  const orig = await api(`/api/pos/swap/${encodeURIComponent(key)}`);
  if (!S.products?.length || !S.methods?.length) await loadCatalog();
  const back = Object.fromEntries(orig.items.map(i => [i.product, 0]));
  const add = [];
  let q = '', swEmp = '';
  const draw = () => {
    const backVal = orig.items.reduce((a, i) => a + i.price * back[i.product], 0);
    const newVal = add.reduce((a, l) => a + lineTotal(l), 0);
    const diff = newVal - backVal;
    const hits = q.trim().length >= 2 ? S.products.filter(p => (p.name + ' ' + p.sku + ' ' + (p.barcode || '')).toLowerCase().includes(q.trim().toLowerCase())).slice(0, 6) : [];
    openModal(`
      <h2>Tukar barang <span class="num muted" style="font-size:15px">${esc(orig.number)}</span></h2>
      <div class="muted">${fmtTime(orig.created)} · ${esc(orig.customer || 'Umum')} · total ${rp(orig.total)}</div>
      <h3 class="sec">1. Barang yang dikembalikan</h3>
      ${orig.items.map(i => `<div class="swline ${i.left ? '' : 'off'}">
        <div><b>${esc(i.name)}</b><div class="muted sm">${rp(i.price)}/pcs · dibeli ${i.sold}${i.returned ? `, sudah ditukar ${i.returned}` : ''}</div></div>
        ${i.left ? `<div class="qty"><button type="button" data-bd="${i.product}" aria-label="Kurangi">−</button><input data-bq="${i.product}" value="${back[i.product]}" inputmode="numeric" aria-label="Jumlah dikembalikan"><button type="button" data-bi="${i.product}" aria-label="Tambah">+</button></div>` : `<span class="muted sm">habis ditukar</span>`}
      </div>`).join('')}
      <h3 class="sec">2. Barang baru</h3>
      <input class="input" id="swq" placeholder="Cari nama / SKU / scan barcode…" value="${esc(q)}" autocomplete="off">
      ${hits.length ? `<div class="swhits">${hits.map(p => `<button type="button" data-add="${p.id}" ${p.stock ? '' : 'disabled'}><b>${esc(p.name)}</b><span class="muted sm">${rp(p.price)} · stok ${p.stock}</span></button>`).join('')}</div>` : ''}
      ${add.map(l => { const p = prodById(l.id); return `<div class="swline">
        <div><b>${esc(p.name)}</b><div class="muted sm">${linePricing(l).map(x => x.tier === 'kodian' ? `${x.qty / KODI} kodi × ${rp(x.price)}` : `${x.qty} × ${rp(x.price)}`).join(' + ')}</div></div>
        <div class="qty"><button type="button" data-nd="${l.id}" aria-label="Kurangi">−</button><input data-nq="${l.id}" value="${l.qty}" inputmode="numeric" aria-label="Jumlah barang baru"><button type="button" data-ni="${l.id}" aria-label="Tambah">+</button></div>
      </div>`; }).join('') || `<div class="muted sm">Belum ada barang baru.</div>`}
      <h3 class="sec">3. Selisih</h3>
      <div class="sum"><span>Barang dikembalikan</span><span class="num">${rp(backVal)}</span></div>
      <div class="sum"><span>Barang baru</span><span class="num">${rp(newVal)}</span></div>
      <div class="sum total"><span>${diff >= 0 ? 'Pembeli bayar' : 'Kurang'}</span><span class="num">${rp(Math.abs(diff))}</span></div>
      ${diff < 0 ? `<div class="err">Barang baru lebih murah. Tukar hanya untuk barang senilai atau lebih mahal, uang tidak dikembalikan. Tambah barang atau pilih yang lain.</div>` : ''}
      ${diff > 0 ? `<div class="row" style="margin-top:8px"><select class="input" id="swm">${S.methods.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
        <input class="input num" id="swp" inputmode="numeric" placeholder="Uang diterima" value="${diff}"></div>` : ''}
      ${S.employees?.length ? `<select class="input" id="swe" style="margin-top:8px" aria-label="Karyawan yang melayani"><option value="">Pilih karyawan yang melayani…</option>${S.employees.map(x => `<option value="${x.id}" ${swEmp === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : ''}
      <input class="input" id="swnote" placeholder="Catatan (mis. ukuran kekecilan)" maxlength="120" style="margin-top:8px">
      <div id="swerr2"></div>
      <div class="row" style="margin-top:14px"><button type="button" class="btn" id="swcancel">Batal</button>
        <button type="button" class="btn primary" id="swok" ${backVal && newVal && diff >= 0 && (!S.employees?.length || swEmp) ? '' : 'disabled'}>Simpan tukar</button></div>`);
    if ($('#swe')) $('#swe').onchange = () => { swEmp = $('#swe').value; draw(); };
    const lim = id => orig.items.find(i => i.product === id).left;
    const setBack = (id, n) => { back[id] = Math.max(0, Math.min(lim(id), parseInt(n, 10) || 0)); draw(); };
    const setNew = (id, n) => { const l = add.find(x => x.id === id); const p = prodById(id); l.qty = Math.max(0, Math.min(p.stock, parseInt(n, 10) || 0)); if (!l.qty) add.splice(add.indexOf(l), 1); draw(); };
    document.querySelectorAll('[data-bi]').forEach(b => b.onclick = () => setBack(b.dataset.bi, back[b.dataset.bi] + 1));
    document.querySelectorAll('[data-bd]').forEach(b => b.onclick = () => setBack(b.dataset.bd, back[b.dataset.bd] - 1));
    document.querySelectorAll('[data-bq]').forEach(i => i.onchange = () => setBack(i.dataset.bq, i.value));
    document.querySelectorAll('[data-ni]').forEach(b => b.onclick = () => setNew(b.dataset.ni, add.find(x => x.id === b.dataset.ni).qty + 1));
    document.querySelectorAll('[data-nd]').forEach(b => b.onclick = () => setNew(b.dataset.nd, add.find(x => x.id === b.dataset.nd).qty - 1));
    document.querySelectorAll('[data-nq]').forEach(i => i.onchange = () => setNew(i.dataset.nq, i.value));
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { const l = add.find(x => x.id === b.dataset.add); if (l) l.qty++; else add.push({ id: b.dataset.add, qty: 1 }); q = ''; draw(); });
    const sq = $('#swq');
    sq.oninput = () => { q = sq.value; clearTimeout(sq.t); sq.t = setTimeout(() => { draw(); const n = $('#swq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 200); };
    sq.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); const p = S.products.find(x => x.barcode && x.barcode === sq.value.trim() || x.sku === sq.value.trim().toUpperCase()); if (p) { const l = add.find(x => x.id === p.id); if (l) l.qty++; else add.push({ id: p.id, qty: 1 }); q = ''; draw(); } } };
    $('#swcancel').onclick = closeModal;
    $('#swok').onclick = async () => {
      const b = $('#swok'); b.disabled = true;
      try {
        const r = await api('/api/pos/swap', { method: 'POST', body: {
          sale: orig.id, returns: orig.items.filter(i => back[i.product]).map(i => ({ product: i.product, qty: back[i.product] })),
          items: add.map(l => ({ product: l.id, qty: l.qty })),
          payment_method: $('#swm')?.value || '', paid: parseInt(($('#swp')?.value || '0').replace(/\D/g, ''), 10) || 0,
          note: $('#swnote').value.trim(), employee: swEmp } });
        await loadCatalog();
        showReceipt(r.sale, r.items, true);
        S.reloadTx?.();
      } catch (e) { $('#swerr2').innerHTML = `<div class="err">${esc(e.message)}</div>`; b.disabled = false; }
    };
  };
  draw();
}

// Minimal .xlsx writer: one sheet, inline strings, numbers as numbers, rupiah
// columns formatted #,##0. Files are zipped uncompressed ("stored"), which
// Excel, LibreOffice and Google Sheets all open.
function downloadXLSX(name, sheet, rows, rpCols) {
  const x = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const widths = [];
  rows.forEach((r, ri) => { if (ri > 2) r.forEach((v, i) => { widths[i] = Math.min(50, Math.max(widths[i] || 8, String(typeof v === 'number' ? v.toLocaleString('id-ID') : v ?? '').length + 2)); }); });
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r, ri) =>
    `<row r="${ri + 1}">${r.map((v, ci) => v === '' || v == null ? '' : typeof v === 'number'
      ? `<c r="${col(ci)}${ri + 1}"${rpCols[ci] ? ' s="1"' : ''}><v>${v}</v></c>`
      : `<c r="${col(ci)}${ri + 1}" t="inlineStr"${ri === 3 || ri === 0 ? ' s="2"' : ''}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const files = {
    '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
    '_rels/.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    'xl/workbook.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(sheet.slice(0, 31).replace(/[\\/?*[\]:]/g, ' '))}" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    'xl/styles.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf numFmtId="164" applyNumberFormat="1"/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>`,
    'xl/worksheets/sheet1.xml': sheetXml,
  };
  const blob = zipStore(files);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// ZIP with "stored" entries (no compression): local headers, data, central directory.
function zipStore(files) {
  const enc = new TextEncoder(), crcT = zipStore.t || (zipStore.t = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; }));
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let off = 0;
  for (const [n, s] of Object.entries(files)) {
    const name = enc.encode(n), data = enc.encode(s), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(h, name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c, name);
    off += 30 + name.length + data.length;
  }
  const size = central.reduce((a, p) => a + (p.byteLength ?? p.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

        <label class="f">Dibayar dengan</label><select class="input" id="xm"><option value="">—</option>${methods.map(m => `<option value="${m.id}" ${m.id === x.payment_method ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
        <label class="f">Keterangan</label><input class="input" id="xn" maxlength="300" value="${esc(x.note)}">
        <div id="xerr"></div>
        <div class="row" style="margin-top:16px">
          ${!isNew && role() === 'owner' ? `<button type="button" class="btn danger" id="xdel">Hapus</button>` : `<button type="button" class="btn" id="xno">Batal</button>`}
          <button class="btn primary" id="xok">Simpan</button></div>
      </form>`);
    if ($('#xno')) $('#xno').onclick = closeModal;
    if ($('#xdel')) $('#xdel').onclick = async () => {
      if (!confirmInline('xerr', 'Tekan Hapus sekali lagi untuk menghapus pengeluaran ini.')) return;
      try { await api(`/api/collections/expenses/records/${x.id}`, { method: 'DELETE' }); closeModal(); toast('Dihapus.'); load(); } catch (e) { $('#xerr').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
    $('#xf').onsubmit = async ev => {
      ev.preventDefault();
      const amount = parseInt($('#xa').value.replace(/\D/g, ''), 10) || 0;
      if (amount < 1) return $('#xerr').innerHTML = `<div class="err">Isi jumlahnya.</div>`;
      $('#xok').disabled = true;
      try {
        await api(`/api/collections/expenses/records${isNew ? '' : '/' + x.id}`, { method: isNew ? 'POST' : 'PATCH', body: {
          date: $('#xd').value + ' 00:00:00.000Z', amount, category: $('#xc').value.trim(),
          payment_method: $('#xm').value, note: $('#xn').value.trim(), ...(isNew ? { by: S.user.id } : {}) } });
        closeModal(); toast('Tersimpan.'); load();
      } catch (e) { $('#xerr').innerHTML = `<div class="err">${esc(e.message)}</div>`; $('#xok').disabled = false; }
    };
  };
  $('#enew').onclick = () => editExpense(null);
  load();
}

async function finReceivables(el) {
  el.innerHTML = `<div class="toolbar"><select class="input" id="rs" style="flex:0 1 200px">
      <option value="belum">Belum lunas</option><option value="lunas">Lunas</option><option value="batal">Batal</option><option value="">Semua</option></select>
      <div id="rtot" class="muted" style="flex:1;align-self:center"></div></div>
    <div class="card"><table class="tbl" id="rtbl"><thead><tr><th>Pelanggan</th><th>Transaksi</th><th>Jatuh tempo</th><th class="r">Piutang</th><th class="r">Dibayar</th><th class="r">Sisa</th><th></th></tr></thead><tbody><tr><td colspan="7" class="empty">Memuat…</td></tr></tbody></table></div>`;
  $('#rs').value = FS.rstatus;
  $('#rs').onchange = () => { FS.rstatus = $('#rs').value; load(); };
  const load = async () => {
    try {
      const r = await list('receivables', { ...(FS.rstatus ? { filter: `status = ${pbq(FS.rstatus)}` } : {}), sort: 'status,due_date,-created', expand: 'customer,sale' });
      const open = r.items.filter(x => x.status === 'belum');
      $('#rtot').innerHTML = open.length ? `Sisa piutang <b class="num" style="color:var(--warn)">${rp(open.reduce((a, x) => a + x.amount - x.paid, 0))}</b> dari ${open.length} transaksi` : '';
      const today = wibToday();
      $('#rtbl tbody').innerHTML = r.items.length ? r.items.map(x => {
        const c = x.expand?.customer, due = x.due_date ? x.due_date.slice(0, 10) : '';
        const late = x.status === 'belum' && due && due < today;
        return `<tr>
          <td data-l="Pelanggan"><b>${esc(c?.name || c?.username || '—')}</b><div class="muted sm">${esc(c?.phone || '')}</div></td>
          <td data-l="Transaksi" class="num">${esc(x.expand?.sale?.number || '')}<div class="muted sm">${x.expand?.sale ? fmtTime(x.expand.sale.created) : ''}</div></td>
          <td data-l="Jatuh tempo">${due ? `<span class="${late ? 'badge bad' : ''}">${fd(due)}${late ? ' · lewat' : ''}</span>` : '<span class="muted">—</span>'}</td>
          <td data-l="Piutang" class="r num">${rp(x.amount)}</td>
          <td data-l="Dibayar" class="r num">${rp(x.paid)}</td>
          <td data-l="Sisa" class="r num"><b>${x.status === 'belum' ? rp(x.amount - x.paid) : `<span class="badge ${x.status === 'lunas' ? 'ok' : 'bad'}">${x.status}</span>`}</b></td>
          <td class="r">${x.status === 'belum' ? `<button class="btn sm primary" data-pay="${x.id}">Bayar</button>` : ''} <button class="btn sm" data-hist="${x.id}">Riwayat</button>
            ${x.status === 'belum' && c?.phone ? `<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(`Halo ${c.name || ''}, ini pengingat dari ${S.settings.store_name}: sisa pembayaran transaksi ${x.expand?.sale?.number || ''} sebesar ${rp(x.amount - x.paid)}${due ? `, jatuh tempo ${fd(due)}` : ''}. Terima kasih 🙏`)}">Ingatkan</a>` : ''}</td>
        </tr>`;
      }).join('') : `<tr><td colspan="7" class="empty">Tidak ada piutang.</td></tr>`;
      $('#rtbl').querySelectorAll('[data-pay]').forEach(b => b.onclick = () => payReceivable(r.items.find(x => x.id === b.dataset.pay)));
      $('#rtbl').querySelectorAll('[data-hist]').forEach(b => b.onclick = () => receivableHistory(r.items.find(x => x.id === b.dataset.hist)));
    } catch (e) { $('#rtbl tbody').innerHTML = `<tr><td colspan="7"><div class="err">${esc(e.message)}</div></td></tr>`; }
  };
  const payReceivable = async x => {
    const methods = (await list('payment_methods', { filter: 'active = true', sort: 'created' })).items;
    const left = x.amount - x.paid;
    let method = methods[0]?.id || '';
    openModal(`<h2>Bayar piutang</h2>
      <div class="muted">${esc(x.expand?.customer?.name || '')} · ${esc(x.expand?.sale?.number || '')}</div>
      <div class="bigtotal num">${rp(left)}</div>
      <label class="f">Metode</label><div class="pick" id="ym">${methods.map(m => `<button type="button" data-m="${m.id}" class="${m.id === method ? 'on' : ''}">${esc(m.name)}</button>`).join('')}</div>
      <label class="f">Jumlah dibayar</label><input class="input num" id="ya" inputmode="numeric" value="${left}" style="font-size:20px;font-weight:700">
      <label class="f">Catatan</label><input class="input" id="yn" maxlength="300">
      <div id="yerr"></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="yno">Batal</button><button class="btn primary" id="yok">Simpan</button></div>`);
    $('#ym').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { method = b.dataset.m; $('#ym').querySelectorAll('button').forEach(z => z.classList.toggle('on', z === b)); });
    $('#yno').onclick = closeModal;
    $('#yok').onclick = async () => {
      $('#yok').disabled = true;
      try {
        const r = await api('/api/receivables/pay', { method: 'POST', body: { receivable: x.id, amount: parseInt($('#ya').value.replace(/\D/g, ''), 10) || 0, payment_method: method, note: $('#yn').value.trim() } });
        closeModal(); toast(r.left ? `Tersimpan. Sisa ${rp(r.left)}.` : 'Lunas!'); load();
      } catch (e) { $('#yerr').innerHTML = `<div class="err">${esc(e.message)}</div>`; $('#yok').disabled = false; }
    };
    $('#ya').select();
  };
  const receivableHistory = async x => {
    const p = await list('receivable_payments', { filter: `receivable = ${pbq(x.id)}`, sort: 'created', expand: 'payment_method,by' });
    openModal(`<h2>Riwayat ${esc(x.expand?.sale?.number || '')}</h2>
      <div class="sum"><span>Piutang awal</span><b class="num">${rp(x.amount)}</b></div>
      ${p.items.map(y => `<div class="sum"><span>${fmtTime(y.created)} · ${esc(y.expand?.payment_method?.name || '')}<br><small class="muted">${esc(y.note)} ${esc(y.expand?.by?.name || '')}</small></span><span class="num" style="color:var(--ok)">−${rp(y.amount)}</span></div>`).join('') || '<div class="empty">Belum ada pembayaran.</div>'}
      <div class="sum total"><span>Sisa</span><span class="num">${rp(x.status === 'belum' ? x.amount - x.paid : 0)}</span></div>`);
  };
  load();
}
