# /etc/nginx/sites-available/nelin-store — the public shop.
# Static files from /var/www/nelin-store (copied there by publish.sh);
# /api/ goes to the same PocketBase the kasir app uses, so stock is shared.
server {
    listen 80;
    listen [::]:80;
    server_name toko-nelin.necutbarber.shop toko-nelin.home;

    root /var/www/nelin-store;
    index index.html;
    client_max_body_size 6m;   # payment proof uploads (5 MB limit in the app)

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    # The store is a public front; the PocketBase admin panel stays on the
    # kasir address only.
    location /_/ { return 404; }

    location ~* \.(js|css)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
